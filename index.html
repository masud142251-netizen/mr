    <script>
        function playVipSmoothSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.15);
                
                gainNode.gain.setValueAtTime(0.12, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
                
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.35);
            } catch(e) {}
        }

        document.addEventListener('DOMContentLoaded', () => {
            const widget = document.getElementById('floatingCartWidget');
            let isDragging = false;
            let startX, startY, initialX, initialY;

            widget.addEventListener('pointerdown', (e) => {
                isDragging = false;
                startX = e.clientX;
                startY = e.clientY;
                initialX = widget.offsetLeft;
                initialY = widget.offsetTop;
                widget.setPointerCapture(e.pointerId);
            });

            widget.addEventListener('pointermove', (e) => {
                if (!startX || !startY) return;
                let dx = e.clientX - startX;
                let dy = e.clientY - startY;
                if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
                    isDragging = true;
                }
                if (isDragging) {
                    widget.style.left = `${initialX + dx}px`;
                    widget.style.top = `${initialY + dy}px`;
                    widget.style.right = 'auto';
                }
            });

            widget.addEventListener('pointerup', (e) => {
                startX = null;
                startY = null;
            });

            widget.addEventListener('click', (e) => {
                if (isDragging) {
                    e.stopPropagation();
                    isDragging = false;
                }
            });
        });
    </script>

            </div>

            <div style="display:flex; gap:8px; align-items:center; background:#141418; border-radius:10px; padding:6px 6px 6px 12px; width:100%;">
                <input type="text" id="customerChatInputField" placeholder="TYPE MESSAGE..." style="background:none; border:none; outline:none; color:#fff; font-size:0.8rem; width:100%; font-family:var(--font-main);">
                <button onclick="sendCustomerChatMessage()" style="background:var(--gold-gradient); border:none; color:#000; font-weight:700; font-size:0.72rem; padding:8px 14px; border-radius:8px; cursor:pointer; white-space:nowrap;">SEND</button>
            </div>
        </div>
    </div>

    <!-- প্রোডাক্ট ইনফো মডাল -->
    <div id="infoPopupModal" onclick="if(event.target === this) closeProductInfoModal()">
        <div class="info-popup-box-custom" onclick="event.stopPropagation()">
            <div style="display:flex; align-items:center; gap:12px; background:#16161c; padding:10px 14px; border-radius:10px; width:100%;">
                <img id="infoPopupHeaderImg" src="https://0d2bc64b36fe70d346646a8bf8bfd5a.r2.cloudflarestorage.com/bracelet-1.jpg" style="width:38px; height:38px; object-fit:cover; border-radius:8px; background:#000;">
                <div style="display:flex; flex-direction:column; flex:1; text-align:left;">
                    <span style="font-size:0.68rem; color:var(--gold-solid); font-weight:500;">PRODUCT INFO</span>
                    <span id="infoPopupHeaderTitle" style="font-size:0.85rem; font-weight:600; color:#fff;">PREMIUM BRACELET</span>
                </div>
            </div>
            <div id="infoPopupBody" style="font-size:0.78rem; color:var(--text-gray); line-height:1.5; max-height:270px; overflow-y:auto; display:flex; flex-direction:column; gap:12px; padding:4px; width:100%; text-align:left;"></div>
        </div>
    </div>

    <!-- শেয়ার মডাল -->
    <div id="shareModal" onclick="if(event.target === this) toggleShareModal();">
        <div class="share-box-content" onclick="event.stopPropagation()">
            <h3 style="background:var(--gold-gradient); -webkit-background-clip:text; -webkit-text-fill-color:transparent; font-size:0.9rem; text-align:center;">SHARE PRODUCT</h3>
            <div class="share-options-grid">
                <div class="share-opt-btn" onclick="shareToSocial('whatsapp')"><i class="fa-brands fa-whatsapp"></i><span>WHATSAPP</span></div>
                <div class="share-opt-btn" onclick="shareToSocial('facebook')"><i class="fa-brands fa-facebook"></i><span>FACEBOOK</span></div>
                <div class="share-opt-btn" onclick="shareToSocial('telegram')"><i class="fa-brands fa-telegram"></i><span>TELEGRAM</span></div>
                <div class="share-opt-btn" onclick="shareToSocial('gmail')"><i class="fa-solid fa-envelope"></i><span>GMAIL</span></div>
            </div>
            <div style="display:flex; gap:8px; width:100%;">
                <input type="text" id="shareUrlInput" class="lowercase-url" readonly value="https://rorraxy.com/item/prod-9901" style="background:#141418; border:1px solid rgba(255,255,255,0.06); padding:10px 12px; border-radius:8px; color:#fff; font-size:0.75rem; width:100%; outline:none;">
                <button onclick="copyShareLinkDirect()" style="background:var(--gold-gradient); border:none; color:#000; font-weight:600; font-size:0.72rem; padding:10px 14px; border-radius:8px; cursor:pointer; white-space:nowrap;">COPY</button>
            </div>
        </div>
    </div>

    <!-- সার্চ পপআপ കണ്ടেইনার -->
    <div id="searchPopupContainer" onclick="if(event.target === this) toggleSearchPopup()">
        <div class="search-input-field-box" onclick="event.stopPropagation()" style="max-width: 520px; width: 92%;">
            <i class="fa-solid fa-magnifying-glass" style="color:var(--gold-solid);"></i>
            <input type="text" id="searchInputField" placeholder="SEARCH RORRAXY COLLECTIONS...">
            <button class="search-submit-btn" onclick="executeSearch()">SEARCH</button>
        </div>
    </div>

    <!-- বটম ন্যাভবার (সঠিক পেজ লিংকসহ যুক্ত) -->
    <nav class="bottom-nav">
        <a href="affiliate.html" class="nav-item">
            <i class="fa-solid fa-handshake"></i>
            <span>Affiliate</span>
        </a>
        <a href="seller.html" class="nav-item">
            <i class="fa-solid fa-chart-line"></i>
            <span>Seller</span>
        </a>
        <a href="account.html" class="nav-item">
            <i class="fa-solid fa-user-circle"></i>
            <span>YOU</span>
        </a>
        <a href="category.html" class="nav-item">
            <i class="fa-solid fa-border-all"></i>
            <span>CATEGORY</span>
        </a>
        <div class="nav-item" onclick="toggleSearchPopup()">
            <i class="fa-solid fa-magnifying-glass"></i>
            <span>SEARCH</span>
        </div>
    </nav>

    <script>
        let visitorCountryCode = "bd";

        function closeAllPanels() {
            document.getElementById('cartModal').style.display = 'none';
            document.getElementById('searchPopupContainer').style.display = 'none';
            document.getElementById('shareModal').style.display = 'none';
            document.getElementById('infoPopupModal').style.display = 'none';
            document.getElementById('customerChatModal').style.display = 'none';
        }

        function updateCartBadge() {
            let cart = JSON.parse(localStorage.getItem('rorraxy_cart')) || [];
            let totalQty = cart.reduce((sum, item) => sum + (item.qty || 1), 0);
            let badgeEl = document.getElementById('floatingCartCountBadge');
            if(badgeEl) {
                badgeEl.innerText = totalQty;
            }
        }

        window.onload = function() {
            closeAllPanels();
            updateCartBadge();

            fetch('https://ipapi.co/json/').then(r => r.json()).then(d => {
                if(d.country_code) {
                    visitorCountryCode = d.country_code.toLowerCase();
                    document.getElementById('visitorFlagImg').src = `https://flagcdn.com/w80/${visitorCountryCode}.png`;
                    let localCurrFlag = document.getElementById('localCurrFlag');
                    if(localCurrFlag) localCurrFlag.src = `https://flagcdn.com/w80/${visitorCountryCode}.png`;
                }
            }).catch(() => {});
        };

        function renderCartModal() {
            let cart = JSON.parse(localStorage.getItem('rorraxy_cart')) || [];
            let container = document.getElementById('cartItemsPreviewBox');
            let totalValEl = document.getElementById('cartModalTotalVal');
            let totalQtyEl = document.getElementById('cartModalTotalQty');
            let localCurrText = document.getElementById('localCurrText');

            if(cart.length === 0) {
                container.innerHTML = '<div style="color:var(--text-gray); text-align:center; font-size:0.78rem; padding:14px;">YOUR CART IS EMPTY.</div>';
                totalValEl.innerText = "$0.00";
                totalQtyEl.innerText = "0";
                localCurrText.innerText = visitorCountryCode === 'bd' ? "৳ 0.00 BDT" : "₹ 0.00 INR";
                return;
            }
            let html = '', totalAmt = 0, totalQty = 0;
            cart.forEach((item, index) => {
                let priceNum = parseFloat(item.price.replace('$', '').replace(/,/g, ''));
                let itemTotal = priceNum * item.qty;
                totalAmt += itemTotal;
                totalQty += item.qty;
                let sizeInfo = item.size ? ` | SIZE: ${item.size.toUpperCase()}` : '';
                let imgSrc = item.img && !item.img.includes('youtube') && !item.img.includes('embed') ? item.img : 'https://0d2bc64b36fe70d346646a8bf8bfd5a.r2.cloudflarestorage.com/bracelet-1.jpg';
                html += `
                <div class="cart-item-row">
                    <img src="${imgSrc}" class="cart-item-img" onerror="this.src='https://lh3.googleusercontent.com/d/1a6lFxluTSYUQjB8oqlVQYApRRSmCxEOW'">
                    <div class="cart-item-info">
                        <span class="cart-item-title">${item.title}</span>
                        <span class="cart-item-qty-price">QTY: ${item.qty}${sizeInfo} | $${itemTotal.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}</span>
                    </div>
                    <button class="cart-item-delete" onclick="removeCartItem(${index})" title="Delete"><i class="fa-solid fa-trash-can"></i></button>
                </div>`;
            });
            container.innerHTML = html;
            totalValEl.innerText = `$${totalAmt.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
            totalQtyEl.innerText = `${totalQty}`;

            let rate = 118;
            let symbol = "৳";
            let currName = "BDT";
            if(visitorCountryCode === 'pk') { rate = 278; symbol = "₨"; currName = "PKR"; }
            else if(visitorCountryCode === 'in') { rate = 83; symbol = "₹"; currName = "INR"; }

            let localConverted = totalAmt * rate;
            localCurrText.innerText = `${symbol} ${localConverted.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})} ${currName}`;
        }

        function removeCartItem(index) {
            let cart = JSON.parse(localStorage.getItem('rorraxy_cart')) || [];
            cart.splice(index, 1);
            localStorage.setItem('rorraxy_cart', JSON.stringify(cart));
            updateCartBadge();
            renderCartModal();
        }

        function toggleCartModal() {
            const modal = document.getElementById('cartModal');
            if (modal.style.display === 'flex') {
                modal.style.display = 'none';
            } else {
                closeAllPanels();
                renderCartModal();
                modal.style.display = 'flex';
            }
        }

        function toggleSearchPopup() {
            const popup = document.getElementById('searchPopupContainer');
            if (popup.style.display === 'flex') {
                popup.style.display = 'none';
            } else {
                closeAllPanels();
                popup.style.display = 'flex';
            }
        }
        function executeSearch() { document.getElementById('searchPopupContainer').style.display = 'none'; }
    </script>
</body>
</html>

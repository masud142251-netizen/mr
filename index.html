        body {

            color: var(--text-white);

        .portal-wrapper {

        .custom-toast {

            color: var(--gold-solid); padding: 6px 14px; border-radius: 20px; 
            font-size: 0.65rem; font-weight: 700; z-index: 999999; display: none; 
            box-shadow: 0 0 15px rgba(212,175,55,0.3);

        .luxury-card {

            border: 1px solid rgba(212, 175, 55, 0.25);
            border-radius: 14px;
            padding: 16px 14px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.95);
            width: 100%;
            position: relative;
            margin: 0 auto;
        }

            margin-bottom: 8px;

        .bar-label { font-size: 0.45rem; color: var(--text-gray); text-transform: uppercase; }

                        </select>
                    </div>
                    <div style="margin-bottom:10px;">
                        <label style="font-size:0.58rem; color:var(--gold-solid); display:block; margin-bottom:3px;" id="payoutInputLabel">${labelText}</label>
                        <input type="text" id="editPayoutAccount" value="${user.payoutAccount || ''}" placeholder="${placeholderText}" style="background:#000; border:1px solid rgba(212,175,55,0.3); padding:7px; color:#fff; width:100%; border-radius:6px; font-size:0.7rem;">
                    </div>
                    <div style="text-align:right; margin-top:10px;">
                        <button onclick="savePaymentChanges()" type="button" class="apply-btn" style="padding:6px 16px; font-size:0.65rem;">Save Payment</button>
                    </div>
                `;
            } else if(tab === 'security') {
                if (user.tfaEnabled) {
                    contentHtml = `
                        <div style="text-align:center; padding:15px 0;">
                            <div style="font-size: 2rem; color: #2ecc71; margin-bottom: 6px;"><i class="fa-solid fa-circle-check"></i></div>
                            <p style="font-size:0.75rem; color:var(--text-white); font-weight:700; margin-bottom:4px;">2FA Secured & Verified</p>
                            <p style="font-size:0.6rem; color:var(--text-gray);">Account protected with Google Authenticator.</p>
                        </div>
                    `;
                } else {
                    contentHtml = `
                        <div style="text-align:center; padding:4px 0;">
                            <p style="font-size:0.62rem; color:#f39c12; font-weight:700; margin-bottom:6px;">Status: Disabled (Required for Payouts)</p>
                            <div style="background:#fff; padding:6px; width:110px; height:110px; margin:0 auto 6px auto; border-radius:6px; display:flex; align-items:center; justify-content:center;">
                                <img src="https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=otpauth://totp/MRMASUDAR:${user.email}?secret=JBSWY3DPEHPK3PXP&issuer=MRMASUDAR" alt="2FA QR" style="width:100px; height:100px;">
                            </div>
                            <div style="font-size:0.58rem; color:var(--gold-solid); margin-bottom:8px;">Key: <b>JBSWY3DPEHPK3PXP</b></div>
                            <div style="max-width:220px; margin:0 auto 8px auto;">
                                <input type="text" id="tfaCodeInput" placeholder="Enter 6-digit Code" style="background:#000; border:1px solid rgba(212,175,55,0.3); padding:6px; color:#fff; width:100%; text-align:center; border-radius:5px; font-size:0.7rem; letter-spacing:2px;">
                            </div>
                            <button onclick="verifyAndEnable2FA()" type="button" class="apply-btn" style="padding:6px 16px; font-size:0.62rem;">Verify & Enable</button>
                        </div>
                    `;
                }
            }

            document.getElementById('settingsTabContent').innerHTML = contentHtml;
        }

        function onPaymentMethodChange(val) {
            let labelElem = document.getElementById('payoutInputLabel');
            let inputElem = document.getElementById('editPayoutAccount');
            if(val === 'Payoneer') {
                labelElem.innerText = 'Payoneer Email Address:';
                inputElem.placeholder = 'Enter Payoneer email';
            } else {
                labelElem.innerText = 'bKash Account Number:';
                inputElem.placeholder = 'Enter 11-digit bKash';
            }
        }

        function saveProfileChanges() {
            if(window.currentUserData) {
                window.currentUserData.name = document.getElementById('editName').value;
                window.currentUserData.email = document.getElementById('editEmail').value;
                window.currentUserData.whatsapp = document.getElementById('editWhatsapp').value;

                localStorage.setItem('mme_active_user_data', JSON.stringify(window.currentUserData));
                renderDashboard(window.currentUserData);
                showToast("Profile Updated");
            }
        }

        function savePaymentChanges() {
            let type = document.getElementById('editPayoutType').value;
            let account = document.getElementById('editPayoutAccount').value.trim();

            if(!account) {
                alert("Please enter a valid payout account.");
                return;
            }

            if(window.currentUserData) {
                window.currentUserData.payoutType = type;
                window.currentUserData.payoutAccount = account;

                localStorage.setItem('mme_active_user_data', JSON.stringify(window.currentUserData));
                renderDashboard(window.currentUserData);
                document.getElementById('settingsModalOverlay').style.display = 'none';
                showToast("Payment Saved");
            }
        }

        function verifyAndEnable2FA() {
            let code = document.getElementById('tfaCodeInput').value.trim();
            if(code.length !== 6) {
                alert("Please enter valid 6-digit code.");
                return;
            }
            if(window.currentUserData) {
                window.currentUserData.tfaEnabled = true;
                localStorage.setItem('mme_active_user_data', JSON.stringify(window.currentUserData));
                showToast("2FA Enabled Successfully");
                switchSettingsTab('security');
            }
        }

        function updateGraphData(period) {
            let container = document.getElementById('graphContainerBars');
            if(period === '7d') {
                container.innerHTML = `
                    <div class="bar-col"><div class="bar" style="height: 14px;"></div><span class="bar-label">Mon</span></div>
                    <div class="bar-col"><div class="bar" style="height: 25px;"></div><span class="bar-label">Tue</span></div>
                    <div class="bar-col"><div class="bar" style="height: 18px;"></div><span class="bar-label">Wed</span></div>
                    <div class="bar-col"><div class="bar" style="height: 32px;"></div><span class="bar-label">Thu</span></div>
                    <div class="bar-col"><div class="bar" style="height: 45px;"></div><span class="bar-label">Fri</span></div>
                    <div class="bar-col"><div class="bar" style="height: 28px;"></div><span class="bar-label">Sat</span></div>
                    <div class="bar-col"><div class="bar" style="height: 38px;"></div><span class="bar-label">Sun</span></div>
                `;
            } else if(period === '1m') {
                container.innerHTML = `
                    <div class="bar-col"><div class="bar" style="height: 22px;"></div><span class="bar-label">W1</span></div>
                    <div class="bar-col"><div class="bar" style="height: 40px;"></div><span class="bar-label">W2</span></div>
                    <div class="bar-col"><div class="bar" style="height: 30px;"></div><span class="bar-label">W3</span></div>
                    <div class="bar-col"><div class="bar" style="height: 50px;"></div><span class="bar-label">W4</span></div>
                `;
            } else if(period === '1y') {
                container.innerHTML = `
                    <div class="bar-col"><div class="bar" style="height: 30px;"></div><span class="bar-label">Q1</span></div>
                    <div class="bar-col"><div class="bar" style="height: 42px;"></div><span class="bar-label">Q2</span></div>
                    <div class="bar-col"><div class="bar" style="height: 55px;"></div><span class="bar-label">Q3</span></div>
                    <div class="bar-col"><div class="bar" style="height: 48px;"></div><span class="bar-label">Q4</span></div>
                `;
            }
            showToast("Analytics updated");
        }

        function requestWithdrawal() {
            let user = window.currentUserData;
            let amt = parseFloat(document.getElementById('withdrawAmountInput').value);

            if(!user.payoutType || !user.payoutAccount) {
                alert("Please complete Payment Setup in Settings.");
                openSettingsModal('payment');
                return;
            }
            if(!user.tfaEnabled) {
                alert("Please enable 2FA Security in Settings.");
                openSettingsModal('security');
                return;
            }
            if(isNaN(amt) || amt <= 0) {
                alert("Please enter a valid amount.");
                return;
            }
            if(amt > user.availableBalance) {
                alert("Insufficient balance for withdrawal.");
                return;
            }

            let withdrawals = JSON.parse(localStorage.getItem('mme_withdrawals_db')) || [];
            withdrawals.push({
                id: user.id,
                name: user.name,
                amount: amt,
                method: user.payoutType,
                account: user.payoutAccount,
                status: 'Pending'
            });
            localStorage.setItem('mme_withdrawals_db', JSON.stringify(withdrawals));

            showToast(`Withdrawal request of $${amt.toFixed(2)} sent to Admin!`);
            document.getElementById('withdrawAmountInput').value = '';
        }

        function logoutSession() {
            localStorage.removeItem('mme_active_session');
            localStorage.removeItem('mme_active_user_data');
            location.reload();
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr Masudar Enterprise</title>
    <style>
        /* বেসিক রিসেট ও ডার্ক থিম */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0b0b;
            color: #fff;
            padding-bottom: 70px; /* নিচের ফিক্সড ন্যাভবারের জন্য জায়গা রাখা */
        }

        /* টপ হেডার ও সার্চ বার */
        .top-header {
            padding: 12px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #111;
            border-bottom: 1px solid #222;
        }

        .brand-title {
            font-size: 16px;
            font-weight: bold;
            color: #d4af37;
        }

        .search-container {
            padding: 10px 15px;
            background: #0b0b0b;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: #161616;
            border: 1px solid #333;
            border-radius: 25px;
            padding: 8px 15px;
        }

        .search-box input {
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            width: 100%;
            margin-left: 8px;
            font-size: 14px;
        }

        /* সমান গ্যাপ ও স্ট্যান্ডার্ড প্রোডাক্ট গ্রিড (Masonry সমস্যার সমাধান) */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* মোবাইলে নিখুঁত দুটি কলাম */
            gap: 10px; /* প্রতিটি কার্ডের মাঝে একদম সমান গ্যাপ */
            padding: 10px 12px;
        }

        .product-card {
            background: #141414;
            border: 1px solid #222;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-card img {
            width: 100%;
            height: 160px; /* নির্দিষ্ট উচ্চতা যাতে লেআউট নষ্ট না হয় */
            object-fit: cover;
        }

        .product-info {
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #ccc;
        }

        /* নিচের ৫টি ফিক্সড স্টিকি ন্যাভবার (Bottom Sticky Navbar) */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: #111;
            border-top: 1px solid #222;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #aaa;
            font-size: 11px;
            font-weight: 500;
        }

        .nav-item span {
            font-size: 18px;
            margin-bottom: 2px;
        }

        .nav-item.active, .nav-item:hover {
            color: #d4af37;
        }
    </style>
</head>
<body>

    <!-- টপ হেডার -->
    <div class="top-header">
        <div class="brand-title">🛒 MR MASUDAR ENTERPRISE</div>
        <div style="color: #d4af37; font-size: 13px; border: 1px solid #333; padding: 4px 10px; border-radius: 15px;">🌐 237+</div>
    </div>

    <!-- সার্চ বার -->
    <div class="search-container">
        <div class="search-box">
            <span>🔍</span>
            <input type="text" placeholder="Search luxury products...">
        </div>
    </div>

    <!-- প্রোডাক্ট গ্রিড সেকশন -->
    <div class="product-grid">
        <!-- প্রোডাক্ট কার্ড ১ -->
        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1543326727-cf6c39e8f84c?w=400" alt="Product">
            <div class="product-info">
                <span>❤️ 27</span>
                <span>👁️ 155</span>
                <span>🔗</span>
            </div>
        </div>

        <!-- প্রোডাক্ট কার্ড ২ -->
        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400" alt="Product">
            <div class="product-info">
                <span>❤️ 29</span>
                <span>👁️ 155</span>
                <span>🔗</span>
            </div>
        </div>

        <!-- প্রোডাক্ট কার্ড ৩ -->
        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400" alt="Product">
            <div class="product-info">
                <span>❤️ 16</span>
                <span>👁️ 340</span>
                <span>🔗</span>
            </div>
        </div>

        <!-- প্রোডাক্ট কার্ড ৪ -->
        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?w=400" alt="Product">
            <div class="product-info">
                <span>❤️ 29</span>
                <span>👁️ 110</span>
                <span>🔗</span>
            </div>
        </div>
    </div>

    <!-- ৫টি ফিক্সড বাটন সম্বলিত স্টিকি ন্যাভবার -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item active">
            <span>🏠</span>
            HOME
        </a>
        <a href="study.html" class="nav-item">
            <span>⚡</span>
            E-TECH
        </a>
        <a href="seller.html" class="nav-item">
            <span>🛍️</span>
            SELLER
        </a>
        <a href="earn.html" class="nav-item">
            <span>🤝</span>
            EARN
        </a>
        <a href="item.html" class="nav-item">
            <span>🛍️</span>
            ITEM
        </a>
    </nav>

</body>
</html>

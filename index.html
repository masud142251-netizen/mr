    <!-- ইকোসিস্টেম পেজ ওভারলে -->

    <!-- ৬টি ক্যাটাগরি ফিল্টার বার -->

            <div class="modal-price-seller-bar">
                <div class="modal-price-group">
                    <span class="modal-price" id="modalPrice">$0.00</span>
                    <span class="modal-bd-discount" id="modalBdDiscount">BD 15% OFF</span>
                </div>
            </div>

            <div class="animated-cycling-box">
                <div class="cycling-content-item active">
                    <h3 class="cycling-title" id="modalTitle">Product Title</h3>
                </div>

            <div class="modal-footer-action-wrap">
                <div class="golden-round-qty-box">
                    <button type="button" class="round-qty-btn" onclick="updateModalQuantity(-1)"><i class="fa-solid fa-minus"></i></button>
                    <input type="text" id="modalProductQty" class="round-qty-input" value="1" readonly>
                    <button type="button" class="round-qty-btn" onclick="updateModalQuantity(1)"><i class="fa-solid fa-plus"></i></button>
                </div>
                <button class="modal-add-btn" id="addToCartBtnElement" onclick="addToCartWithSelection()">
                    Add To Cart

    <nav class="bottom-nav">

                <i class="fa-solid fa-microphone" title="Voice Search" onclick="triggerVoiceSearch()"></i>
                <button class="search-submit-btn" onclick="performSearchSubmit()"><i class="fa-solid fa-magnifying-glass"></i></button>
            </div>

    <script>
        let activeCurrentProduct = null;
        let currentModalQty = 1;
        let currentAffiliateId = sessionStorage.getItem('mme_active_aff') || localStorage.getItem('mme_active_aff') || 'AFF-MASUD-99';
        let activeShareUrl = window.location.href;
        let masterProductsList = [];

        window.addEventListener('DOMContentLoaded', async () => {
            updateCartBadgeCount();
            await loadCombinedProductsFromSupabase();
        });

        function updateCartBadgeCount() {
            let cartItems = JSON.parse(localStorage.getItem('mme_cart_items') || '[]');
            let totalCount = cartItems.reduce((sum, item) => sum + (item.quantity || 1), 0);
            let badgeEl = document.getElementById('cartCount');
            if(badgeEl) {
                badgeEl.innerText = totalCount;
                badgeEl.style.display = totalCount > 0 ? 'flex' : 'none';
            }
        }

        function showCustomToast(msg) {
            let toast = document.getElementById('customToast');
            toast.innerText = msg;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 2500);
        }

        function playCoinSoundAndAnimation(buttonEl) {
            try {
                let btnRect = (buttonEl || document.getElementById('addToCartBtnElement')).getBoundingClientRect();
                let cartRect = document.getElementById('floatingCart').getBoundingClientRect();
                
                let coin = document.createElement('div');
                coin.className = 'flying-coin';
                coin.style.left = `${btnRect.left + btnRect.width/2 - 11}px`;
                coin.style.top = `${btnRect.top + btnRect.height/2 - 11}px`;
                document.body.appendChild(coin);

                setTimeout(() => {
                    coin.style.left = `${cartRect.left + cartRect.width/2 - 11}px`;
                    coin.style.top = `${cartRect.top + cartRect.height/2 - 11}px`;
                    coin.style.transform = 'scale(0.25) rotate(1080deg)';
                    coin.style.opacity = '0.1';
                }, 50);

                setTimeout(() => {
                    coin.remove();
                    const cartEl = document.getElementById('floatingCart');
                    cartEl.classList.add('smooth-center-bounce');
                    setTimeout(() => cartEl.classList.remove('smooth-center-bounce'), 1400);
                }, 1300);
            } catch(e) {}
        }

        async function loadCombinedProductsFromSupabase() {
            const feed = document.getElementById('productFeed');
            feed.innerHTML = `<div style="text-align:center; color:var(--gold-solid); padding:20px; font-size:0.75rem; grid-column: span 2;">Loading Supreme Products...</div>`;

            let products = [];
            try {
                let { data, error } = await _supabase.from('products').select('*');
                if(data && data.length > 0) {
                    products = data;
                }
            } catch(e) {}

            if(products.length === 0) {
                products = [
                    {
                        id: 1, title: "Luxury Silk Designer Evening Gown", category: "Gown & Apparel", price: "$185.00", bd_discount: "BD 20% OFF",
                        seller_id: "VEN-MASUD", likes: 922, views: 4563,
                        video_url: "https://www.youtube.com/embed/EjSt6U8SQ0I?autoplay=1&mute=1&loop=1&playlist=EjSt6U8SQ0I&controls=0&showinfo=0&modestbranding=1&iv_load_policy=3&disablekb=1&fs=0",
                        images: ["https://lh3.googleusercontent.com/d/18yy4G5Nd4OUf5a1T4mKHhvUFTq_6Eds5"],
                        desc: "Exquisite hand-stitched luxury gown."
                    }
                ];
            }

            masterProductsList = products;
            renderProductFeed(masterProductsList);
        }

        function renderProductFeed(products) {
            const feed = document.getElementById('productFeed');
            feed.innerHTML = "";

            if(products.length === 0) {
                feed.innerHTML = `<div style="text-align:center; color:var(--text-gray); padding:20px; font-size:0.75rem; grid-column: span 2;">No products found in this category.</div>`;
                return;
            }

            products.forEach(item => {
                let pId = item.id || 1;
                let title = item.title || item.product_title || 'Luxury Product';
                let price = item.price || '$185.00';
                let videoUrl = item.video_url || item.videoUrl || '';
                let likes = item.likes || 922;
                let views = item.views || 4563;

                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div class="video-wrapper">
                        <iframe src="${videoUrl}" allow="autoplay; encrypted-media" allowfullscreen loading="lazy"></iframe>
                        <div class="video-click-shield" onclick="openProductModal('${pId}')"></div>
                    </div>
                    <div class="product-bottom-actions">
                        <div class="action-item view-icon"><i class="fa-solid fa-eye"></i> <span id="view-cnt-${pId}">${views}</span></div>
                        <div class="action-item like-icon" onclick="handleSupabaseLike('${pId}', this)"><i class="fa-solid fa-heart"></i> <span class="like-count" id="like-cnt-${pId}">${likes}</span></div>
                        <div class="action-item share-icon" onclick="openSocialShareModal('${title}', '${pId}')"><i class="fa-solid fa-share-nodes"></i> Share</div>
                    </div>
                `;
                feed.appendChild(card);
            });
            window.allLoadedProducts = masterProductsList;
        }

        function filterByCategory(catName, el) {
            document.querySelectorAll('.category-chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');

            if(catName === 'All') {
                renderProductFeed(masterProductsList);
            } else {
                let filtered = masterProductsList.filter(p => (p.category || '').toLowerCase() === catName.toLowerCase());
                renderProductFeed(filtered);
            }
        }

        async function handleSupabaseLike(pId, el) {
            let span = el.querySelector('.like-count');
            let currentLikes = parseInt(span.innerText) + 1;
            span.innerText = currentLikes;
            showCustomToast("Liked successfully!");

            try {
                await _supabase.from('products').update({ likes: currentLikes }).eq('id', pId);
            } catch(err) {}
        }

        // সোশ্যাল শেয়ার পপআপ এবং সাধারণ ক্লিন প্রোডাক্ট লিংক
        function openSocialShareModal(title, pId) {
            activeShareUrl = `${window.location.origin}${window.location.pathname}?prod=${pId}`;

            document.getElementById('shareLinkTextDisplay').innerText = activeShareUrl;

            let encodedUrl = encodeURIComponent(activeShareUrl);
            let encodedTitle = encodeURIComponent(title);

            document.getElementById('shareFb').href = `https://www.facebook.com/sharer/sharer.php?u=${encodedUrl}`;
            document.getElementById('shareWa').href = `https://api.whatsapp.com/send?text=${encodedTitle}%20-%20${encodedUrl}`;
            document.getElementById('shareTg').href = `https://t.me/share/url?url=${encodedUrl}&text=${encodedTitle}`;
            document.getElementById('shareIg').href = `https://www.instagram.com/`;
            document.getElementById('shareYt').href = `https://www.youtube.com/`;
            document.getElementById('shareTt').href = `https://www.tiktok.com/`;
            document.getElementById('shareX').href = `https://twitter.com/intent/tweet?url=${encodedUrl}&text=${encodedTitle}`;
            document.getElementById('shareLi').href = `https://www.linkedin.com/sharing/share-offsite/?url=${encodedUrl}`;
            document.getElementById('shareImo').href = `https://imo.im/`;

            document.getElementById('socialShareModal').style.display = 'flex';
        }

        function closeSocialShareModal() {
            document.getElementById('socialShareModal').style.display = 'none';
        }

        function copyProductLink() {
            let linkEl = document.getElementById('shareLinkTextDisplay');
            
            // টেক্সট সিলেক্ট ও কপি করা
            if (document.body.createTextRange) {
                let range = document.body.createTextRange();
                range.moveToElementText(linkEl);
                range.select();
            } else if (window.getSelection) {
                let selection = window.getSelection();
                let range = document.createRange();
                range.selectNodeContents(linkEl);
                selection.removeAllRanges();
                selection.addRange(range);
            }

            navigator.clipboard.writeText(activeShareUrl);
            showCustomToast("Link copied to clipboard!");
            
            setTimeout(() => {
                closeSocialShareModal();
            }, 1200);
        }

        function openProductModal(id) {
            let products = window.allLoadedProducts || [];
            let product = products.find(p => p.id == id || p.id == String(id));
            if(!product) return;
            activeCurrentProduct = product;
            currentModalQty = 1;
            document.getElementById('modalProductQty').value = currentModalQty;

            document.getElementById('modalTitle').innerText = product.title || product.product_title;
            document.getElementById('modalPrice').innerText = product.price;
            document.getElementById('modalBdDiscount').innerText = product.bd_discount || product.bdDiscount || 'BD 15% OFF';

            let imagesArr = product.images || [product.image || 'https://lh3.googleusercontent.com/d/1POhz8vb-MocaPNHg-i6nDSKwV4ky16Lc'];
            const slider = document.getElementById('modalMediaSlider');
            const thumbs = document.getElementById('modalThumbsRow');
            slider.innerHTML = imagesArr.map((img, idx) => `<div class="modal-slide-item" id="slide-${idx}"><img src="${img}"></div>`).join('');
            thumbs.innerHTML = imagesArr.map((img, idx) => `<img src="${img}" class="modal-thumb-img ${idx === 0 ? 'active' : ''}" onclick="switchSlide(${idx})">`).join('');

            document.getElementById('productModal').style.display = 'flex';
        }

        function switchSlide(idx) {
            let slideEl = document.getElementById(`slide-${idx}`);
            if(slideEl) slideEl.scrollIntoView({ behavior: 'smooth' });
        }

        function updateModalQuantity(change) {
            currentModalQty += change;
            if(currentModalQty < 1) currentModalQty = 1;
            document.getElementById('modalProductQty').value = currentModalQty;
        }

        function closeProductModal() {
            document.getElementById('productModal').style.display = 'none';
        }

        function addToCartWithSelection() {
            if(!activeCurrentProduct) return;
            
            let imagesArr = activeCurrentProduct.images || [activeCurrentProduct.image || 'https://lh3.googleusercontent.com/d/1POhz8vb-MocaPNHg-i6nDSKwV4ky16Lc'];
            let cartItem = {
                cartId: Date.now() + Math.random(),
                productId: activeCurrentProduct.id,
                title: activeCurrentProduct.title || activeCurrentProduct.product_title,
                price: activeCurrentProduct.price,
                quantity: currentModalQty,
                sellerId: activeCurrentProduct.seller_id || activeCurrentProduct.sellerId || 'VEN-MASUD',
                image: imagesArr[0],
                affiliateRef: currentAffiliateId
            };

            let cartItems = JSON.parse(localStorage.getItem('mme_cart_items') || '[]');
            cartItems.push(cartItem);

            localStorage.setItem('mme_cart_items', JSON.stringify(cartItems));
            updateCartBadgeCount();
            closeProductModal();
            playCoinSoundAndAnimation(document.getElementById('addToCartBtnElement'));
            showCustomToast("Product added! Redirecting to Checkout...");

            setTimeout(() => {
                let encodedData = encodeURIComponent(JSON.stringify(cartItems));
                window.location.href = `https://out.mrmasudar.com?cart=${encodedData}&ref=${currentAffiliateId}`;
            }, 1200);
        }

        function handleCartClick() {
            let cartItems = localStorage.getItem('mme_cart_items') || '[]';
            let encodedData = encodeURIComponent(cartItems);
            window.location.href = `https://out.mrmasudar.com?cart=${encodedData}&ref=${currentAffiliateId}`;
        }

        function triggerCameraSearch() {
            let input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.onchange = e => { showCustomToast("Visual image uploaded. Searching products..."); };
            input.click();
        }

        function triggerVoiceSearch() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                showCustomToast("Voice search is not supported in this browser.");
                return;
            }
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.onstart = () => { showCustomToast("Listening... Speak now"); };
            recognition.onresult = (event) => {
                let speechText = event.results[0][0].transcript;
                document.getElementById('searchInput').value = speechText;
                showCustomToast(`Searched for: ${speechText}`);
            };
            recognition.onerror = () => { showCustomToast("Could not recognize voice. Try again."); };
            recognition.start();
        }

        function performSearchSubmit() {
            let query = document.getElementById('searchInput').value.trim();
            if(query) showCustomToast(`Searching for "${query}"...`);
        }

        function handleSearchKey(e) { if(e.key === 'Enter') performSearchSubmit(); }

        function openEcosystemPage(url) {
            document.getElementById('ecosystemIframe').src = url;
            document.getElementById('ecosystemOverlay').style.display = 'flex';
        }

        function closeEcosystemPage() {
            document.getElementById('ecosystemOverlay').style.display = 'none';
            document.getElementById('ecosystemIframe').src = '';
        }
    </script>
</body>
</html>

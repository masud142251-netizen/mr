<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MR MASUDAR ENTERPRISE | Ultimate Global Ecosystem</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #070707;
            color: #ffffff;
            padding-bottom: 90px;
            overflow-x: hidden;
        }

        /* 🌟 Futuristic Luxury Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 18px;
            background: rgba(12, 12, 12, 0.9);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(212, 175, 55, 0.25);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-area img {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #d4af37;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.6);
            animation: pulseGlow 3s infinite alternate;
        }

        .logo-title {
            font-size: 14px;
            font-weight: 700;
            background: linear-gradient(135deg, #fff 20%, #ffd700 70%, #ff8c00 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
        }

        .global-badge {
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid rgba(212, 175, 55, 0.35);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            color: #ffd700;
            display: flex;
            align-items: center;
            gap: 5px;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
        }

        /* 🌟 Luxury Glass Search Bar (Fully Mobile Fixed & Aligned) */
        .search-container {
            padding: 12px 15px;
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 63px;
            z-index: 999;
        }

        .glass-search-bar {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 30px;
            padding: 10px 14px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
            transition: all 0.3s ease;
        }

        .glass-search-bar:focus-within {
            border-color: #ffd700;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
        }

        .glass-search-bar i.search-icon {
            color: #ffd700;
            font-size: 15px;
            margin-right: 10px;
        }

        .glass-search-bar input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 13px;
            min-width: 0;
        }

        .glass-search-bar input::placeholder {
            color: #888;
        }

        .search-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #ffd700;
            font-size: 16px;
            cursor: pointer;
            margin-left: 8px;
        }

        .search-actions label, .search-actions i {
            cursor: pointer;
            transition: transform 0.3s, color 0.3s;
        }

        .search-actions i:hover {
            color: #ff8c00;
            transform: scale(1.15);
        }

        /* Hidden file input for direct camera/image selection */
        #hiddenCameraInput {
            display: none;
        }

        /* 🌟 Product Feed Grid (Single Clean Balanced Cards - No Double Images) */
        .feed-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding: 12px;
        }

        @media (min-width: 768px) {
            .feed-container {
                grid-template-columns: repeat(4, 1fr);
                gap: 18px;
                padding: 18px;
            }
        }

        .product-card {
            background: #111111;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.7);
            transition: all 0.35s ease;
            position: relative;
            animation: cardAppear 0.5s ease-out backwards;
        }

        .product-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.9), 0 0 15px rgba(212, 175, 55, 0.2);
        }

        .product-img-wrapper {
            position: relative;
            width: 100%;
            height: 190px;
            background: #000;
            overflow: hidden;
        }

        .product-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .product-card:hover .product-img-wrapper img {
            transform: scale(1.06);
        }

        .product-info {
            padding: 10px 12px;
        }

        .product-code {
            font-size: 12px;
            font-weight: 600;
            color: #ffd700;
            margin-bottom: 6px;
        }

        .card-footer-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #aaa;
        }

        .action-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: transform 0.2s, color 0.3s;
        }

        .action-btn:active {
            transform: scale(0.85);
        }

        /* Like Button: Default Red (Pinkish-Red), Click to Metallic Gradient Gold */
        .like-btn {
            color: #ff3366; 
        }
        .like-btn.liked {
            color: #ffd700;
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.7));
        }

        /* Share Button: Default Gradient Gold, Click to Orange */
        .share-btn {
            color: #ffd700;
        }
        .share-btn.shared {
            color: #ff8c00;
            filter: drop-shadow(0 0 8px rgba(255, 140, 0, 0.7));
        }

        .view-count {
            font-size: 11px;
            color: #bbb;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* 🌟 Luxury Sticky Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 65px;
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(212, 175, 55, 0.25);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.9);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #ffffff;
            font-size: 10px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .nav-item i {
            font-size: 19px;
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 3px;
            filter: drop-shadow(0 0 5px rgba(212, 175, 55, 0.4));
            transition: transform 0.3s;
        }

        .nav-item span {
            color: #ffffff;
            letter-spacing: 0.3px;
        }

        .nav-item:hover i {
            transform: translateY(-2px) scale(1.1);
        }

        /* Animations */
        @keyframes pulseGlow {
            0% { box-shadow: 0 0 8px rgba(212, 175, 55, 0.3); }
            100% { box-shadow: 0 0 20px rgba(212, 175, 55, 0.7); }
        }

        @keyframes cardAppear {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <header class="header">
        <div class="logo-area">
            <img src="https://lh3.googleusercontent.com/d/1iph42wSVX9xNglnVKSKTXicbInSJ3y4j=s400" alt="Brand Logo" id="brandLogo">
            <span class="logo-title">MR MASUDAR ENTERPRISE</span>
        </div>
        <div class="global-badge">
            <i class="fa-solid fa-globe"></i> 237+
        </div>
    </header>

    <!-- Luxury Glass Search Bar -->
    <div class="search-container">
        <div class="glass-search-bar" onclick="focusSearchInput()">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input type="text" id="mainSearchInput" placeholder="Search products, digital services or items...">
            <div class="search-actions">
                <!-- Direct Camera / Image Upload Trigger -->
                <label for="hiddenCameraInput" title="Image Search"><i class="fa-solid fa-camera"></i></label>
                <input type="file" id="hiddenCameraInput" accept="image/*" capture="environment" onchange="handleImageCapture(event)">
                
                <!-- Voice Search Trigger -->
                <i class="fa-solid fa-microphone" title="Voice Search" onclick="event.stopPropagation(); triggerVoiceSearch();"></i>
            </div>
        </div>
    </div>

    <!-- Product Feed Grid (Single balanced items with randomized natural views & red-to-golden likes) -->
    <main class="feed-container" id="productFeed">
        <!-- JavaScript will dynamically render cards -->
    </main>

    <!-- Luxury Sticky Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <i class="fa-solid fa-house"></i>
            <span>HOME</span>
        </a>
        <a href="etech.html" class="nav-item">
            <i class="fa-solid fa-bolt"></i>
            <span>E-TECH</span>
        </a>
        <a href="seller.html" class="nav-item">
            <i class="fa-solid fa-bag-shopping"></i>
            <span>SELLER</span>
        </a>
        <a href="earn.html" class="nav-item">
            <i class="fa-solid fa-handshake"></i>
            <span>EARN</span>
        </a>
        <a href="item.html" class="nav-item">
            <i class="fa-solid fa-basket-shopping"></i>
            <span>ITEM</span>
        </a>
    </nav>

    <script>
        function focusSearchInput() {
            const input = document.getElementById('mainSearchInput');
            input.focus();
        }

        // Direct camera capture handler
        function handleImageCapture(event) {
            const file = event.target.files[0];
            if (file) {
                alert('Image captured/uploaded successfully for visual search!');
            }
        }

        // Direct voice search handler using Web Speech API if supported
        function triggerVoiceSearch() {
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                const recognition = new SpeechRecognition();
                recognition.lang = 'en-US';
                recognition.start();
                
                recognition.onresult = function(event) {
                    const speechText = event.results[0][0].transcript;
                    document.getElementById('mainSearchInput').value = speechText;
                };
                
                recognition.onerror = function() {
                    alert('Voice recognition error or permission denied.');
                };
            } else {
                alert('Voice search is not supported in this browser.');
            }
        }

        // Your Google Drive Product Images Source List
        const driveProductImages = [
            'https://lh3.googleusercontent.com/d/1k0XXn9tBtH42S26sC2sAEQow-jZKvFuf=s800',
            'https://lh3.googleusercontent.com/d/1A90qVOYpq8gBVcahDQlQ9-DuB_60og6C=s800',
            'https://lh3.googleusercontent.com/d/1N4lXfL2RIjolz0sVcazAc2BzMpO70M3c=s800',
            'https://lh3.googleusercontent.com/d/13UmE17PJ1F-Xl4D54Q-rKXeXg5RjwJ3A=s800'
        ];

        // Non-uniform randomized views for organic realistic look
        function generateRandomViews() {
            const viewsOptions = [450, 1150, 2400, 4500, 8750, 12500, 32000, 52000, 87500];
            return viewsOptions[Math.floor(Math.random() * viewsOptions.length)];
        }

        // Dynamic Product Feed Generation (20 balanced single image cards)
        const feedContainer = document.getElementById('productFeed');
        
        for(let i = 1; i <= 20; i++) {
            let randomImg = driveProductImages[(i - 1) % driveProductImages.length];
            let randomViews = generateRandomViews();
            let randomLikes = Math.floor(Math.random() * 450 + 30);

            let card = document.createElement('div');
            card.className = 'product-card';
            card.style.animationDelay = `${i * 0.04}s`;
            card.innerHTML = `
                <div class="product-img-wrapper">
                    <img src="${randomImg}" alt="Luxury Product">
                </div>
                <div class="product-info">
                    <div class="product-code">VEIW ${50000 + (i * 7)}K</div>
                    <div class="card-footer-actions">
                        <button class="action-btn like-btn" onclick="toggleLike(this)">
                            <i class="fa-solid fa-heart"></i> <span class="like-count">${randomLikes}</span>
                        </button>
                        <button class="action-btn share-btn" onclick="toggleShare(this)">
                            <i class="fa-solid fa-share-nodes"></i>
                        </button>
                        <span class="view-count"><i class="fa-solid fa-eye"></i> ${randomViews}</span>
                    </div>
                </div>
            `;
            feedContainer.appendChild(card);
        }

        // Like Toggle: Red (Pinkish-Red) ⇄ Metallic Golden
        function toggleLike(btn) {
            let countSpan = btn.querySelector('.like-count');
            let currentLikes = parseInt(countSpan.innerText);

            if (!btn.classList.contains('liked')) {
                btn.classList.add('liked');
                countSpan.innerText = currentLikes + 1;
            } else {
                btn.classList.remove('liked');
                countSpan.innerText = currentLikes - 1;
            }
        }

        // Share Toggle: Golden ⇄ Orange with short link action
        function toggleShare(btn) {
            if (!btn.classList.contains('shared')) {
                btn.classList.add('shared');
                alert('Short link copied & social share panel opened!');
            } else {
                btn.classList.remove('shared');
            }
        }
    </script>
</body>
</html>

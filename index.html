    <style>

        .modal-bd-discount { background: linear-gradient(135deg, #ff2d55, #ff6b8b); color: white; font-size: 0.5rem; padding: 2px 5px; border-radius: 4px; font-weight: 700; white-space: nowrap; }

        .animated-cycling-box { background: linear-gradient(135deg, #141414, #090909); border: 1.5px solid var(--gold-solid); border-radius: 10px; padding: 8px 10px; margin-bottom: 6px; min-height: 62px; display: flex; align-items: center; justify-content: center; text-align: center; position: relative; overflow: hidden; }
        .cycling-title { font-size: 0.8rem; font-weight: 700; color: #fceea7; font-family: 'Cinzel', serif; line-height: 1.3; }
        
        .modal-footer-action-wrap { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; width: 100%; }
        .golden-round-qty-box { display: flex; align-items: center; justify-content: center; background: #000; border: 1.5px solid var(--gold-solid); border-radius: 30px; padding: 2px 10px; gap: 10px; margin: 0 auto; width: 140px; }
        .round-qty-btn { width: 24px; height: 24px; border-radius: 50%; background: var(--gold-gradient); border: none; color: #000; font-size: 0.7rem; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .round-qty-input { width: 24px; background: transparent; border: none; color: white; text-align: center; font-size: 0.75rem; font-weight: 700; outline: none; }
        .modal-add-btn { width: 100%; background: var(--gold-gradient); border: none; padding: 10px; border-radius: 10px; color: var(--bg-black); font-weight: 800; font-size: 0.8rem; cursor: pointer; box-shadow: 0 4px 15px rgba(212,175,55,0.4); display: flex; align-items: center; justify-content: center; gap: 5px; }

        .flying-coin { position: fixed; width: 22px; height: 22px; background: var(--gold-gradient); border-radius: 50%; border: 2px solid #fff; z-index: 9999; pointer-events: none; transition: all 1.3s cubic-bezier(0.25, 1, 0.5, 1); }

        nav.bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(11, 11, 11, 0.99); border-top: 1px solid rgba(212, 175, 55, 0.4); display: flex; justify-content: space-between; align-items: center; padding: 6px 8px; z-index: 1000; backdrop-filter: blur(15px); }

        .nav-item i { font-size: 0.9rem; margin-bottom: 1px; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .nav-item.active { color: var(--gold-solid); background: rgba(212, 175, 55, 0.1); }
        .bottom-search-wrapper { display: flex; align-items: center; background: var(--card-bg); border: 1.5px solid var(--gold-solid); border-radius: 16px; padding: 2px 5px; width: 38%; }
        .bottom-search-wrapper input { flex: 1; background: transparent; border: none; outline: none; color: var(--text-white); font-size: 0.68rem; padding: 2px; min-width: 0; }
        .bottom-search-actions { display: flex; align-items: center; gap: 4px; color: var(--gold-solid); font-size: 0.75rem; }
        .bottom-search-actions i { background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; cursor: pointer; }
        .search-submit-btn { background: var(--gold-gradient); border: none; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--bg-black); font-size: 0.6rem; cursor: pointer; }
        .search-submit-btn i { background: none !important; -webkit-text-fill-color: var(--bg-black) !important; color: var(--bg-black) !important; }

                    <button type="button" class="round-qty-btn" onclick="updateModalQuantity(-1)"><i class="fa-solid fa-minus"></i></button>
                    <input type="text" id="modalProductQty" class="round-qty-input" value="1" readonly>
                    <button type="button" class="round-qty-btn" onclick="updateModalQuantity(1)"><i class="fa-solid fa-plus"></i></button>

    <script>
        let activeCurrentProduct = null;
        let currentModalQty = 1;
        let currentAffiliateId = sessionStorage.getItem('mme_active_aff') || localStorage.getItem('mme_active_aff') || 'AFF-MASUD-99';

        window.addEventListener('DOMContentLoaded', () => {
            updateCartBadgeCount();
            loadCombinedProducts();
        });

        function updateCartBadgeCount() {
            let cartItems = JSON.parse(localStorage.getItem('mme_cart_items') || '[]');
            let totalCount = cartItems.reduce((sum, item) => sum + (item.quantity || 1), 0);
            let badgeEl = document.getElementById('cartCount');
            if(badgeEl) {
                badgeEl.innerText = totalCount;
                badgeEl.style.display = totalCount > 0 ? 'flex' : 'none';
            }
        }

        function showCustomToast(msg) {
            let toast = document.getElementById('customToast');
            toast.innerText = msg;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 2500);
        }

        function playCoinSoundAndAnimation(buttonEl) {
            try {
                let btnRect = (buttonEl || document.getElementById('addToCartBtnElement')).getBoundingClientRect();
                let cartRect = document.getElementById('floatingCart').getBoundingClientRect();
                
                let coin = document.createElement('div');
                coin.className = 'flying-coin';
                coin.style.left = `${btnRect.left + btnRect.width/2 - 11}px`;
                coin.style.top = `${btnRect.top + btnRect.height/2 - 11}px`;
                document.body.appendChild(coin);

                setTimeout(() => {
                    coin.style.left = `${cartRect.left + cartRect.width/2 - 11}px`;
                    coin.style.top = `${cartRect.top + cartRect.height/2 - 11}px`;
                    coin.style.transform = 'scale(0.25) rotate(1080deg)';
                    coin.style.opacity = '0.1';
                }, 50);

                setTimeout(() => {
                    coin.remove();
                    const cartEl = document.getElementById('floatingCart');
                    cartEl.classList.add('smooth-center-bounce');
                    setTimeout(() => cartEl.classList.remove('smooth-center-bounce'), 1400);
                }, 1300);
            } catch(e) {}
        }

        function getAllProducts() {
            return [
                {
                    id: 1, title: "Luxury Silk Designer Evening Gown", price: "$185.00", bdDiscount: "BD 20% OFF",
                    sellerId: "VEN-MASUD", sellerName: "Masudar Enterprise",
                    videoUrl: "https://www.youtube.com/embed/EjSt6U8SQ0I?autoplay=1&mute=1&loop=1&playlist=EjSt6U8SQ0I&controls=0&showinfo=0&modestbranding=1&iv_load_policy=3&disablekb=1&fs=0",
                    images: ["https://lh3.googleusercontent.com/d/18yy4G5Nd4OUf5a1T4mKHhvUFTq_6Eds5"],
                    desc: "Exquisite hand-stitched luxury gown."
                }
            ];
        }

        function loadCombinedProducts() {
            const feed = document.getElementById('productFeed');
            feed.innerHTML = "";
            getAllProducts().forEach(item => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div class="video-wrapper">
                        <iframe src="${item.videoUrl}" allow="autoplay; encrypted-media" allowfullscreen loading="lazy"></iframe>
                        <div class="video-click-shield" onclick="openProductModal('${item.id}')"></div>
                    </div>
                    <div class="product-bottom-actions">
                        <div class="action-item view-icon"><i class="fa-solid fa-eye"></i> <span>4,563</span></div>
                        <div class="action-item like-icon"><i class="fa-solid fa-heart"></i> <span>922</span></div>
                        <div class="action-item share-icon"><i class="fa-solid fa-share-nodes"></i> Share</div>
                    </div>
                `;
                feed.appendChild(card);
            });
        }

        function openProductModal(id) {
            let product = getAllProducts().find(p => p.id == id);
            if(!product) return;
            activeCurrentProduct = product;
            currentModalQty = 1;
            document.getElementById('modalProductQty').value = currentModalQty;

            document.getElementById('modalTitle').innerText = product.title;
            document.getElementById('modalPrice').innerText = product.price;
            document.getElementById('modalBdDiscount').innerText = product.bdDiscount;

            const slider = document.getElementById('modalMediaSlider');
            const thumbs = document.getElementById('modalThumbsRow');
            slider.innerHTML = product.images.map((img, idx) => `<div class="modal-slide-item" id="slide-${idx}"><img src="${img}"></div>`).join('');
            thumbs.innerHTML = product.images.map((img, idx) => `<img src="${img}" class="modal-thumb-img ${idx === 0 ? 'active' : ''}">`).join('');

            document.getElementById('productModal').style.display = 'flex';
        }

        function updateModalQuantity(change) {
            currentModalQty += change;
            if(currentModalQty < 1) currentModalQty = 1;
            document.getElementById('modalProductQty').value = currentModalQty;
        }

        function closeProductModal() {
            document.getElementById('productModal').style.display = 'none';
        }

        function addToCartWithSelection() {
            if(!activeCurrentProduct) return;
            
            let cartItems = JSON.parse(localStorage.getItem('mme_cart_items') || '[]');
            cartItems.push({
                cartId: Date.now() + Math.random(),
                productId: activeCurrentProduct.id,
                title: activeCurrentProduct.title,
                price: activeCurrentProduct.price,
                quantity: currentModalQty,
                sellerId: activeCurrentProduct.sellerId || 'VEN-MASUD',
                image: activeCurrentProduct.images[0],
                affiliateRef: currentAffiliateId
            });

            localStorage.setItem('mme_cart_items', JSON.stringify(cartItems));
            updateCartBadgeCount();
            closeProductModal();
            playCoinSoundAndAnimation(document.getElementById('addToCartBtnElement'));
            showCustomToast("Product added to cart!");
        }

        function handleCartClick() {
            let cartItems = localStorage.getItem('mme_cart_items') || '[]';
            let encodedData = encodeURIComponent(cartItems);
            window.location.href = `https://out.mrmasudar.com?cart=${encodedData}&ref=${currentAffiliateId}`;
        }

        function performSearchSubmit() {}
        function handleSearchKey(e) { if(e.key === 'Enter') performSearchSubmit(); }
        function openEcosystemPage(url) { window.open(url, '_blank'); }
    </script>
</body>
</html>

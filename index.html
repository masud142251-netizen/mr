    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyCvUftOHiXFCuAzivaBut1XvNLpGE-LQ-w",
            authDomain: "mr-masudar.firebaseapp.com",
            projectId: "mr-masudar",
            storageBucket: "mr-masudar.firebasestorage.app",
            messagingSenderId: "644110210393",
            appId: "1:644110210393:web:dc756217266f0af039e848",
            measurementId: "G-BZBCMZQ87M"
        };

        const app = initializeApp(firebaseConfig);
        window.db = getFirestore(app);
        window.firebaseAddDoc = addDoc;
        window.firebaseCollection = collection;

        async function fetchCartCountFromFirebase() {
            try {
                const querySnapshot = await getDocs(collection(window.db, "global_carts"));
                let totalCount = 0;
                querySnapshot.forEach((doc) => {
                    let item = doc.data();
                    totalCount += (item.quantity || 1);
                });
                let badge = document.getElementById('cartCount');
                if(badge) badge.innerText = totalCount;
            } catch(e) {}
        }

        window.addEventListener('DOMContentLoaded', () => {
            fetchCartCountFromFirebase();
            checkAutoUserLogin();
            detectUserCountryCode();
        });
        window.fetchCartCountFromFirebase = fetchCartCountFromFirebase;
    </script>

    <script>
        let activeCurrentProduct = null;

        // অ্যাফিলিয়েট আইডি হ্যান্ডলিং
        let urlParams = new URLSearchParams(window.location.search);
        let urlAff = urlParams.get('aff') || urlParams.get('ref') || urlParams.get('partner');
        if(urlAff) { 
            sessionStorage.setItem('mme_active_aff', urlAff); 
            localStorage.setItem('mme_active_aff', urlAff); 
        }
        let currentAffiliateId = sessionStorage.getItem('mme_active_aff') || localStorage.getItem('mme_active_aff') || 'AFF-MASUD-99';

        window.addEventListener('DOMContentLoaded', () => {
            loadCombinedProducts();
        });

        function showCustomToast(msg) {
            let toast = document.getElementById('customToast');
            toast.innerText = msg;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 2200);
        }

        // অটো কান্ট্রি কোড ডিটেকশন
        async function detectUserCountryCode() {
            try {
                let res = await fetch('https://ipapi.co/json/');
                let data = await res.json();
                if(data && data.country_calling_code) {
                    let select = document.getElementById('homeCountryCode');
                    let code = data.country_calling_code;
                    for(let option of select.options) {
                        if(option.value === code || option.value === "+" + code.replace("+","")) {
                            select.value = option.value;
                            break;
                        }
                    }
                }
            } catch(e) {}
        }

        // অটো ইউজার লগইন চেক
        function checkAutoUserLogin() {
            let savedUser = JSON.parse(localStorage.getItem('mme_logged_user') || 'null');
            if(savedUser) {
                if(savedUser.email) document.getElementById('homeEmailInput').value = savedUser.email;
                if(savedUser.name) document.getElementById('homeFullName').value = savedUser.name;
                if(savedUser.whatsapp) document.getElementById('homeWhatsapp').value = savedUser.whatsapp;
                if(savedUser.code) document.getElementById('homeCountryCode').value = savedUser.code;
            }
        }

        // ডাইনামিক ভিউজ ও লাইকস ইঞ্জিন (প্রতিবার বাড়ার ব্যবস্থা)
        function getDynamicProductStats(productId) {
            let storageKeyViews = `mme_views_${productId}`;
            let storageKeyLikes = `mme_likes_${productId}`;
            let storageKeyLikedByMe = `mme_liked_time_${productId}`;

            let views = parseInt(localStorage.getItem(storageKeyViews));
            if(!views) {
                views = Math.floor(2000 + Math.random() * 1500); // ২০০০ থেকে ৩৫০০ এর মধ্যে শুরু
                localStorage.setItem(storageKeyViews, views);
            } else {
                if(Math.random() > 0.5) {
                    views += Math.floor(1 + Math.random() * 5);
                    localStorage.setItem(storageKeyViews, views);
                }
            }

            let likes = parseInt(localStorage.getItem(storageKeyLikes)) || Math.floor(300 + Math.random() * 200); // ৩০০ থেকে ৫০০ এর মধ্যে
            let likedTime = parseInt(localStorage.getItem(storageKeyLikedByMe)) || 0;
            let isLiked = (Date.now() - likedTime) < 86400000;

            return { views, likes, isLiked };
        }

        function toggleProductLike(productId, el) {
            let storageKeyLikes = `mme_likes_${productId}`;
            let storageKeyLikedByMe = `mme_liked_time_${productId}`;
            let likedTime = parseInt(localStorage.getItem(storageKeyLikedByMe)) || 0;
            if((Date.now() - likedTime) < 86400000) return;

            let likes = parseInt(localStorage.getItem(storageKeyLikes)) || 300;
            likes += 1;
            localStorage.setItem(storageKeyLikes, likes);
            localStorage.setItem(storageKeyLikedByMe, Date.now());

            let span = el.querySelector('span');
            if(span) span.innerText = likes;
            el.classList.add('liked');
            showCustomToast("Product liked successfully!");
        }

        // প্রোডাক্ট শাফলিং ইঞ্জিন (প্রতিবার এলোমেলো বা আপ-ডাউন করার জন্য)
        function shuffleArray(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function getAllProducts() {
            let defaultProds = [
                {
                    id: 1, title: "Luxury Silk Designer Evening Gown", price: "$185.00", bdDiscount: "BD 20% OFF",
                    category: "👗 FASHION (WOMEN)",
                    videoUrl: "https://www.youtube.com/embed/EjSt6U8SQ0I?autoplay=1&mute=1&loop=1&playlist=EjSt6U8SQ0I&controls=0&showinfo=0&modestbranding=1&iv_load_policy=3&disablekb=1&fs=0",
                    images: ["https://lh3.googleusercontent.com/d/18yy4G5Nd4OUf5a1T4mKHhvUFTq_6Eds5"],
                    desc: "Exquisite hand-stitched silk evening gown."
                }
            ];

            // সেলার প্যানেল ও ক্যাটাগরি থেকে আপলোড করা প্রোডাক্ট ফেচ করা
            let sellers = JSON.parse(localStorage.getItem('mme_sellers') || '[]');
            sellers.forEach(s => {
                if(s.uploadedProducts) {
                    s.uploadedProducts.forEach((p, i) => {
                        let cleanVid = "";
                        if(p.videoUrl && p.videoUrl.trim() !== "") {
                            let rawBase = p.videoUrl.replace("watch?v=", "embed/").split('?')[0];
                            let videoIdMatch = rawBase.split('/').pop();
                            cleanVid = `${rawBase}?autoplay=1&mute=1&loop=1&playlist=${videoIdMatch}&controls=0&showinfo=0&modestbranding=1&iv_load_policy=3&disablekb=1&fs=0`;
                        }
                        defaultProds.push({
                            id: 'v-' + s.id + '-' + i,
                            sellerId: s.id,
                            title: p.title || p.name || "Exclusive Item",
                            price: p.global || '$35.00',
                            bdDiscount: p.countryDiscount || 'BD 15% OFF',
                            category: p.category || '👗 FASHION (WOMEN)',
                            videoUrl: cleanVid,
                            images: [p.imgUrl || "https://lh3.googleusercontent.com/d/18yy4G5Nd4OUf5a1T4mKHhvUFTq_6Eds5"],
                            desc: p.desc || 'Exclusive collection.'
                        });
                    });
                }
            });
            return defaultProds;
        }

        function loadCombinedProducts(list = getAllProducts()) {
            let randomizedList = shuffleArray([...list]); // প্রতিবার রেন্ডম পজিশনে দেখানোর জন্য শাফেল
            const feed = document.getElementById('productFeed');
            feed.innerHTML = "";

            randomizedList.forEach(item => {
                let stats = getDynamicProductStats(item.id);
                const card = document.createElement('div');
                card.className = 'product-card';
                
                let mediaContent = item.videoUrl ? 
                    `<div class="video-wrapper"><iframe src="${item.videoUrl}" allow="autoplay; encrypted-media" allowfullscreen loading="lazy"></iframe><div class="video-click-shield" onclick="openProductModal('${item.id}')"></div></div>` :
                    `<div class="product-media-box" onclick="openProductModal('${item.id}')"><img src="${item.images[0]}" loading="lazy"></div>`;

                card.innerHTML = `
                    ${mediaContent}
                    <div class="product-bottom-actions">
                        <div class="action-item view-icon"><i class="fa-solid fa-eye"></i> <span>${stats.views}</span></div>
                        <div class="action-item like-icon ${stats.isLiked ? 'liked' : ''}" onclick="toggleProductLike('${item.id}', this)"><i class="fa-solid fa-heart"></i> <span>${stats.likes}</span></div>
                        <div class="action-item share-icon" onclick="openShareModal('${item.title}')"><i class="fa-solid fa-share-nodes"></i> Share</div>
                    </div>
                `;
                feed.appendChild(card);
            });
        }

        function openShareModal(title) {
            let currentUrl = window.location.href.split('?')[0];
            let affiliateShareLink = `${currentUrl}?aff=${currentAffiliateId}`;
            document.getElementById('shareLinkInput').value = affiliateShareLink;
            document.getElementById('shareModalOverlay').style.display = 'flex';
        }
        function closeShareModal(e) { if(e.target.id === 'shareModalOverlay') document.getElementById('shareModalOverlay').style.display = 'none'; }
        function copyShareLink() {
            let input = document.getElementById('shareLinkInput');
            input.select();
            navigator.clipboard.writeText(input.value);
            showCustomToast("Affiliate referral link copied successfully!");
            document.getElementById('shareModalOverlay').style.display = 'none';
        }

        function openCategoryModal(el) { document.getElementById('categoryModalOverlay').style.display = 'flex'; }
        function closeCategoryModal(e) { if(!e || e.target.id === 'categoryModalOverlay') document.getElementById('categoryModalOverlay').style.display = 'none'; }
        function selectCategory(cat) {
            document.getElementById('categoryModalOverlay').style.display = 'none';
            let all = getAllProducts();
            if(cat === 'All') loadCombinedProducts(all);
            else loadCombinedProducts(all.filter(p => p.category === cat));
        }

        function openProductModal(id) {
            let product = getAllProducts().find(p => p.id == id);
            if(!product) return;
            activeCurrentProduct = product;
            document.getElementById('modalPrice').innerText = product.price;
            document.getElementById('modalMediaSlider').innerHTML = `<div class="modal-slide-item"><img src="${product.images[0]}"></div>`;
            document.getElementById('productModal').style.display = 'flex';
        }
        function closeProductModal() { document.getElementById('productModal').style.display = 'none'; }

        async function addToCartWithFirebase(buttonEl) {
            if(!activeCurrentProduct) return;
            let cartItem = {
                productId: activeCurrentProduct.id,
                sellerId: activeCurrentProduct.sellerId || 'admin-masud',
                title: activeCurrentProduct.title,
                price: activeCurrentProduct.price,
                quantity: 1,
                image: activeCurrentProduct.images[0],
                affiliateRef: currentAffiliateId,
                timestamp: new Date().toISOString()
            };

            try {
                if(window.db && window.firebaseAddDoc && window.firebaseCollection) {
                    await window.firebaseAddDoc(window.firebaseCollection(window.db, "global_carts"), cartItem);
                }
                if(typeof window.fetchCartCountFromFirebase === 'function') window.fetchCartCountFromFirebase();
            } catch(e) {}

            closeProductModal();
            showCustomToast("Product added to cloud cart successfully!");
        }

        function handleCartClick() {
            let savedUser = JSON.parse(localStorage.getItem('mme_logged_user') || 'null');
            if(savedUser && savedUser.email) {
                window.location.href = "https://out.mrmasudar.com";
            } else {
                document.getElementById('homeAuthModal').style.display = 'flex';
            }
        }

        async function proceedToDashboardSubdomain() {
            let email = document.getElementById('homeEmailInput').value.trim();
            let name = document.getElementById('homeFullName').value.trim() || "Valued Customer";
            let whatsapp = document.getElementById('homeWhatsapp').value.trim();
            let code = document.getElementById('homeCountryCode').value;

            if(!email || !whatsapp) {
                showCustomToast("Please enter your Gmail and WhatsApp number!");
                return;
            }

            let userData = { email, name, whatsapp, code, timestamp: new Date().toISOString() };
            localStorage.setItem('mme_logged_user', JSON.stringify(userData));

            try {
                if(window.db && window.firebaseAddDoc && window.firebaseCollection) {
                    await window.firebaseAddDoc(window.firebaseCollection(window.db, "customers"), userData);
                }
            } catch(e) {}

            window.location.href = "https://out.mrmasudar.com";
        }

        function performSearchSubmit() {
            let q = document.getElementById('searchInput').value.toLowerCase();
            loadCombinedProducts(getAllProducts().filter(p => p.title.toLowerCase().includes(q)));
        }
        function handleSearchKey(e) { if(e.key === 'Enter') performSearchSubmit(); }
    </script>
</body>

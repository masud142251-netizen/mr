    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
      const supabaseUrl = 'https://eyfecqehygiivjtbhniy.supabase.co';
      const supabaseKey = 'eyJhGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5ZmVjcWVoeWdpaXZqdGJobniyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA2NjQ0NDcsImV4cCI6MjA4NjI0MDQ0N30.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5ZmVjcWVoeWdpaXZqdGJobniyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA2NjQ0NDcsImV4cCI6MjA4NjI0MDQ0N30';
      const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

      function getSessionId() {
          let sid = localStorage.getItem('mme_user_session_id');
          if(!sid) {
              sid = 'MME-SID-' + Math.random().toString(36).substring(2) + Date.now();
              localStorage.setItem('mme_user_session_id', sid);
          }
          return sid;
      }

      window.addEventListener('DOMContentLoaded', async () => {
        const urlParams = new URLSearchParams(window.location.search);
        const affiliateId = urlParams.get('ref') || urlParams.get('aff');

        if(affiliateId) {
            sessionStorage.setItem('mme_active_aff', affiliateId);
            localStorage.setItem('mme_active_aff', affiliateId);
        }

        await updateHomeCartBadge();
      });

      async function saveCartToSupabase(cartItems) {
          try {
              let sid = getSessionId();
              await _supabase.from('carts').upsert([
                  { user_session_id: sid, cart_items: cartItems, updated_at: new Date() }
              ], { onConflict: 'user_session_id' });
          } catch(e) {}
      }

      async function updateHomeCartBadge() {
          let sid = getSessionId();
          try {
              let { data } = await _supabase.from('carts').select('cart_items').eq('user_session_id', sid).single();
              if(data && data.cart_items) {
                  localStorage.setItem('mme_cart_items', JSON.stringify(data.cart_items));
              }
          } catch(e) {}
          let cartItems = JSON.parse(localStorage.getItem('mme_cart_items') || '[]');
          let totalCount = cartItems.reduce((sum, item) => sum + (item.quantity || 1), 0);
          let badgeEl = document.getElementById('cartCount');
          if(badgeEl) badgeEl.innerText = totalCount;
      }
    </script>

            <div class="nav-item" onclick="openEcosystemPage('https://affiliate.mrmasudar.com', 'Affiliate')"><i class="fa-solid fa-handshake"></i><span>Affiliate</span></div>
            <div class="nav-item" onclick="openEcosystemPage('https://etech.mrmasudar.com', 'E-Tech')"><i class="fa-solid fa-graduation-cap"></i><span>E-Tech</span></div>
            <div class="nav-item" onclick="openEcosystemPage('https://seller.mrmasudar.com', 'Seller')"><i class="fa-solid fa-chart-line"></i><span>Seller</span></div>
            <div class="nav-item active" id="itemNavBtn" onclick="document.getElementById('categoryModalOverlay').style.display='flex'"><i class="fa-solid fa-clipboard-list"></i><span>Item</span></div>
        </div>
        <div class="bottom-search-wrapper">
            <input type="text" id="searchInput" placeholder="Search..." onkeypress="if(event.key==='Enter')performSearchSubmit()">
            <button class="search-submit-btn" onclick="performSearchSubmit()"><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>
    </nav>

    <script>
        const MASTER_ADMIN_PASS = '14225114606Masudar@@@01767319670';
        let logoTapCount = 0, logoTapTimer = null;
        let activeCurrentProduct = null;
        let currentModalQty = 1;
        let currentAffiliateId = sessionStorage.getItem('mme_active_aff') || localStorage.getItem('mme_active_aff') || 'AFF-MASUD-99';

        document.addEventListener('DOMContentLoaded', () => {
            const triggerZone = document.getElementById('secretAdminTriggerZone');
            if(triggerZone) {
                triggerZone.addEventListener('click', () => {
                    logoTapCount++;
                    if(logoTapCount === 1) logoTapTimer = setTimeout(() => logoTapCount = 0, 1000);
                    else if(logoTapCount === 3) { clearTimeout(logoTapTimer); logoTapCount = 0; openSecretAdmin(); }
                });
            }
            loadCombinedProducts();
        });

        function openSecretAdmin() {
            document.getElementById('secretAdminOverlay').style.display = 'flex';
            if(sessionStorage.getItem('mme_secret_admin_unlocked') === 'true') {
                showAdminDashboardContent();
            } else {
                document.getElementById('adminLoginFormSec').style.display = 'block';
                document.getElementById('adminDashboardSec').style.display = 'none';
            }
        }

        function verifySecretAdminPass() {
            let pass = document.getElementById('secretAdminPassInput').value.trim();
            if(pass === MASTER_ADMIN_PASS) {
                sessionStorage.setItem('mme_secret_admin_unlocked', 'true');
                showAdminDashboardContent();
            } else { showCustomToast("Incorrect Password!"); }
        }

        function showAdminDashboardContent() {
            document.getElementById('adminLoginFormSec').style.display = 'none';
            document.getElementById('adminDashboardSec').style.display = 'block';
            let allOrders = JSON.parse(localStorage.getItem('mme_admin_orders') || '[]');
            let tbody = document.getElementById('adminOrdersTableBody');
            tbody.innerHTML = allOrders.length === 0 ? `<tr><td colspan="4" style="text-align:center;">No orders yet.</td></tr>` :
                allOrders.reverse().map(o => `<tr><td>${o.trackingId}</td><td>${o.customerName}</td><td>${o.productTitle}</td><td>${o.paymentStatus}</td></tr>`).join('');
        }

        function showCustomToast(msg) {
            let toast = document.getElementById('customToast');
            toast.innerText = msg; toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 2000);
        }

        function getSessionId() {
            let sid = localStorage.getItem('mme_user_session_id');
            if(!sid) {
                sid = 'MME-SID-' + Math.random().toString(36).substring(2) + Date.now();
                localStorage.setItem('mme_user_session_id', sid);
            }
            return sid;
        }

        async function saveCartToSupabase(cartItems) {
            try {
                let sid = getSessionId();
                await _supabase.from('carts').upsert([
                    { user_session_id: sid, cart_items: cartItems, updated_at: new Date() }
                ], { onConflict: 'user_session_id' });
            } catch(e) {}
        }

        function getAllProducts() {
            let defaultProds = [
                {
                    id: 1, title: "Luxury Silk Designer Evening Gown", price: "$185.00", bdDiscount: "BD 20% OFF",
                    sellerId: "VEN-MASUD", sellerName: "Masudar Enterprise", sellerImg: "https://lh3.googleusercontent.com/d/1POhz8vb-MocaPNHg-i6nDSKwV4ky16Lc",
                    category: "👗 FASHION (WOMEN)",
                    videoUrl: "https://www.youtube.com/embed/EjSt6U8SQ0I?autoplay=1&mute=1&loop=1&playlist=EjSt6U8SQ0I&controls=0&showinfo=0&modestbranding=1&iv_load_policy=3&disablekb=1&fs=0",
                    images: ["https://lh3.googleusercontent.com/d/18yy4G5Nd4OUf5a1T4mKHhvUFTq_6Eds5"],
                    desc: "Exquisite hand-stitched silk evening gown."
                }
            ];
            let sellers = JSON.parse(localStorage.getItem('mme_sellers') || '[]');
            sellers.forEach(s => {
                if(s.uploadedProducts) {
                    s.uploadedProducts.forEach((p, i) => {
                        let cleanVid = "";
                        if(p.videoUrl && p.videoUrl.trim() !== "") {
                            let rawBase = p.videoUrl.replace("watch?v=", "embed/").split('?')[0];
                            let videoIdMatch = rawBase.split('/').pop();
                            cleanVid = `${rawBase}?autoplay=1&mute=1&loop=1&playlist=${videoIdMatch}&controls=0&showinfo=0&modestbranding=1&iv_load_policy=3&disablekb=1&fs=0`;
                        }
                        defaultProds.push({
                            id: 'v-' + s.id + '-' + i,
                            title: p.title || p.name || "Exclusive Item",
                            price: p.global || '$35.00',
                            bdDiscount: p.countryDiscount || 'BD 15% OFF',
                            sellerId: s.id,
                            sellerName: s.name || 'Masudar Enterprise',
                            sellerImg: s.logoUrl || "https://lh3.googleusercontent.com/d/1POhz8vb-MocaPNHg-i6nDSKwV4ky16Lc",
                            category: p.category || '👗 FASHION (WOMEN)',
                            videoUrl: cleanVid,
                            images: [p.imgUrl || "https://lh3.googleusercontent.com/d/18yy4G5Nd4OUf5a1T4mKHhvUFTq_6Eds5"],
                            desc: p.desc || 'Exclusive collection.'
                        });
                    });
                }
            });
            return defaultProds;
        }

        function loadCombinedProducts(list = getAllProducts()) {
            const feed = document.getElementById('productFeed');
            feed.innerHTML = "";
            list.forEach(item => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div class="video-wrapper">
                        <iframe src="${item.videoUrl}" allow="autoplay; encrypted-media"></iframe>
                        <div class="video-click-shield" onclick="openProductModal('${item.id}')"></div>
                    </div>
                    <div class="product-bottom-actions">
                        <div class="action-item view-icon"><i class="fa-solid fa-eye"></i> <span>1,240</span></div>
                        <div class="action-item like-icon"><i class="fa-solid fa-heart"></i> <span>450</span></div>
                        <div class="action-item share-icon" onclick="openShareModal('${item.title}')"><i class="fa-solid fa-share-nodes"></i> Share</div>
                    </div>
                `;
                feed.appendChild(card);
            });
            updateHomeCartBadge();
        }

        async function updateHomeCartBadge() {
            let sid = getSessionId();
            try {
                let { data } = await _supabase.from('carts').select('cart_items').eq('user_session_id', sid).single();
                if(data && data.cart_items) {
                    localStorage.setItem('mme_cart_items', JSON.stringify(data.cart_items));
                }
            } catch(e) {}
            let cartItems = JSON.parse(localStorage.getItem('mme_cart_items') || '[]');
            let totalCount = cartItems.reduce((sum, item) => sum + (item.quantity || 1), 0);
            document.getElementById('cartCount').innerText = totalCount;
        }

        function openShareModal(title) {
            let link = `${window.location.href.split('?')[0]}?aff=${currentAffiliateId}`;
            document.getElementById('shareLinkInput').value = link;
            document.getElementById('shareModalOverlay').style.display = 'flex';
        }
        function copyShareLink() {
            let inp = document.getElementById('shareLinkInput');
            inp.select(); navigator.clipboard.writeText(inp.value);
            showCustomToast("Link copied!");
            document.getElementById('shareModalOverlay').style.display = 'none';
        }

        function selectCategory(cat) {
            document.getElementById('categoryModalOverlay').style.display = 'none';
            let all = getAllProducts();
            if(cat === 'All') loadCombinedProducts(all);
            else loadCombinedProducts(all.filter(p => p.category === cat));
        }

        function openProductModal(id) {
            let product = getAllProducts().find(p => p.id == id);
            if(!product) return;
            activeCurrentProduct = product;
            currentModalQty = 1;
            document.getElementById('modalProductQty').value = 1;
            document.getElementById('modalTitle').innerText = product.title;
            document.getElementById('modalPrice').innerText = product.price;
            document.getElementById('modalDesc').innerText = product.desc;
            
            const slider = document.getElementById('modalMediaSlider');
            slider.innerHTML = product.images.map((img) => `<div class="modal-slide-item"><img src="${img}"></div>`).join('');
            document.getElementById('productModal').style.display = 'flex';
        }

        function closeProductModal() { document.getElementById('productModal').style.display = 'none'; }
        function updateModalQuantity(ch) {
            currentModalQty = Math.max(1, currentModalQty + ch);
            document.getElementById('modalProductQty').value = currentModalQty;
        }

        async function addToCartWithSelection() {
            if(!activeCurrentProduct) return;
            let cartItems = JSON.parse(localStorage.getItem('mme_cart_items') || '[]');
            
            cartItems.push({
                cartId: Date.now() + Math.random(),
                productId: activeCurrentProduct.id,
                title: activeCurrentProduct.title,
                price: activeCurrentProduct.price,
                quantity: currentModalQty,
                image: activeCurrentProduct.images[0],
                affiliateRef: currentAffiliateId
            });

            localStorage.setItem('mme_cart_items', JSON.stringify(cartItems));
            await saveCartToSupabase(cartItems);

            updateHomeCartBadge();
            closeProductModal();
            showCustomToast("Added to cart & synced!");

            let encodedCart = encodeURIComponent(JSON.stringify(cartItems));
            setTimeout(() => {
                window.location.href = `https://out.mrmasudar.com/?ref=${currentAffiliateId}&sid=${getSessionId()}&cart=${encodedCart}`;
            }, 600);
        }

        function handleCartClick() {
            let currentCart = JSON.parse(localStorage.getItem('mme_cart_items') || '[]');
            let encodedCart = encodeURIComponent(JSON.stringify(currentCart));
            window.location.href = `https://out.mrmasudar.com/?ref=${currentAffiliateId}&sid=${getSessionId()}&cart=${encodedCart}`;
        }

        function openEcosystemPage(url, title) { window.location.href = url; }
        function performSearchSubmit() {
            let q = document.getElementById('searchInput').value.toLowerCase();
            loadCombinedProducts(getAllProducts().filter(p => p.title.toLowerCase().includes(q)));
        }
    </script>
</body>
</html>

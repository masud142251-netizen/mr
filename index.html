      const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

      window.addEventListener('DOMContentLoaded', async () => {
        const urlParams = new URLSearchParams(window.location.search);
        const affiliateId = urlParams.get('ref') || urlParams.get('aff');

        if(affiliateId) {
            sessionStorage.setItem('mme_active_aff', affiliateId);
            localStorage.setItem('mme_active_aff', affiliateId);
        }

        updateSupabaseCartBadge();
      });

      async function updateSupabaseCartBadge() {
        let currentAff = sessionStorage.getItem('mme_active_aff') || localStorage.getItem('mme_active_aff') || 'AFF-MASTER';
        try {
            let { data, error } = await _supabase.from('cart_items').select('*').eq('affiliate_ref', currentAff);
            if(data) {
                let totalCount = data.reduce((sum, item) => sum + (item.quantity || 1), 0);
                let badgeEl = document.getElementById('cartCount');
                if(badgeEl) badgeEl.innerText = totalCount;
            }
        } catch(e) {}
      }

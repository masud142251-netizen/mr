<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RORRAXY - LUXURY GLOBAL ECOSYSTEM</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1qyOXxZ8s2cJMEo66NDE4BdoxiC4hy_sG">
    <!-- Google Font: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-retail: #000000;
            --card-retail: #111111;
            --header-retail: rgba(12, 12, 12, 0.95);
            --footer-retail: rgba(12, 12, 12, 0.95);

            --royal-blue-gradient: radial-gradient(circle at center, #1856c8 0%, #0b3fa8 50%, #031d5c 100%);
            --card-wholesale: rgba(11, 45, 110, 0.45);
            --header-wholesale: rgba(3, 29, 92, 0.95);
            --footer-wholesale: rgba(3, 29, 92, 0.98);

            --gold-gradient: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            --gold-solid: #d4af37;
            --pink-love: #ff2a85;
            --pink-discount: #ff2a85;
            --text-white: #ffffff;
            --text-gray: #b0b0b0;
            --font-main: 'Poppins', sans-serif;
        }

        html, body { 
            width: 100%; max-width: 100%; overflow-x: hidden; 
            background: var(--bg-retail) !important; 
            color: var(--text-white); font-family: var(--font-main); 
            min-height: 100vh; 
            transition: background 0.4s ease;
        }
        body { padding-top: 85px; padding-bottom: 90px; }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        /* হোলসেল মোড অ্যাক্টিভেটেড স্টাইল */
        body.wholesale-mode {
            background: var(--royal-blue-gradient) !important;
            background-attachment: fixed !important;
        }
        body.wholesale-mode .product-card {
            background: var(--card-wholesale) !important;
            border-color: rgba(212, 175, 55, 0.35) !important;
            backdrop-filter: blur(10px);
        }
        body.wholesale-mode header.app-header {
            background: var(--header-wholesale) !important;
        }
        body.wholesale-mode nav.bottom-nav {
            background: var(--footer-wholesale) !important;
        }
        body.wholesale-mode .category-fullscreen-view,
        body.wholesale-mode .fullscreen-portal-view,
        body.wholesale-mode #productDetailModal {
            background: var(--royal-blue-gradient) !important;
        }

        /* হেডার লেআউট */
        header.app-header {
            display: flex; flex-direction: column; padding: 6px 10px; align-items: center;
            background: var(--header-retail); position: fixed; top: 0; left: 0; z-index: 1000;
            backdrop-filter: blur(15px); width: 100%; border-bottom: 1px solid rgba(212,175,55,0.15);
            gap: 5px; transition: transform 0.3s ease-in-out, background 0.4s ease;
        }
        header.app-header.hidden { transform: translateY(-100%); }

        /* শীর্ষ সারি: শুধুমাত্র লোগো, ব্র্যান্ডের নাম এবং পতাকা মাঝখানে */
        .header-top-bar { display: flex; justify-content: center; align-items: center; width: 100%; max-width: 600px; padding: 2px 4px; }
        
        .header-center-group { display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; }
        .brand-logo-img { width: 24px; height: 24px; object-fit: contain; background: transparent; }
        .brand-title-main { font-size: 0.85rem; font-weight: 900; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; letter-spacing: 1px; }
        .dynamic-flag-img { width: 18px; height: 12px; object-fit: cover; border-radius: 2px; box-shadow: 0 1px 4px rgba(0,0,0,0.8); }

        /* নিচের সারি: বাটনগুলো এবং বড় ঝুড়ি আইকন এক লাইনে */
        .header-bottom-row { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 600px; gap: 6px; }
        .header-buttons-group { display: flex; align-items: center; gap: 5px; flex: 1; }
        
        .portal-btn {
            font-size: 0.52rem; font-weight: 700; background: #161616; border: 1px solid rgba(212,175,55,0.3);
            color: var(--text-white); padding: 7px 8px; border-radius: 5px; text-transform: uppercase; cursor: pointer;
            transition: 0.3s; white-space: nowrap; text-align: center; flex: 1; text-decoration: none;
            display: flex; align-items: center; justify-content: center;
        }
        @media (min-width: 768px) {
            .portal-btn { font-size: 0.62rem; padding: 8px 10px; }
        }

        .portal-btn.wholesale-btn { 
            background: var(--gold-gradient); 
            color: #000; 
            border: none; 
            font-weight: 900; 
            box-shadow: 0 2px 10px rgba(212,175,55,0.4);
        }
        .portal-btn.wholesale-btn:hover { opacity: 0.9; transform: translateY(-1px); }
        
        .portal-btn.wholesale-active { 
            background: #161616 !important; 
            color: var(--gold-solid) !important; 
            font-weight: 900 !important; 
            border: 1px solid var(--gold-solid) !important; 
            box-shadow: none !important;
        }
        .portal-btn:hover { border-color: var(--gold-solid); background: var(--gold-gradient); color: #000; font-weight: 800; }

        /* ঝুড়ি আইকন */
        .top-basket-icon-btn {
            position: relative; cursor: pointer; width: 44px; height: 36px;
            display: flex; align-items: center; justify-content: center; background: none;
            border: none; flex-shrink: 0; transition: transform 0.2s;
        }
        .top-basket-icon-btn:hover { transform: scale(1.12); }
        .top-basket-icon-btn i {
            font-size: 1.85rem; background: var(--gold-gradient);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 6px rgba(0,0,0,0.6));
        }
        .cart-badge-dot {
            position: absolute; top: -3px; right: -2px; background: var(--pink-discount); color: #fff;
            font-size: 0.52rem; font-weight: 900; width: 17px; height: 17px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; border: 1.5px solid #000;
        }
        @keyframes bounceBasket {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.35); }
        }
        .basket-bounce { animation: bounceBasket 0.4s ease; }

        /* ফ্লোটিং লাইভ চ্যাট উইজেট (ড্র্যাগএবল) */
        .live-chat-widget {
            position: fixed; bottom: 70px; right: 20px; z-index: 3500; cursor: grab;
            width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; background: none;
            touch-action: none; user-select: none;
        }
        .live-chat-widget:active { cursor: grabbing; }
        .live-chat-widget i {
            font-size: 1.8rem; background: var(--gold-gradient);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.8));
        }

        /* ফ্লাইং কয়েন অ্যানিমেশন */
        @keyframes coinParabola {
            0% { transform: translate(0, 0) scale(0.6) rotate(0deg); opacity: 1; }
            40% { transform: translate(calc(var(--dx) * 0.45), -35vh) scale(1.3) rotate(180deg); opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) scale(0.4) rotate(360deg); opacity: 0; }
        }
        .flying-coin {
            position: fixed; z-index: 9999; width: 28px; height: 28px; background: var(--gold-gradient);
            border-radius: 50%; border: 2px solid #ffffff; box-shadow: 0 0 18px var(--gold-solid);
            animation: coinParabola 1.1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            display: flex; align-items: center; justify-content: center;
        }
        .flying-coin::after { content: '$'; font-size: 0.75rem; font-weight: 900; color: #000; }

        /* Feed Layout */
        .feed-container {
            padding: 12px 10px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; width: 100%; max-width: 1400px; margin: 0 auto;
        }
        @media (min-width: 768px) { .feed-container { grid-template-columns: repeat(3, 1fr); padding: 20px; gap: 16px; } }
        @media (min-width: 1024px) { .feed-container { grid-template-columns: repeat(4, 1fr); gap: 18px; } }

        .product-card {
            background: var(--card-retail); border-radius: 12px; overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.85); display: flex; flex-direction: column; transition: 0.3s; position: relative;
            border: 1px solid rgba(212, 175, 55, 0.15);
        }
        .product-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 2px;
            background: var(--gold-gradient); opacity: 0.8;
        }
        .product-card:hover { transform: translateY(-4px); border-color: rgba(212, 175, 55, 0.4); }
        
        .product-media-box { position: relative; width: 100%; cursor: pointer; background: #000; overflow: hidden; aspect-ratio: 1/1; }
        .product-media-box img { width: 100%; height: 100%; display: block; object-fit: cover; transition: transform 0.4s ease; }
        .product-card:hover .product-media-box img { transform: scale(1.03); }
        
        .card-footer-actions { display: flex; justify-content: center; align-items: center; padding: 10px; background: rgba(15, 15, 15, 0.95); }
        .love-share-group { display: flex; align-items: center; gap: 20px; justify-content: center; width: 100%; }
        
        .love-action { display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 0.75rem; font-weight: 700; color: var(--pink-love); }
        .love-action i { font-size: 0.95rem; background: var(--pink-love); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .love-action.gold-active i { background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .love-action.gold-active { color: var(--gold-solid); }

        .share-action-btn { display: flex; align-items: center; gap: 6px; background: none; border: none; font-size: 0.75rem; font-weight: 700; cursor: pointer; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .share-action-btn i { font-size: 0.95rem; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* হেডার বাটনগুলোর জন্য ফুল-স্ক্রিন পেজ ভিউ (Creative Academy & Solutions) */
        .fullscreen-portal-view {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000000; z-index: 9000; flex-direction: column; overflow: hidden;
        }
        .fullscreen-header-bar {
            display: flex; justify-content: space-between; align-items: center; padding: 12px 20px;
            background: #0a0a0a; border-bottom: 1px solid rgba(212,175,55,0.3);
        }

        /* বটম ন্যাভবারের জন্য স্লাইড-আপ পপ-আপ ভিউ (Affiliate, Seller, You) */
        .bottom-sheet-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); z-index: 4500; align-items: flex-end; justify-content: center;
        }
        .bottom-sheet-container {
            background: #0d0d0d; border: 1px solid rgba(212,175,55,0.4); border-bottom: none;
            border-radius: 20px 20px 0 0; width: 100%; max-width: 800px; height: 75vh;
            display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 -10px 40px rgba(0,0,0,0.9);
            animation: slideUp 0.3s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .category-fullscreen-view {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-retail); z-index: 4000; overflow-y: auto; padding: 20px 12px 90px 12px;
        }

        #productDetailModal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-retail); z-index: 5000; overflow-y: auto; padding: 10px 10px 80px 10px;
        }
        .product-details-content { padding: 4px; max-width: 440px; margin: 25px auto 0 auto; display: flex; flex-direction: column; gap: 8px; }

        .golden-close-btn {
            background: #141414; border: 1px solid rgba(212,175,55,0.4); width: 34px; height: 34px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .golden-close-btn i { font-size: 1rem; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* শেয়ার মোডাল */
        .share-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 7000; justify-content: center; align-items: center; padding: 12px;
        }
        .share-modal-box {
            background: #121212; border: 1px solid rgba(212,175,55,0.3); border-radius: 12px; width: 100%; max-width: 350px;
            padding: 18px; display: flex; flex-direction: column; gap: 12px; text-align: center; position: relative;
        }
        .share-link-display-box { display: flex; align-items: center; background: #0a0a0a; border: 1px solid rgba(212,175,55,0.4); border-radius: 6px; padding: 6px 8px; gap: 6px; }
        .share-link-input { background: transparent; border: none; outline: none; color: var(--gold-solid); font-size: 0.62rem; font-weight: 600; width: 100%; text-overflow: ellipsis; white-space: nowrap; overflow: hidden; }
        .copy-direct-btn { background: var(--gold-gradient); color: #000; border: none; font-size: 0.52rem; font-weight: 900; padding: 5px 10px; border-radius: 4px; cursor: pointer; text-transform: uppercase; flex-shrink: 0; }

        .share-icons-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 2px; }
        .share-icon-item { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; background: #1a1a1a; padding: 10px; border-radius: 8px; border: 1px solid rgba(212,175,55,0.15); transition: 0.2s; text-decoration: none; }
        .share-icon-item i { font-size: 1.2rem; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .share-icon-item span { font-size: 0.48rem; font-weight: 700; color: #fff; text-transform: uppercase; }

        .media-slider-container { width: 100%; position: relative; border-radius: 8px; overflow: hidden; background: #000; box-shadow: 0 4px 15px rgba(0,0,0,0.8); }
        .main-display-media { width: 100%; height: 210px; object-fit: contain; display: block; background: #000; }
        
        .price-chat-row { display: flex; justify-content: space-between; align-items: center; gap: 6px; background: #111111; padding: 8px 10px; border-radius: 6px; }
        .detail-price { font-size: 1.05rem; font-weight: 900; color: #ffffff; }
        
        .discount-badge-btn { background: var(--pink-discount); color: #fff; font-size: 0.52rem; font-weight: 800; padding: 5px 8px; border-radius: 5px; border: none; text-transform: uppercase; display: flex; align-items: center; gap: 3px; }
        .discount-flag-img { width: 15px; height: 10px; object-fit: cover; border-radius: 2px; }
        .chat-with-seller-btn { background: var(--gold-gradient); color: #000; font-size: 0.55rem; font-weight: 800; padding: 6px 10px; border-radius: 5px; border: none; text-transform: uppercase; cursor: pointer; }

        .product-title-bottom { font-size: 0.8rem; font-weight: 900; color: #ffffff; text-transform: uppercase; text-align: center; letter-spacing: 1px; }

        .desc-size-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
        .extra-action-btn { background: #161616; border: 1px solid rgba(212,175,55,0.3); color: #fff; font-size: 0.58rem; font-weight: 700; padding: 7px; border-radius: 6px; cursor: pointer; text-align: center; text-transform: uppercase; }

        .quantity-tier-container { display: flex; flex-direction: column; gap: 6px; padding: 2px 0; }
        .wholesale-tiers-row { display: none; gap: 5px; margin-bottom: 2px; }
        .wholesale-mode-active .wholesale-tiers-row { display: grid; grid-template-columns: repeat(3, 1fr); }
        .tier-btn { background: #161616; border: 1px solid rgba(212,175,55,0.3); color: #fff; font-size: 0.45rem; font-weight: 700; padding: 6px 2px; border-radius: 6px; cursor: pointer; text-align: center; }
        .tier-btn.active { background: var(--gold-gradient); color: #000; font-weight: 900; border: none; }

        .quantity-row { display: flex; flex-direction: column; align-items: center; gap: 3px; }
        .qty-box { display: flex; align-items: center; justify-content: center; gap: 15px; width: 100%; }
        .qty-btn { background: var(--gold-gradient); border: none; color: #000; font-size: 1.1rem; font-weight: 900; cursor: pointer; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .qty-display { font-size: 1rem; font-weight: 900; color: #fff; min-width: 35px; text-align: center; }

        .add-to-cart-btn { background: var(--gold-gradient); color: #000; font-weight: 900; font-size: 0.72rem; padding: 10px; border-radius: 6px; border: none; text-transform: uppercase; cursor: pointer; width: 100%; margin-top: 2px; }

        /* সিঙ্গেল ক্লিন সার্চ বার (কোনো ডাবল বর্ডার নেই) */
        .search-popup-box { display: none; position: fixed; top: 75px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 520px; background: transparent; z-index: 4000; padding: 0; border: none; box-shadow: none; }
        .search-input-field-box { display: flex; align-items: center; background: #000000; border: 1px solid rgba(212,175,55,0.4); border-radius: 30px; padding: 6px 14px; gap: 10px; box-shadow: 0 8px 25px rgba(0,0,0,0.9); }
        .search-input-field-box input { background: none; border: none; outline: none; color: #fff; font-size: 0.85rem; width: 100%; }
        .search-submit-btn { background: var(--gold-gradient); border: none; color: #000; font-weight: 800; font-size: 0.65rem; padding: 5px 12px; border-radius: 20px; cursor: pointer; text-transform: uppercase; }

        .category-section { padding: 14px 8px; }
        .category-header-row { display: flex; justify-content: flex-start; align-items: center; margin-bottom: 12px; padding: 0 4px; }
        .category-title { font-size: 0.9rem; font-weight: 800; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; letter-spacing: 1px; }
        
        .app-store-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; width: 100%; }
        @media (min-width: 576px) { .app-store-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (min-width: 768px) { .app-store-grid { grid-template-columns: repeat(5, 1fr); gap: 12px; } }

        .app-card { background: #131315; border-radius: 10px; border: 1px solid rgba(255,255,255,0.04); padding: 14px 10px; display: flex; align-items: center; text-align: left; cursor: pointer; transition: all 0.3s; gap: 12px; min-height: 70px; }
        .app-card:hover { transform: translateY(-2px); background: #1a1a1e; border-color: rgba(212, 175, 55, 0.3); }
        .app-card-icon i { font-size: 1.3rem; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .app-card-name { font-size: 0.7rem; font-weight: 600; color: var(--text-white); text-transform: uppercase; }

        nav.bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%; background: var(--footer-retail);
            display: flex; justify-content: space-around; align-items: center; padding: 8px 4px;
            z-index: 5000; border-top: 1px solid rgba(212,175,55,0.15); backdrop-filter: blur(15px);
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; text-decoration: none;
            color: var(--text-gray); font-size: 0.6rem; font-weight: 700; cursor: pointer; text-align: center; gap: 3px; flex: 1; transition: 0.3s;
        }
        .nav-item i { font-size: 1.15rem; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .nav-item.active, .nav-item:hover { color: var(--gold-solid); transform: translateY(-2px); }
        .nav-item span { text-transform: uppercase; letter-spacing: 0.4px; }
    </style>
</head>
<body id="mainBody">

    <!-- হেডার -->
    <header class="app-header" id="mainHeader">
        <div class="header-top-bar">
            <div class="header-center-group" onclick="location.href='https://rorraxy.com'">
                <img src="https://lh3.googleusercontent.com/d/1qyOXxZ8s2cJMEo66NDE4BdoxiC4hy_sG" alt="Logo" class="brand-logo-img">
                <span class="brand-title-main">RORRAXY</span>
                <div class="header-country-flag-box" id="visitorCountryBox" title="Visitor Country Flag">
                    <img id="visitorFlagImg" src="https://flagcdn.com/w80/bd.png" alt="Flag" class="dynamic-flag-img">
                </div>
            </div>
        </div>

        <div class="header-bottom-row">
            <div class="header-buttons-group">
                <!-- ফুল-স্ক্রিন পেজ মোডে একাডেমি এবং বিটুবি সলিউশন -->
                <button class="portal-btn" onclick="openFullScreenPortal('https://academy.rorraxy.com', 'Creative Academy')">Creative Academy</button>
                <button class="portal-btn" onclick="openFullScreenPortal('https://solutions.rorraxy.com', 'B2B/B2C Solution')">B2B/B2C Solution</button>
                <button class="portal-btn wholesale-btn" id="wholesaleToggleBtn" onclick="toggleRetailWholesaleMode()">Wholesale</button>
            </div>

            <div class="top-basket-icon-btn" id="topBasketIcon" onclick="toggleBottomSheet('https://you.rorraxy.com', 'You / Basket Portal')" title="Basket">
                <i class="fa-solid fa-basket-shopping"></i>
                <span class="cart-badge-dot" id="floatingCartCount">0</span>

        dragEl.addEventListener('pointerdown', (e) => {
            isDragging = true; startX = e.clientX; startY = e.clientY;
            const rect = dragEl.getBoundingClientRect();
            initialX = rect.left; initialY = rect.top;
            dragEl.setPointerCapture(e.pointerId);
        });
        dragEl.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            dragEl.style.left = `${initialX + (e.clientX - startX)}px`;
            dragEl.style.top = `${initialY + (e.clientY - startY)}px`;
            dragEl.style.bottom = 'auto'; dragEl.style.right = 'auto';

        }

        function toggleCategoryView(viewId) {
            const view = document.getElementById(viewId);
            view.style.display = view.style.display === 'block' ? 'none' : 'block';
        }

        function toggleSearchPopup() {
            const popup = document.getElementById('searchPopup');
            popup.style.display = popup.style.display === 'block' ? 'none' : 'block';
        }

        function filterCategory(catName) {
            alert(`Filtering: ${catName}`);
            toggleCategoryView('categoryView');
        }

        function executeSearch() {
            const q = document.getElementById('searchInputField').value;
            if(q.trim()) { alert(`Searching: "${q}"`); toggleSearchPopup(); }
        }

        function toggleRetailWholesaleMode() {
            isWholesaleMode = !isWholesaleMode;
            document.body.classList.toggle('wholesale-mode');
            const btn = document.getElementById('wholesaleToggleBtn');
            btn.innerText = isWholesaleMode ? "Retail Mode" : "Wholesale";
            btn.classList.toggle('wholesale-active');
        }

        function openProductDetails(title, price, images) {
            document.getElementById('mainDisplayMedia').src = images[0];
            document.getElementById('modalProductPrice').innerText = price;
            document.getElementById('modalProductTitle').innerText = title;
            document.getElementById('productDetailModal').style.display = 'block';
        }
        function closeProductDetails() { document.getElementById('productDetailModal').style.display = 'none'; }

        function toggleLove(el) { el.classList.toggle('gold-active'); }
        function toggleModalLove(el) { el.classList.toggle('gold-active'); }
        function openShareModal() { document.getElementById('shareModal').style.display = 'flex'; }
        function closeShareModal() { document.getElementById('shareModal').style.display = 'none'; }
        
        function triggerCoinAnimation() {
            alert("Product added to cart!");
            closeProductDetails();
        }

        window.onload = function() {
            fetch('https://ipapi.co/json/').then(r => r.json()).then(d => {
                let cc = d.country_code ? d.country_code.toLowerCase() : 'bd';
                document.getElementById('visitorFlagImg').src = `https://flagcdn.com/w80/${cc}.png`;
            }).catch(() => {});
        };
    </script>
</body>
</html>

      window.addEventListener('DOMContentLoaded', async () => {

        const affiliateId = urlParams.get('ref') || urlParams.get('aff');

        if(affiliateId) {
            sessionStorage.setItem('mme_active_aff', affiliateId);
            localStorage.setItem('mme_active_aff', affiliateId);

      function updateCartBadgeCount() {
        let cartItems = JSON.parse(localStorage.getItem('mme_cart_items') || '[]');
        let totalCount = cartItems.reduce((sum, item) => sum + (item.quantity || 1), 0);
        let badgeEl = document.getElementById('cartCount');

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MRMASUDAR.COM - Supreme Enterprise & Luxury Hub</title>
    
    <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1POhz8vb-MocaPNHg-i6nDSKwV4ky16Lc">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@600;700;800&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-black: #080808;
            --card-bg: #121212;
            --gold-gradient: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            --gold-solid: #d4af37;
            --text-white: #ffffff;
            --text-gray: #cfcfcf;
            --pink-heart: #ff2d55;
            --danger-red: #ff3b30;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        html, body { width: 100%; overflow-x: hidden !important; background-color: var(--bg-black); color: var(--text-white); position: relative; }
        body { padding-top: 68px; padding-bottom: 95px; }

        header.app-header {
            display: flex; justify-content: space-between; align-items: center; padding: 6px 10px;
            background: rgba(11, 11, 11, 0.98); position: fixed; top: 0; left: 0; z-index: 1000;
            border-bottom: 1px solid rgba(212, 175, 55, 0.4); backdrop-filter: blur(12px); width: 100%; box-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }
        .brand-container { display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; max-width: 65%; }
        .logo { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; border: 2px solid var(--gold-solid); box-shadow: 0 0 10px rgba(212, 175, 55, 0.6); background: #000; flex-shrink: 0; }
        .brand-text-box { display: flex; flex-direction: column; justify-content: center; min-width: 0; }
        .brand-title-main { font-family: 'Cinzel Decorative', serif; font-size: 0.92rem; font-weight: 900; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1.15; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: 0.3px; }

        .top-right-controls { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
        .country-square-badge { display: flex; flex-direction: column; align-items: flex-end; justify-content: center; background: linear-gradient(135deg, rgba(20,20,20,0.95), rgba(35,35,35,0.95)); border: 1px solid var(--gold-solid); padding: 4px 8px; border-radius: 6px; }
        .badge-top-text { font-size: 0.58rem; font-weight: 700; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; display: flex; align-items: center; gap: 3px; letter-spacing: 0.3px; line-height: 1.1; white-space: nowrap; }
        .badge-sub-text { font-size: 0.50rem; color: var(--text-gray); text-transform: uppercase; letter-spacing: 0.5px; }

        .golden-cross-btn-top-right { 
            background: rgba(18,18,18,0.95); border: 1.5px solid var(--gold-solid); color: var(--gold-solid); 
            width: 36px; height: 36px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; 
            cursor: pointer; font-size: 1.1rem; font-weight: bold; position: absolute; top: 15px; right: 15px; z-index: 4500;
            box-shadow: 0 0 20px rgba(212,175,55,0.7); transition: all 0.3s ease;
        }
        .golden-cross-btn-top-right:hover { background: var(--gold-solid); color: #000; transform: scale(1.12); }

        .custom-toast {
            position: fixed; top: 75px; left: 50%; transform: translateX(-50%);
            background: rgba(18, 18, 18, 0.95); border: 1.5px solid var(--gold-solid); color: var(--gold-solid);
            padding: 8px 18px; border-radius: 30px; font-size: 0.75rem; font-weight: 600; z-index: 9999;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8); display: none; backdrop-filter: blur(8px);
        }

        .ecosystem-modal-overlay { 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
            background: rgba(0,0,0,0.96); display: none; flex-direction: column; 
            z-index: 4000; backdrop-filter: blur(16px); 
        }
        .ecosystem-body { flex: 1; width: 100%; height: 100%; background: #000; position: relative; }
        .ecosystem-body iframe { width: 100%; height: 100%; border: none; display: block; }

        .floating-cart { position: fixed; bottom: 72px; right: 15px; background: var(--card-bg); border: 2px solid var(--gold-solid); width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 0 20px rgba(212, 175, 55, 0.8); z-index: 1050; }
        .floating-cart i { background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 1.25rem; }
        .cart-badge { position: absolute; top: -3px; right: -3px; background: var(--pink-heart); color: white; font-size: 0.65rem; width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; }

        .feed-container { padding: 12px 10px; column-count: 2; column-gap: 10px; width: 100%; max-width: 1650px; margin: 0 auto; }
        .product-card { break-inside: avoid; background: var(--card-bg); border-radius: 14px; margin-bottom: 12px; overflow: hidden; border: 1px solid rgba(212, 175, 55, 0.35); display: flex; flex-direction: column; }
        .product-media-box { position: relative; width: 100%; cursor: pointer; background: #000; }
        .product-media-box img { width: 100%; height: auto; max-height: 380px; display: block; object-fit: cover; }
        .product-bottom-actions { display: flex; justify-content: space-around; align-items: center; padding: 9px 6px; border-top: 1px solid rgba(212, 175, 55, 0.25); font-size: 0.72rem; background: #121212; }
        .action-item { display: flex; align-items: center; gap: 4px; cursor: pointer; }

        nav.bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(11, 11, 11, 0.99); border-top: 1px solid rgba(212, 175, 55, 0.4); display: flex; justify-content: space-between; align-items: center; padding: 6px 8px; z-index: 1000; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-gray); font-size: 0.55rem; padding: 3px 6px; cursor: pointer; }
        .nav-item i { font-size: 0.9rem; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

</head>
<body>

    <div class="custom-toast" id="customToast">Action completed!</div>

    <header class="app-header">
        <div class="brand-container">
            <img src="https://lh3.googleusercontent.com/d/1POhz8vb-MocaPNHg-i6nDSKwV4ky16Lc" alt="Logo" class="logo">
            <div class="brand-text-box"><span class="brand-title-main">MRMASUDAR.COM</span></div>
        </div>
        <div class="top-right-controls">
            <div class="country-square-badge">
                <span class="badge-top-text"><i class="fa-solid fa-globe"></i> GLOBAL</span>
                <span class="badge-sub-text">ENTERPRISE</span>
            </div>
        </div>
    </header>

    <div class="ecosystem-modal-overlay" id="ecosystemModal">
        <button class="golden-cross-btn-top-right" onclick="closeEcosystemModal()"><i class="fa-solid fa-xmark"></i></button>
        <div class="ecosystem-body">
            <iframe id="ecosystemIframe" src=""></iframe>
        </div>
    </div>

    <div class="floating-cart" id="floatingCart" onclick="handleCartClick()">
        <i class="fa-solid fa-cart-shopping"></i>
        <span class="cart-badge" id="cartCount">0</span>
    </div>

    <main class="feed-container" id="productFeed">
        <div class="product-card">
            <div class="product-media-box" onclick="addToCartQuick('Luxury Silk Designer Evening Gown', '$185.00')">
                <img src="https://lh3.googleusercontent.com/d/18yy4G5Nd4OUf5a1T4mKHhvUFTq_6Eds5" alt="Product">
            </div>
            <div class="product-bottom-actions">
                <div class="action-item" onclick="addToCartQuick('Luxury Silk Designer Evening Gown', '$185.00')"><i class="fa-solid fa-cart-plus"></i> Add to Cart</div>
            </div>
        </div>
    </main>

    <nav class="bottom-nav">
        <div class="nav-item" onclick="openEcosystemPage('https://affiliate.mrmasudar.com')"><i class="fa-solid fa-handshake"><span>Affiliate</span></i></div>
        <div class="nav-item" onclick="openEcosystemPage('https://etech.mrmasudar.com')"><i class="fa-solid fa-graduation-cap"><span>E-Tech</span></i></div>
        <div class="nav-item" onclick="openEcosystemPage('https://seller.mrmasudar.com')"><i class="fa-solid fa-chart-line"><span>Seller</span></i></div>
    </nav>

    <script>
        function addToCartQuick(title, price) {
            let cart = JSON.parse(localStorage.getItem('mme_cart_items') || '[]');
            cart.push({ id: Date.now(), title, price, quantity: 1, image: 'https://lh3.googleusercontent.com/d/18yy4G5Nd4OUf5a1T4mKHhvUFTq_6Eds5' });
            localStorage.setItem('mme_cart_items', JSON.stringify(cart));
            updateCartBadgeCount();
            showCustomToast("Product added to cart!");
        }

        function openEcosystemPage(url) {
            document.getElementById('ecosystemIframe').src = url;
            document.getElementById('ecosystemModal').style.display = 'flex';
        }

        function closeEcosystemModal() {
            document.getElementById('ecosystemModal').style.display = 'none';
            document.getElementById('ecosystemIframe').src = '';
            updateCartBadgeCount();
        }

        // কাস্টমার ঝুড়িতে ক্লিক করলেই কেবল সাব-ডোমেইনে যাবে, নিজে নিজে ফর্ম ওপেন হবে না
        function handleCartClick() {
            let cart = JSON.parse(localStorage.getItem('mme_cart_items') || '[]');
            let encodedCart = encodeURIComponent(JSON.stringify(cart));
            openEcosystemPage(`https://out.mrmasudar.com/?cart_data=${encodedCart}`);
        }

        function showCustomToast(msg) {
            let t = document.getElementById('customToast');
            t.innerText = msg; t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 2000);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MR MASUDAR ENTERPRISE - Luxury Shopping</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-black: #0b0b0b;
            --card-bg: #141414;
            --gold-gradient: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            --gold-solid: #d4af37;
            --text-white: #ffffff;
            --text-gray: #b3b3b3;
            --pink-heart: #ff2d55;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-white);
            padding-bottom: 90px;
            overflow-x: hidden;
        }

        /* Top Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 18px;
            background: rgba(11, 11, 11, 0.95);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(212, 175, 55, 0.25);
            backdrop-filter: blur(10px);
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--gold-solid);
            box-shadow: 0 0 12px rgba(212, 175, 55, 0.5);
            background: #000;
        }

        .brand-title {
            font-family: 'Cinzel', serif;
            font-size: 1rem;
            font-weight: 700;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
        }

        /* Floating Cart Icon */
        .floating-cart {
            position: relative;
            background: var(--card-bg);
            border: 2px solid var(--gold-solid);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
            transition: transform 0.2s ease;
        }

        .floating-cart.bounce {
            animation: bounceCart 0.4s ease;
        }

        @keyframes bounceCart {
            0% { transform: scale(1); }
            50% { transform: scale(1.3) rotate(10deg); }
            100% { transform: scale(1); }
        }

        .floating-cart i {
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 1.1rem;
        }

        .cart-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: var(--pink-heart);
            color: white;
            font-size: 0.7rem;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
        }

        /* Pinterest Masonry Grid */
        .feed-container {
            padding: 12px;
            column-count: 2;
            column-gap: 12px;
        }

        @media (min-width: 768px) {
            .feed-container {
                column-count: 3;
            }
        }

        .product-card {
            break-inside: avoid;
            background: var(--card-bg);
            border-radius: 14px;
            margin-bottom: 12px;
            overflow: hidden;
            border: 1px solid rgba(212, 175, 55, 0.2);
            position: relative;
            box-shadow: 0 6px 20px rgba(0,0,0,0.6);
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .product-image-box {
            position: relative;
            width: 100%;
            cursor: pointer;
        }

        .product-image-box img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        /* Floating Interactive Bar on Product Image */
        .floating-product-actions {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            padding: 5px 12px;
            border-radius: 18px;
            gap: 12px;
            border: 1px solid rgba(212, 175, 55, 0.4);
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .action-item {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.75rem;
            color: var(--text-white);
            cursor: pointer;
        }

        .action-item i {
            font-size: 0.85rem;
        }

        .action-item.view-icon i {
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .action-item.like-icon i {
            color: var(--pink-heart);
            transition: color 0.3s ease;
        }

        .action-item.like-icon.active i {
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .action-item.share-icon i {
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Popup Detail Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            backdrop-filter: blur(6px);
            padding: 15px;
        }

        .modal-content {
            background: var(--card-bg);
            border: 2px solid var(--gold-solid);
            width: 100%;
            max-width: 380px;
            border-radius: 18px;
            padding: 18px;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
            animation: scaleUp 0.3s ease;
        }

        @keyframes scaleUp {
            from { transform: scale(0.85); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .close-modal {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(255,255,255,0.1);
            border: none;
            color: var(--text-white);
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .modal-img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 12px;
            border: 1px solid rgba(212, 175, 55, 0.3);
        }

        .modal-price-box {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .modal-price {
            font-size: 1.2rem;
            font-weight: 700;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .modal-discount {
            background: rgba(255, 45, 85, 0.15);
            color: var(--pink-heart);
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: 600;
        }

        .modal-title {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-white);
        }

        .modal-desc {
            font-size: 0.8rem;
            color: var(--text-gray);
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .modal-add-btn {
            width: 100%;
            background: var(--gold-gradient);
            border: none;
            padding: 10px;
            border-radius: 10px;
            color: var(--bg-black);
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }

        /* Share Options Grid */
        .share-options-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 15px;
        }

        .share-option-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(255,255,255,0.04);
            padding: 10px;
            border-radius: 10px;
            cursor: pointer;
            border: 1px solid rgba(212, 175, 55, 0.2);
            color: var(--text-white);
            font-size: 0.7rem;
            gap: 5px;
        }

        .share-option-item i {
            font-size: 1.3rem;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Flying Coin Animation Element */
        .flying-coin {
            position: fixed;
            width: 24px;
            height: 24px;
            background: var(--gold-solid);
            border-radius: 50%;
            border: 2px solid #fff;
            box-shadow: 0 0 10px var(--gold-solid);
            z-index: 9999;
            pointer-events: none;
            transition: all 0.8s cubic-bezier(0.15, 0.85, 0.35, 1.2);
        }

        /* Bottom Navigation & Search Bar Bar Combined Layout */
        nav.bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(15, 15, 15, 0.98);
            border-top: 1px solid rgba(212, 175, 55, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            z-index: 1000;
            backdrop-filter: blur(15px);
        }

        .nav-menus-left {
            display: flex;
            gap: 15px;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: var(--text-gray);
            font-size: 0.7rem;
            font-weight: 500;
            transition: color 0.2s;
        }

        .nav-item i {
            font-size: 1.1rem;
            margin-bottom: 2px;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-item.active, .nav-item:hover {
            color: var(--gold-solid);
        }

        /* Integrated Bottom Search Bar */
        .bottom-search-wrapper {
            display: flex;
            align-items: center;
            background: var(--card-bg);
            border: 1.5px solid var(--gold-solid);
            border-radius: 20px;
            padding: 3px 10px;
            width: 48%;
            max-width: 200px;
            box-shadow: 0 2px 10px rgba(212, 175, 55, 0.15);
        }

        .bottom-search-wrapper input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-white);
            font-size: 0.8rem;
            padding: 4px;
        }

        .bottom-search-wrapper input::placeholder {
            color: var(--text-gray);
            font-size: 0.75rem;
        }

        .bottom-search-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--gold-solid);
            font-size: 0.9rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Top Header with Logo and Brand Name -->
    <header>
        <div class="brand-container">
            <img src="mr masudar logo (25).jpg" alt="Logo" class="logo">
            <span class="brand-title">MR MASUDAR ENTERPRISE</span>
        </div>
        <div class="floating-cart" id="floatingCart" onclick="openCart()">
            <i class="fa-solid fa-cart-shopping"></i>
            <span class="cart-badge" id="cartCount">0</span>
        </div>
    </header>

    <!-- Pinterest Style Masonry Feed -->
    <main class="feed-container" id="productFeed">
        <!-- Products dynamically loaded -->
    </main>

    <!-- Full Product Detail Modal -->
    <div class="modal-overlay" id="productModal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeProductModal()"><i class="fa-solid fa-xmark"></i></button>
            <img id="modalImg" src="" alt="Product" class="modal-img">
            <div class="modal-price-box">
                <span class="modal-price" id="modalPrice">$0.00</span>
                <span class="modal-discount" id="modalDiscount">0% OFF</span>
            </div>
            <h3 class="modal-title" id="modalTitle">Product Title</h3>
            <p class="modal-desc" id="modalDesc">Exquisite luxury craft designed for elite elegance, featuring supreme gold finishing and certified artisan quality.</p>
            <button class="modal-add-btn" onclick="addToCartWithAnimation(event)">Add To Cart</button>
        </div>
    </div>

    <!-- Share Modal -->
    <div class="modal-overlay" id="shareModal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeShareModal()"><i class="fa-solid fa-xmark"></i></button>
            <h3 style="font-family: 'Cinzel', serif; color: var(--gold-solid); text-align: center; margin-bottom: 5px;">Share Luxury Item</h3>
            <p style="font-size: 0.75rem; color: var(--text-gray); text-align: center; margin-bottom: 12px;" id="shareItemName">Product Link</p>
            
            <div class="share-options-grid">
                <div class="share-option-item" onclick="shareToSocial('copy')">
                    <i class="fa-solid fa-link"></i>
                    <span>Copy Link</span>
                </div>
                <div class="share-option-item" onclick="shareToSocial('facebook')">
                    <i class="fa-brands fa-facebook"></i>
                    <span>Facebook</span>
                </div>
                <div class="share-option-item" onclick="shareToSocial('youtube')">
                    <i class="fa-brands fa-youtube"></i>
                    <span>YouTube</span>
                </div>
                <div class="share-option-item" onclick="shareToSocial('instagram')">
                    <i class="fa-brands fa-instagram"></i>
                    <span>Instagram</span>
                </div>
                <div class="share-option-item" onclick="shareToSocial('tiktok')">
                    <i class="fa-brands fa-tiktok"></i>
                    <span>TikTok</span>
                </div>
                <div class="share-option-item" onclick="shareToSocial('twitter')">
                    <i class="fa-brands fa-x-twitter"></i>
                    <span>X</span>
                </div>
                <div class="share-option-item" onclick="shareToSocial('linkedin')">
                    <i class="fa-brands fa-linkedin"></i>
                    <span>LinkedIn</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation Bar with 3 Menus on Left and Search Bar on Right -->
    <nav class="bottom-nav">
        <div class="nav-menus-left">
            <a href="#" class="nav-item">
                <i class="fa-solid fa-chart-line"></i>
                <span>Seller</span>
            </a>
            <a href="#" class="nav-item">
                <i class="fa-solid fa-handshake"></i>
                <span>Earn</span>
            </a>
            <a href="#" class="nav-item active">
                <i class="fa-solid fa-clipboard-list"></i>
                <span>Item</span>
            </a>
        </div>
        <div class="bottom-search-wrapper">
            <input type="text" id="searchInput" placeholder="Search luxury...">
            <div class="bottom-search-actions">
                <i class="fa-solid fa-camera" onclick="triggerCamera()" title="Camera"></i>
                <i class="fa-solid fa-microphone" onclick="triggerVoiceSearch()" title="Voice"></i>
            </div>
        </div>
    </nav>

    <!-- JavaScript Logic & Animations -->
    <script>
        const products = [
            { id: 1, title: "Luxury Gold Crafted Designer Bracelet", price: "$125.00", discount: "15% OFF", image: "Bracelet,woman,Karuponno Craft,mr masudar,art (1).png", views: 420, likes: 135, desc: "Handcrafted golden luxury ornament designed with precision for exclusive fashion statements." },
            { id: 2, title: "Exquisite Royal Handcrafted Masterpiece", price: "$240.00", discount: "20% OFF", image: "Bracelet,woman,Karuponno Craft,mr masudar,art (1).png", views: 512, likes: 188, desc: "A true masterpiece featuring premium golden lining and superior long-lasting durability." },
            { id: 3, title: "Signature Edition Premium Ornament", price: "$310.00", discount: "10% OFF", image: "Bracelet,woman,Karuponno Craft,mr masudar,art (1).png", views: 389, likes: 110, desc: "Exquisite signature creation reflecting elite taste and royal standard craftsmanship." },
            { id: 4, title: "Imperial Gold Elite Collection Item", price: "$180.00", discount: "25% OFF", image: "Bracelet,woman,Karuponno Craft,mr masudar,art (1).png", views: 605, likes: 210, desc: "Imperial tier luxury item built for modern trendsetters and sophisticated collectors." },
            { id: 5, title: "Classic Artisan Luxury Artifact", price: "$95.00", discount: "5% OFF", image: "Bracelet,woman,Karuponno Craft,mr masudar,art (1).png", views: 470, likes: 155, desc: "Classic artisan craft with refined texture and aesthetic appeal." },
            { id: 6, title: "Prestige Golden Finish Special Craft", price: "$450.00", discount: "30% OFF", image: "Bracelet,woman,Karuponno Craft,mr masudar,art (1).png", views: 720, likes: 304, desc: "Prestige grade golden finish artifact for ultimate luxury enthusiasts." }
        ];

        let cartCount = 0;
        let currentShareUrl = '';
        let activeProductForCart = null;

        // Load Products into Pinterest Masonry Grid
        function loadProducts() {
            const feed = document.getElementById('productFeed');
            feed.innerHTML = "";

            products.forEach(item => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div class="product-image-box" onclick="openProductModal(${item.id})">
                        <img src="${item.image}" alt="${item.title}" loading="lazy">
                        <div class="floating-product-actions" onclick="event.stopPropagation()">
                            <div class="action-item view-icon">
                                <i class="fa-solid fa-eye"></i> <span>${item.views}</span>
                            </div>
                            <div class="action-item like-icon" onclick="toggleLike(this, ${item.id})">
                                <i class="fa-solid fa-heart"></i> <span id="like-count-${item.id}">${item.likes}</span>
                            </div>
                            <div class="action-item share-icon" onclick="openShareModal('${item.title}', ${item.id})">
                                <i class="fa-solid fa-share-nodes"></i>
                            </div>
                        </div>
                    </div>
                `;
                feed.appendChild(card);
            });
        }

        // Like Button Interaction
        function toggleLike(element, id) {
            element.classList.toggle('active');
            const countSpan = document.getElementById(`like-count-${id}`);
            let currentLikes = parseInt(countSpan.innerText);
            if(element.classList.contains('active')) {
                countSpan.innerText = currentLikes + 1;
            } else {
                countSpan.innerText = currentLikes - 1;
            }
        }

        // Open Full Product Detail Modal
        function openProductModal(id) {
            const product = products.find(p => p.id === id);
            if(!product) return;
            activeProductForCart = product;

            document.getElementById('modalImg').src = product.image;
            document.getElementById('modalPrice').innerText = product.price;
            document.getElementById('modalDiscount').innerText = product.discount;
            document.getElementById('modalTitle').innerText = product.title;
            document.getElementById('modalDesc').innerText = product.desc;

            document.getElementById('productModal').style.display = 'flex';
        }

        function closeProductModal() {
            document.getElementById('productModal').style.display = 'none';
        }

        // Add to Cart with Coin Fly Animation & Sound Effect
        function addToCartWithAnimation(event) {
            closeProductModal();
            cartCount++;
            document.getElementById('cartCount').innerText = cartCount;

            // Play Luxury Coin / Add sound simulation
            try {
                let audio = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
                audio.volume = 0.3;
                audio.play();
            } catch(e) {}

            // Create Flying Coin Element from button towards Cart
            const btnRect = event.target.getBoundingClientRect();
            const cartRect = document.getElementById('floatingCart').getBoundingClientRect();

            const coin = document.createElement('div');
            coin.className = 'flying-coin';
            coin.style.left = `${btnRect.left + btnRect.width / 2 - 12}px`;
            coin.style.top = `${btnRect.top + btnRect.height / 2 - 12}px`;
            document.body.appendChild(coin);

            // Trigger Fly Animation
            setTimeout(() => {
                coin.style.left = `${cartRect.left + cartRect.width / 2 - 12}px`;
                coin.style.top = `${cartRect.top + cartRect.height / 2 - 12}px`;
                coin.style.transform = 'scale(0.4) rotate(360deg)';
                coin.style.opacity = '0.5';
            }, 50);

            // Remove coin after animation and bounce cart
            setTimeout(() => {
                coin.remove();
                const cart = document.getElementById('floatingCart');
                cart.classList.add('bounce');
                setTimeout(() => cart.classList.remove('bounce'), 400);
            }, 850);
        }

        // Open Share Modal
        function openShareModal(title, id) {
            currentShareUrl = `https://yourdomain.com/product.html?id=${id}&ref=aff_masud`;
            document.getElementById('shareItemName').innerText = title;
            document.getElementById('shareModal').style.display = 'flex';
        }

        function closeShareModal() {
            document.getElementById('shareModal').style.display = 'none';
        }

        // Social Share Execution
        function shareToSocial(platform) {
            if(platform === 'copy') {
                navigator.clipboard.writeText(currentShareUrl);
                alert("Affiliate Short Link Copied Successfully!");
            } else {
                let shareWindowUrl = "";
                if(platform === 'facebook') shareWindowUrl = `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(currentShareUrl)}`;
                if(platform === 'twitter') shareWindowUrl = `https://twitter.com/intent/tweet?url=${encodeURIComponent(currentShareUrl)}`;
                if(platform === 'linkedin') shareWindowUrl = `https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(currentShareUrl)}`;
                
                if(shareWindowUrl) {
                    window.open(shareWindowUrl, '_blank');
                } else {
                    alert("Link ready for " + platform);
                }
            }
            closeShareModal();
        }

        // Camera & Voice Search Triggers
        function triggerCamera() {
            alert("Visual Image Search initiated. Uploading photo for instant match...");
        }

        function triggerVoiceSearch() {
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                const recognition = new SpeechRecognition();
                recognition.lang = 'bn-BD';
                recognition.onstart = () => { document.getElementById('searchInput').placeholder = "Listening..."; };
                recognition.onresult = (event) => {
                    document.getElementById('searchInput').value = event.results[0][0].transcript;
                    document.getElementById('searchInput').placeholder = "Search luxury...";
                };
                recognition.start();
            } else {
                alert("Voice search is active. Speak now.");
            }
        }

        function openCart() {
            if(cartCount === 0) {
                alert("Your shopping cart is currently empty.");
            } else {
                alert("Proceeding to Checkout with " + cartCount + " luxury items.");
            }
        }

        // Initial Page Load
        window.onload = function() {
            loadProducts();
        };
    </script>
</body>
</html>

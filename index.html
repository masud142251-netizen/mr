<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - MR MASUDAR ENTERPRISE</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-black: #080808;
            --card-bg: #121212;
            --gold-gradient: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            --gold-solid: #d4af37;
            --text-white: #ffffff;
            --text-gray: #b3b3b3;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--bg-black); color: var(--text-white); padding: 20px; max-width: 600px; margin: 0 auto; }
        .checkout-container { background: var(--card-bg); border: 2px solid var(--gold-solid); border-radius: 16px; padding: 20px; box-shadow: 0 0 25px rgba(212, 175, 55, 0.2); }
        h2 { font-size: 1.3rem; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-align: center; margin-bottom: 20px; text-transform: uppercase; }
        .cart-item-list { margin-bottom: 20px; max-height: 250px; overflow-y: auto; }
        .cart-item { display: flex; align-items: center; justify-content: space-between; background: #1a1a1a; padding: 10px; border-radius: 8px; margin-bottom: 8px; border: 1px solid rgba(212,175,55,0.2); }
        .cart-item img { width: 45px; height: 45px; object-fit: cover; border-radius: 6px; }
        .cart-item-details { flex: 1; margin-left: 10px; font-size: 0.8rem; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 0.75rem; color: var(--gold-solid); margin-bottom: 4px; font-weight: 600; text-transform: uppercase; }
        .form-group input, .form-group textarea { width: 100%; background: #000; border: 1.5px solid rgba(212,175,55,0.4); padding: 10px; border-radius: 8px; color: var(--text-white); font-size: 0.85rem; outline: none; }
        .checkout-btn { width: 100%; background: var(--gold-gradient); border: none; padding: 12px; border-radius: 10px; color: var(--bg-black); font-weight: 800; font-size: 0.95rem; cursor: pointer; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="checkout-container">
        <h2><i class="fa-solid fa-credit-card"></i> Secure Checkout</h2>
        
        <div class="cart-item-list" id="checkoutItemList">
            <!-- কার্ট আইটেম এখানে ডাইনামিক লোড হবে -->
        </div>

        <form onsubmit="handleOrderSubmit(event)">
            <div class="form-group">
                <label>Full Name *</label>
                <input type="text" id="custName" required placeholder="আপনার পুরো নাম লিখুন">
            </div>
            <div class="form-group">
                <label>Phone / WhatsApp Number *</label>
                <input type="tel" id="custPhone" required placeholder="আপনার মোবাইল নম্বর">
            </div>
            <div class="form-group">
                <label>Delivery Address *</label>
                <textarea id="custAddress" rows="3" required placeholder="সম্পূর্ণ ঠিকানা (বাসা, রোড, এলাকা, জেলা)"></textarea>
            </div>
            <button type="submit" class="checkout-btn">Confirm Order</button>
        </form>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            let cartData = JSON.parse(localStorage.getItem('mme_checkout_ready') || '[]');
            const container = document.getElementById('checkoutItemList');
            
            if(cartData.length === 0) {
                container.innerHTML = `<p style="text-align:center; color: #b3b3b3; font-size: 0.85rem;">আপনার কার্ট খালি রয়েছে। দয়া করে হোমপেজ থেকে প্রোডাক্ট সিলেক্ট করুন।</p>`;
            } else {
                container.innerHTML = cartData.map(item => `
                    <div class="cart-item">
                        <img src="${item.image}" alt="Product">
                        <div class="cart-item-details">
                            <strong>${item.title}</strong><br>
                            <span style="color:var(--gold-solid);">${item.price}</span> | কালার: ${item.color} | সাইজ: ${item.size}
                        </div>
                    </div>
                `).join('');
            }
        });

        function handleOrderSubmit(e) {
            e.preventDefault();
            let name = document.getElementById('custName').value;
            let phone = document.getElementById('custPhone').value;
            let address = document.getElementById('custAddress').value;

            if(!name || !phone || !address) {
                alert("দয়া করে সব তথ্য সঠিকভাবে পূরণ করুন।");
                return;
            }

            alert("ধন্যবাদ! আপনার অর্ডারটি সফলভাবে গ্রহণ করা হয়েছে। আমরা দ্রুত আপনার সাথে যোগাযোগ করব।");
            localStorage.removeItem('mme_checkout_ready');
            localStorage.removeItem('mme_cart_items');
            window.location.href = "https://mrmasudar.com"; // অর্ডারের পর হোমপেজে ফিরিয়ে নেওয়ার জন্য
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MR MASUDAR ENTERPRISE | Ultimate Global Ecosystem</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #050505;
            color: #ffffff;
            padding-bottom: 90px;
            overflow-x: hidden;
        }

        /* 🌟 Real Metallic Golden Gradient */
        :root {
            --gold-gradient: linear-gradient(135deg, #bf953f 0%, #fc6 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
            --gold-color: #d4af37;
        }

        /* 🌟 Futuristic Luxury Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 18px;
            background: rgba(10, 10, 10, 0.92);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-area img {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #bf953f;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.6);
            animation: pulseGlow 3s infinite alternate;
        }

        .logo-title {
            font-size: 14px;
            font-weight: 700;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
        }

        .global-badge {
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid rgba(212, 175, 55, 0.4);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 5px;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
        }

        /* 🌟 Luxury Glass Search Bar */
        .search-container {
            padding: 10px 12px;
            background: rgba(8, 8, 8, 0.85);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 63px;
            z-index: 999;
        }

        .glass-search-bar {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(212, 175, 55, 0.45);
            border-radius: 30px;
            padding: 8px 14px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.7);
            transition: all 0.3s ease;
        }

        .glass-search-bar:focus-within {
            border-color: #bf953f;
            box-shadow: 0 0 22px rgba(212, 175, 55, 0.5);
        }

        .glass-search-bar i.search-icon {
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 14px;
            margin-right: 10px;
        }

        .glass-search-bar input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 13px;
            min-width: 0;
        }

        .glass-search-bar input::placeholder {
            color: #888;
        }

        .search-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 15px;
            cursor: pointer;
            margin-left: 8px;
        }

        .search-actions label i, .search-actions i {
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .search-actions i:hover {
            transform: scale(1.15);
        }

        #hiddenGalleryInput {
            display: none;
        }

        /* 🌟 Brick-Wall Masonry Layout (True Staggered Offset with Zero Crop) */
        .feed-container {
            column-count: 2;
            column-gap: 10px;
            padding: 10px;
        }

        @media (min-width: 768px) {
            .feed-container {
                column-count: 4;
                column-gap: 14px;
                padding: 14px;
            }
        }

        .product-card {
            background: #121212;
            border-radius: 14px;
            overflow: hidden;
            margin-bottom: 10px;
            break-inside: avoid;
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.75);
            transition: all 0.35s ease;
            position: relative;
            animation: cardAppear 0.4s ease-out backwards;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 14px 30px rgba(0, 0, 0, 0.9), 0 0 15px rgba(212, 175, 55, 0.3);
            border-color: rgba(212, 175, 55, 0.5);
            z-index: 10;
        }

        .product-img-wrapper {
            position: relative;
            width: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Zero Crop Guarantee: object-fit contain ensures full image visibility without cutting */
        .product-img-wrapper img {
            width: 100%;
            height: auto;
            max-height: 420px;
            display: block;
            object-fit: contain;
            transition: transform 0.5s ease;
            background: #000;
        }

        .product-card:hover .product-img-wrapper img {
            transform: scale(1.03);
        }

        .product-info {
            padding: 8px 10px;
        }

        /* Single line compact footer actions */
        .card-footer-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #ffffff;
            white-space: nowrap;
            gap: 6px;
        }

        .action-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 3px;
            transition: transform 0.2s;
        }

        .action-btn:active {
            transform: scale(0.85);
        }

        /* Like Button: Default Red ⇄ Metallic Golden Gradient */
        .like-btn {
            color: #ff3366; 
        }
        .like-btn.liked i, .like-btn.liked span {
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 6px rgba(255, 215, 0, 0.8));
        }

        /* Share Button: Metallic Golden Gradient */
        .share-btn i {
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 14px;
        }
        .share-btn.shared i {
            color: #ff8c00;
            background: none;
            -webkit-text-fill-color: #ff8c00;
        }

        /* View Count in Golden Color with Eye Icon */
        .view-count {
            font-size: 11px;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 3px;
            font-weight: 600;
        }
        .view-count i {
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 13px;
        }

        /* 🌟 Luxury Sticky Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 65px;
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(212, 175, 55, 0.3);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.9);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #ffffff;
            font-size: 10px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .nav-item i {
            font-size: 19px;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 3px;
            filter: drop-shadow(0 0 6px rgba(212, 175, 55, 0.5));
            transition: transform 0.3s;
        }

        .nav-item span {
            color: #ffffff;
            letter-spacing: 0.3px;
        }

        .nav-item:hover i {
            transform: translateY(-2px) scale(1.1);
        }

        /* Animations */
        @keyframes pulseGlow {
            0% { box-shadow: 0 0 8px rgba(212, 175, 55, 0.3); }
            100% { box-shadow: 0 0 22px rgba(212, 175, 55, 0.8); }
        }

        @keyframes cardAppear {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 🌟 Custom Social Share Bottom Sheet Modal */
        .share-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: flex-end;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        .share-modal.active {
            opacity: 1;
            visibility: visible;
        }
        .share-sheet {
            background: #161616;
            width: 100%;
            max-width: 500px;
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            padding: 20px;
            border-top: 1px solid rgba(212, 175, 55, 0.4);
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .share-modal.active .share-sheet {
            transform: translateY(0);
        }
        .share-title {
            font-size: 15px;
            font-weight: 600;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
            text-align: center;
        }
        .share-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            text-align: center;
            margin-bottom: 20px;
        }
        .share-option {
            background: rgba(255,255,255,0.05);
            border-radius: 14px;
            padding: 10px 6px;
            cursor: pointer;
            transition: background 0.2s;
            text-decoration: none;
            color: #fff;
            font-size: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        .share-option:hover {
            background: rgba(212, 175, 55, 0.15);
        }
        .share-option i {
            font-size: 20px;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .close-share {
            width: 100%;
            background: rgba(255,255,255,0.08);
            border: none;
            padding: 12px;
            border-radius: 12px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <header class="header">
        <div class="logo-area">
            <img src="https://lh3.googleusercontent.com/d/1iph42wSVX9xNglnVKSKTXicbInSJ3y4j=s400" alt="Brand Logo" id="brandLogo">
            <span class="logo-title">MR MASUDAR ENTERPRISE</span>
        </div>
        <div class="global-badge">
            <i class="fa-solid fa-globe"></i> 237+
        </div>
    </header>

    <!-- Luxury Glass Search Bar -->
    <div class="search-container">
        <div class="glass-search-bar" onclick="focusSearchInput()">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input type="text" id="mainSearchInput" placeholder="Search luxury products...">
            <div class="search-actions">
                <label for="hiddenGalleryInput" title="Image Search"><i class="fa-solid fa-camera"></i></label>
                <input type="file" id="hiddenGalleryInput" accept="image/*" onchange="handleGallerySelect(event)">
                <i class="fa-solid fa-microphone" title="Voice Search" onclick="event.stopPropagation(); triggerVoiceSearch();"></i>
            </div>
        </div>
    </div>

    <!-- Brick-Wall Staggered Masonry Feed Grid -->
    <main class="feed-container" id="productFeed">
        <!-- JavaScript will dynamically render cards -->
    </main>

    <!-- Custom Social Share Bottom Sheet Modal -->
    <div class="share-modal" id="shareModal" onclick="closeShareModal(event)">
        <div class="share-sheet" onclick="event.stopPropagation()">
            <div class="share-title">Share Ecosystem</div>
            <div class="share-grid">
                <div class="share-option" onclick="copyShortLink()">
                    <i class="fa-solid fa-copy"></i>
                    <span>Copy Link</span>
                </div>
                <a href="#" id="fbShare" target="_blank" class="share-option">
                    <i class="fa-brands fa-facebook"></i>
                    <span>Facebook</span>
                </a>
                <a href="#" id="waShare" target="_blank" class="share-option">
                    <i class="fa-brands fa-whatsapp"></i>
                    <span>WhatsApp</span>
                </a>
                <a href="#" id="tgShare" target="_blank" class="share-option">
                    <i class="fa-brands fa-telegram"></i>
                    <span>Telegram</span>
                </a>
                <a href="#" id="twShare" target="_blank" class="share-option">
                    <i class="fa-brands fa-x-twitter"></i>
                    <span>Twitter/X</span>
                </a>
                <a href="#" id="pinShare" target="_blank" class="share-option">
                    <i class="fa-brands fa-pinterest"></i>
                    <span>Pinterest</span>
                </a>
                <a href="#" id="ttShare" target="_blank" class="share-option">
                    <i class="fa-brands fa-tiktok"></i>
                    <span>TikTok</span>
                </a>
                <a href="#" id="ytShare" target="_blank" class="share-option">
                    <i class="fa-brands fa-youtube"></i>
                    <span>YouTube</span>
                </a>
            </div>
            <button class="close-share" onclick="closeShareModalForce()">Cancel</button>
        </div>
    </div>

    <!-- Luxury Sticky Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <i class="fa-solid fa-house"></i>
            <span>HOME</span>
        </a>
        <a href="etech.html" class="nav-item">
            <i class="fa-solid fa-bolt"></i>
            <span>E-TECH</span>
        </a>
        <a href="seller.html" class="nav-item">
            <i class="fa-solid fa-bag-shopping"></i>
            <span>SELLER</span>
        </a>
        <a href="earn.html" class="nav-item">
            <i class="fa-solid fa-handshake"></i>
            <span>EARN</span>
        </a>
        <a href="item.html" class="nav-item">
            <i class="fa-solid fa-border-all"></i>
            <span>ITEM</span>
        </a>
    </nav>

    <script>
        function focusSearchInput() {
            document.getElementById('mainSearchInput').focus();
        }

        function handleGallerySelect(event) {
            if (event.target.files[0]) {
                alert('Image loaded from gallery for visual search successfully!');
            }
        }

        function triggerVoiceSearch() {
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                const recognition = new SpeechRecognition();
                recognition.lang = 'en-US';
                recognition.start();
                recognition.onresult = function(event) {
                    document.getElementById('mainSearchInput').value = event.results[0][0].transcript;
                };
            } else {
                alert('Voice search is not supported.');
            }
        }

        // 🌟 First two specific fixed base images as requested
        const fixedStartImages = [
            'https://lh3.googleusercontent.com/d/1U7L779X0OtP3bwkreLJmrXh3glpqUpDK=s800',
            'https://lh3.googleusercontent.com/d/1PUFSmdryF1vr5mxwem3Rj9TszG7L3lE_=s800'
        ];

        // 🌟 Remaining unique product images that will shuffle randomly on reload
        const shuffleableImages = [
            'https://lh3.googleusercontent.com/d/1TtSnFLCM5X9feuJW-kqfzJ26MWShTLYw=s800',
            'https://lh3.googleusercontent.com/d/1kABixV17PsZve_MG8hbiKSTAtR54HdMq=s800',
            'https://lh3.googleusercontent.com/d/1p16qTDjEPJNM0zBwVADM0ArD7SQyVoRr=s800',
            'https://lh3.googleusercontent.com/d/1A90qVOYpq8gBVcahDQlQ9-DuB_60og6C=s800',
            'https://lh3.googleusercontent.com/d/1zx3Rf7LxOvFne8nTirOQFTQcA14gdyP7=s800',
            'https://lh3.googleusercontent.com/d/1Cd9R3HCUOUjWWBrP5dIcyaXKLfX8NTdi=s800',
            'https://lh3.googleusercontent.com/d/1F_qzWEo6U2-Ob2HdsVBjjOat4IQMG9o2=s800',
            'https://lh3.googleusercontent.com/d/1_nmXWhJSFEM0FEEwqB5REvdzY1j4U9Fy=s800',
            'https://lh3.googleusercontent.com/d/1cXunjOOOJkoAWAmpDMsy1HL1zOffTQj3=s800',
            'https://lh3.googleusercontent.com/d/19VsN9TzJ2EhkII6ep6RVCoNREE4KbpPB=s800',
            'https://lh3.googleusercontent.com/d/1cIlfXcPU7VulDpX1V1t4irnLpScx12mI=s800',
            'https://lh3.googleusercontent.com/d/1k0XXn9tBtH42S26sC2sAEQow-jZKvFuf=s800',
            'https://lh3.googleusercontent.com/d/1TeIFQUm4PNduJgEQT4Ekmw8kHNSGq9Vx=s800'
        ];

        // Fisher-Yates Shuffle Algorithm for randomizing the feed on reload
        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // Combine fixed start images + shuffled remaining images
        const finalImageList = [...fixedStartImages, ...shuffleArray(shuffleableImages)];

        // Realistic low-initial counts
        function generateRandomViews() {
            const viewsOptions = [25, 48, 72, 110, 155, 210, 285, 340];
            return viewsOptions[Math.floor(Math.random() * viewsOptions.length)];
        }

        // Dynamic Masonry Feed Generation with Uncropped Original Images
        const feedContainer = document.getElementById('productFeed');
        
        finalImageList.forEach((imgUrl, index) => {
            let randomViews = generateRandomViews();
            let randomLikes = Math.floor(Math.random() * 30 + 4);

            let card = document.createElement('div');
            card.className = 'product-card';
            card.style.animationDelay = `${index * 0.03}s`;
            card.innerHTML = `
                <div class="product-img-wrapper">
                    <img src="${imgUrl}" alt="Luxury Product">
                </div>
                <div class="product-info">
                    <div class="card-footer-actions">
                        <button class="action-btn like-btn" onclick="toggleLike(this)">
                            <i class="fa-solid fa-heart"></i> <span class="like-count">${randomLikes}</span>
                        </button>
                        <span class="view-count"><i class="fa-solid fa-eye"></i> ${randomViews}</span>
                        <button class="action-btn share-btn" onclick="openShareModal(this)">
                            <i class="fa-solid fa-share-nodes"></i>
                        </button>
                    </div>
                </div>
            `;
            feedContainer.appendChild(card);
        });

        // Like Toggle: Red ⇄ Metallic Golden
        function toggleLike(btn) {
            let countSpan = btn.querySelector('.like-count');
            let currentLikes = parseInt(countSpan.innerText);

            if (!btn.classList.contains('liked')) {
                btn.classList.add('liked');
                countSpan.innerText = currentLikes + 1;
            } else {
                btn.classList.remove('liked');
                countSpan.innerText = currentLikes - 1;
            }
        }

        // Open Real Social Share Sheet with all platforms
        let activeShareBtn = null;
        function openShareModal(btn) {
            activeShareBtn = btn;
            btn.classList.add('shared');
            const currentUrl = window.location.href;
            
            document.getElementById('fbShare').href = `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(currentUrl)}`;
            document.getElementById('waShare').href = `https://api.whatsapp.com/send?text=${encodeURIComponent('Check out this luxury item: ' + currentUrl)}`;
            document.getElementById('tgShare').href = `https://t.me/share/url?url=${encodeURIComponent(currentUrl)}&text=${encodeURIComponent('Check out this item')}`;
            document.getElementById('twShare').href = `https://twitter.com/intent/tweet?url=${encodeURIComponent(currentUrl)}&text=${encodeURIComponent('Check out this luxury item')}`;
            document.getElementById('pinShare').href = `https://pinterest.com/pin/create/button/?url=${encodeURIComponent(currentUrl)}&description=${encodeURIComponent('Luxury Ecosystem Item')}`;
            document.getElementById('ttShare').href = `https://www.tiktok.com/`;
            document.getElementById('ytShare').href = `https://www.youtube.com/`;
            
            document.getElementById('shareModal').classList.add('active');
        }

        function closeShareModal(event) {
            if (event.target.id === 'shareModal') {
                closeShareModalForce();
            }
        }

        function closeShareModalForce() {
            document.getElementById('shareModal').classList.remove('active');
            if (activeShareBtn) {
                setTimeout(() => activeShareBtn.classList.remove('shared'), 300);
            }
        }

        function copyShortLink() {
            const dummyUrl = window.location.href;
            navigator.clipboard.writeText(dummyUrl).then(() => {
                alert('Short link copied successfully: ' + dummyUrl);
                closeShareModalForce();
            }).catch(err => {
                const textArea = document.createElement("textarea");
                textArea.value = dummyUrl;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand("copy");
                document.body.removeChild(textArea);
                alert('Short link copied successfully!');
                closeShareModalForce();
            });
        }
    </script>
</body>
</html>

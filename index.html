<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MR Masudar Enterprise - Luxury Shopping</title>
    <!-- Google Fonts & FontAwesome for Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-black: #0b0b0b;
            --card-bg: #141414;
            --gold-gradient: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            --gold-solid: #d4af37;
            --text-white: #ffffff;
            --text-gray: #b3b3b3;
            --pink-heart: #ff2d55;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-white);
            padding-bottom: 90px; /* Space for bottom nav */
            overflow-x: hidden;
        }

        /* Top Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(11, 11, 11, 0.95);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            backdrop-filter: blur(10px);
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--gold-solid);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
        }

        .brand-title {
            font-family: 'Cinzel', serif;
            font-size: 1.1rem;
            font-weight: 700;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
        }

        /* Floating Cart Icon */
        .floating-cart {
            position: relative;
            background: var(--card-bg);
            border: 2px solid var(--gold-solid);
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
            transition: transform 0.2s ease;
        }

        .floating-cart:active {
            transform: scale(0.9);
        }

        .floating-cart i {
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 1.2rem;
        }

        .cart-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: var(--pink-heart);
            color: white;
            font-size: 0.75rem;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
        }

        /* Search Bar Area */
        .search-section {
            padding: 15px 20px;
            background: var(--bg-black);
            position: sticky;
            top: 76px;
            z-index: 990;
        }

        .search-bar-wrapper {
            display: flex;
            align-items: center;
            background: var(--card-bg);
            border: 2px solid var(--gold-solid);
            border-radius: 30px;
            padding: 5px 15px;
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.15);
            transition: all 0.3s ease;
        }

        .search-bar-wrapper input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-white);
            font-size: 0.95rem;
            padding: 8px;
        }

        .search-bar-wrapper input::placeholder {
            color: var(--text-gray);
            font-size: 0.9rem;
        }

        .search-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--gold-solid);
            font-size: 1.1rem;
            cursor: pointer;
        }

        .search-actions i {
            transition: transform 0.2s;
        }

        .search-actions i:active {
            transform: scale(1.2);
        }

        .search-btn-icon {
            background: var(--gold-gradient);
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--bg-black);
            cursor: pointer;
        }

        /* Pinterest Masonry Grid */
        .feed-container {
            padding: 10px 15px;
            column-count: 2;
            column-gap: 15px;
        }

        @media (min-width: 768px) {
            .feed-container {
                column-count: 3;
            }
        }

        .product-card {
            break-inside: avoid;
            background: var(--card-bg);
            border-radius: 16px;
            margin-bottom: 15px;
            overflow: hidden;
            border: 1px solid rgba(212, 175, 55, 0.2);
            position: relative;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            transition: transform 0.3s ease;
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .product-image-box {
            position: relative;
            width: 100%;
            cursor: pointer;
        }

        .product-image-box img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        /* Floating Interactive Bar on Product Image */
        .floating-product-actions {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            padding: 6px 14px;
            border-radius: 20px;
            gap: 15px;
            border: 1px solid rgba(212, 175, 55, 0.4);
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .action-item {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.75rem;
            color: var(--text-white);
            cursor: pointer;
        }

        .action-item i {
            font-size: 0.9rem;
        }

        .action-item.view-icon i {
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .action-item.like-icon i {
            color: var(--pink-heart);
            transition: color 0.3s ease, transform 0.2s;
        }

        .action-item.like-icon.active i {
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .action-item.share-icon i {
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Product Details Info */
        .product-info {
            padding: 12px;
        }

        .product-price {
            font-size: 1rem;
            font-weight: 700;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
        }

        .product-title {
            font-size: 0.85rem;
            color: var(--text-white);
            margin-bottom: 8px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .add-to-cart-btn {
            width: 100%;
            background: var(--gold-gradient);
            border: none;
            padding: 8px;
            border-radius: 8px;
            color: var(--bg-black);
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(212, 175, 55, 0.2);
            transition: opacity 0.2s;
        }

        .add-to-cart-btn:active {
            opacity: 0.8;
        }

        /* Bottom Navigation Bar */
        nav.bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #111111;
            border-top: 1px solid rgba(212, 175, 55, 0.3);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 10px 0;
            z-index: 1000;
            backdrop-filter: blur(15px);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: var(--text-gray);
            font-size: 0.75rem;
            font-weight: 500;
            transition: color 0.2s;
        }

        .nav-item i {
            font-size: 1.2rem;
            margin-bottom: 3px;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-item.active, .nav-item:hover {
            color: var(--gold-solid);
        }

        /* Popup Modal for Full Product View & Share Options */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: var(--card-bg);
            border: 2px solid var(--gold-solid);
            width: 90%;
            max-width: 400px;
            border-radius: 20px;
            padding: 20px;
            position: relative;
            animation: scaleUp 0.3s ease;
        }

        @keyframes scaleUp {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .close-modal {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            color: var(--text-white);
            font-size: 1.2rem;
            cursor: pointer;
        }

        .share-options-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .share-option-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(255,255,255,0.05);
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            border: 1px solid rgba(212, 175, 55, 0.2);
            color: var(--text-white);
            font-size: 0.75rem;
            gap: 6px;
        }

        .share-option-item i {
            font-size: 1.4rem;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body>

    <!-- Top Header with Logo and Brand Name -->
    <header>
        <div class="brand-container">
            <img src="mr masudar logo (25).jpg" alt="Logo" class="logo">
            <span class="brand-title">MR MASUDAR ENTERPRISE</span>
        </div>
        <div class="floating-cart" onclick="openCart()">
            <i class="fa-solid fa-cart-shopping"></i>
            <span class="cart-badge" id="cartCount">0</span>
        </div>
    </header>

    <!-- Search Bar Area -->
    <div class="search-section">
        <div class="search-bar-wrapper">
            <input type="text" id="searchInput" placeholder="Search luxury products...">
            <div class="search-actions">
                <i class="fa-solid fa-camera" onclick="triggerCamera()" title="Camera Search"></i>
                <i class="fa-solid fa-microphone" onclick="triggerVoiceSearch()" title="Voice Search"></i>
                <button class="search-btn-icon" onclick="performSearch()">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Pinterest Style Masonry Feed -->
    <main class="feed-container" id="productFeed">
        <!-- Products will be dynamically loaded here with Lazy Loading effect -->
    </main>

    <!-- Share Modal -->
    <div class="modal-overlay" id="shareModal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeShareModal()"><i class="fa-solid fa-xmark"></i></button>
            <h3 style="font-family: 'Cinzel', serif; color: var(--gold-solid); text-align: center; margin-bottom: 10px;">Share Luxury Item</h3>
            <p style="font-size: 0.8rem; color: var(--text-gray); text-align: center; margin-bottom: 15px;" id="shareItemName">Product Link</p>
            
            <div class="share-options-grid">
                <div class="share-option-item" onclick="shareToSocial('copy')">
                    <i class="fa-solid fa-link"></i>
                    <span>Copy Link</span>
                </div>
                <div class="share-option-item" onclick="shareToSocial('facebook')">
                    <i class="fa-brands fa-facebook"></i>
                    <span>Facebook</span>
                </div>
                <div class="share-option-item" onclick="shareToSocial('youtube')">
                    <i class="fa-brands fa-youtube"></i>
                    <span>YouTube</span>
                </div>
                <div class="share-option-item" onclick="shareToSocial('instagram')">
                    <i class="fa-brands fa-instagram"></i>
                    <span>Instagram</span>
                </div>
                <div class="share-option-item" onclick="shareToSocial('tiktok')">
                    <i class="fa-brands fa-tiktok"></i>
                    <span>TikTok</span>
                </div>
                <div class="share-option-item" onclick="shareToSocial('twitter')">
                    <i class="fa-brands fa-x-twitter"></i>
                    <span>X (Twitter)</span>
                </div>
                <div class="share-option-item" onclick="shareToSocial('linkedin')">
                    <i class="fa-brands fa-linkedin"></i>
                    <span>LinkedIn</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <a href="#" class="nav-item">
            <i class="fa-solid fa-chart-line"></i>
            <span>Seller</span>
        </a>
        <a href="#" class="nav-item">
            <i class="fa-solid fa-handshake"></i>
            <span>Earn</span>
        </a>
        <a href="#" class="nav-item active">
            <i class="fa-solid fa-clipboard-list"></i>
            <span>Item</span>
        </a>
        <a href="#" class="nav-item" onclick="focusSearch()">
            <i class="fa-solid fa-magnifying-glass"></i>
            <span>Search</span>
        </a>
    </nav>

    <!-- JavaScript for Dynamic Loading, Interactions, and Animations -->
    <script>
        // Sample Luxury Products Data mapped from provided links
        const products = [
            { id: 1, title: "Luxury Gold Crafted Designer Bracelet", price: "$125.00", image: "Bracelet,woman,Karuponno Craft,mr masudar,art (1).png", views: 420, likes: 135 },
            { id: 2, title: "Exquisite Royal Handcrafted Masterpiece", price: "$240.00", image: "Bracelet,woman,Karuponno Craft,mr masudar,art (1).png", views: 512, likes: 188 },
            { id: 3, title: "Signature Edition Premium Ornament", price: "$310.00", image: "Bracelet,woman,Karuponno Craft,mr masudar,art (1).png", views: 389, likes: 110 },
            { id: 4, title: "Imperial Gold Elite Collection Item", price: "$180.00", image: "Bracelet,woman,Karuponno Craft,mr masudar,art (1).png", views: 605, likes: 210 },
            { id: 5, title: "Classic Artisan Luxury Artifact", price: "$95.00", image: "Bracelet,woman,Karuponno Craft,mr masudar,art (1).png", views: 470, likes: 155 },
            { id: 6, title: "Prestige Golden Finish Special Craft", price: "$450.00", image: "Bracelet,woman,Karuponno Craft,mr masudar,art (1).png", views: 720, likes: 304 }
        ];

        let cartCount = 0;
        let currentShareUrl = '';

        // Load Products into Pinterest Masonry Grid
        function loadProducts() {
            const feed = document.getElementById('productFeed');
            feed.innerHTML = "";

            products.forEach(item => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div class="product-image-box">
                        <img src="${item.image}" alt="${item.title}" loading="lazy">
                        <div class="floating-product-actions">
                            <div class="action-item view-icon">
                                <i class="fa-solid fa-eye"></i> <span>${item.views}</span>
                            </div>
                            <div class="action-item like-icon" onclick="toggleLike(this, ${item.id})">
                                <i class="fa-solid fa-heart"></i> <span id="like-count-${item.id}">${item.likes}</span>
                            </div>
                            <div class="action-item share-icon" onclick="openShareModal('${item.title}', ${item.id})">
                                <i class="fa-solid fa-share-nodes"></i>
                            </div>
                        </div>
                    </div>
                    <div class="product-info">
                        <div class="product-price">${item.price}</div>
                        <div class="product-title">${item.title}</div>
                        <button class="add-to-cart-btn" onclick="addToCart(event)">Add To Cart</button>
                    </div>
                `;
                feed.appendChild(card);
            });
        }

        // Like Button Interaction (Pink to Golden/Gold Gradient effect)
        function toggleLike(element, id) {
            element.classList.toggle('active');
            const countSpan = document.getElementById(`like-count-${id}`);
            let currentLikes = parseInt(countSpan.innerText);
            if(element.classList.contains('active')) {
                countSpan.innerText = currentLikes + 1;
            } else {
                countSpan.innerText = currentLikes - 1;
            }
        }

        // Add to Cart with Coin/Cart Animation & Sound effect simulation
        function addToCart(event) {
            cartCount++;
            document.getElementById('cartCount').innerText = cartCount;
            
            // Subtle Luxury Sound Effect (Audio feedback simulation)
            try {
                let audio = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
                audio.volume = 0.3;
                audio.play();
            } catch(e) {}

            // Visual pulse animation on cart
            const cartIcon = document.querySelector('.floating-cart');
            cartIcon.style.transform = 'scale(1.2)';
            setTimeout(() => {
                cartIcon.style.transform = 'scale(1)';
            }, 200);
        }

        // Open Share Modal
        function openShareModal(title, id) {
            currentShareUrl = `https://yourdomain.com/product.html?id=${id}&ref=aff_masud`;
            document.getElementById('shareItemName').innerText = title;
            document.getElementById('shareModal').style.display = 'flex';
        }

        function closeShareModal() {
            document.getElementById('shareModal').style.display = 'none';
        }

        // Share functionality
        function shareToSocial(platform) {
            if(platform === 'copy') {
                navigator.clipboard.writeText(currentShareUrl);
                alert("Affiliate Short Link Copied Successfully!");
            } else {
                let shareWindowUrl = "";
                if(platform === 'facebook') shareWindowUrl = `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(currentShareUrl)}`;
                if(platform === 'twitter') shareWindowUrl = `https://twitter.com/intent/tweet?url=${encodeURIComponent(currentShareUrl)}`;
                if(platform === 'linkedin') shareWindowUrl = `https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(currentShareUrl)}`;
                
                if(shareWindowUrl) {
                    window.open(shareWindowUrl, '_blank');
                } else {
                    alert("Link ready to share on " + platform);
                }
            }
            closeShareModal();
        }

        // Camera & Voice Search Mock Triggers
        function triggerCamera() {
            alert("Camera Image Search activated. Uploading/Capturing image for visual matching...");
        }

        function triggerVoiceSearch() {
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                const recognition = new SpeechRecognition();
                recognition.lang = 'bn-BD';
                recognition.onstart = function() {
                    document.getElementById('searchInput').placeholder = "Listening...";
                };
                recognition.onresult = function(event) {
                    const speechToText = event.results[0][0].transcript;
                    document.getElementById('searchInput').value = speechToText;
                    document.getElementById('searchInput').placeholder = "Search luxury products...";
                };
                recognition.start();
            } else {
                alert("Voice search is ready. Speak now to search.");
            }
        }

        function focusSearch() {
            document.getElementById('searchInput').focus();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function performSearch() {
            const query = document.getElementById('searchInput').value;
            if(query.trim() !== "") {
                alert("Searching for: " + query);
            }
        }

        function openCart() {
            if(cartCount === 0) {
                alert("Your shopping cart is empty. Please add items.");
            } else {
                alert("Proceeding to checkout with " + cartCount + " items.");
            }
        }

        // Initial Load
        window.onload = function() {
            loadProducts();
        };
    </script>
</body>
</html>

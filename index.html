<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RORRAXY - LUXURY ENTERPRISE</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1s34xHuxCBJ7fyKLgb8mvUdHGp7GF_uuT">
    <!-- Google Font: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-black: #000000;
            --card-bg: #111111;
            --gold-gradient: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            --gold-solid: #d4af37;
            --text-white: #ffffff;
            --text-gray: #b0b0b0;
            --font-main: 'Poppins', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { width: 100%; max-width: 100%; overflow-x: hidden; background-color: var(--bg-black); color: var(--text-white); font-family: var(--font-main); }
        body { padding-top: 75px; padding-bottom: 90px; }

        /* লাক্সারি হেডার (বাম কোণায় লোগো ও ব্র্যান্ড নাম, ডানপাশে ৩টি পোর্টাল) */
        header.app-header {
            display: flex; justify-content: space-between; align-items: center; padding: 8px 12px;
            background: rgba(0, 0, 0, 0.98); position: fixed; top: 0; left: 0; z-index: 1000;
            backdrop-filter: blur(15px); width: 100%; border-bottom: 1.5px solid rgba(212, 175, 55, 0.3);
        }
        .header-left-box { display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .logo { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; border: 1.5px solid var(--gold-solid); background: #000; }
        .brand-text-box { display: flex; flex-direction: column; }
        .brand-title-main { font-size: 1rem; font-weight: 900; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; letter-spacing: 1px; line-height: 1.1; }
        .brand-new-coll { font-size: 0.42rem; font-weight: 700; color: var(--text-gray); text-transform: uppercase; letter-spacing: 0.5px; }

        /* ডানদিকের ৩টি পোর্টাল */
        .header-portals-box { display: flex; align-items: center; gap: 6px; }
        .portal-btn {
            font-size: 0.42rem; font-weight: 700; background: #181818; border: 1px solid rgba(212,175,55,0.4);
            color: var(--text-white); padding: 4px 6px; border-radius: 4px; text-transform: uppercase; cursor: pointer;
            transition: 0.2s; white-space: nowrap;
        }
        .portal-btn:hover { border-color: var(--gold-solid); background: var(--gold-gradient); color: #000; }

        /* Pinterest Style Masonry Feed (ইটের গাঁথুনির মতো স্লাইড বা কার্ড) */
        .feed-container {
            padding: 10px 8px;
            column-count: 2; /* মোবাইলে ঠিক দুটি কলাম */
            column-gap: 8px;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
        }
        @media (min-width: 768px) {
            .feed-container { column-count: 3; padding: 15px; column-gap: 12px; }
        }
        @media (min-width: 1024px) {
            .feed-container { column-count: 4; column-gap: 15px; }
        }

        .product-card {
            break-inside: avoid;
            background: var(--card-bg);
            border-radius: 12px;
            margin-bottom: 8px;
            overflow: hidden;
            border: 1px solid rgba(212, 175, 55, 0.25);
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            transition: 0.3s;
        }
        .product-card:hover { border-color: var(--gold-solid); transform: translateY(-2px); }
        .product-media-box { position: relative; width: 100%; cursor: pointer; background: #000; overflow: hidden; }
        .product-media-box img { width: 100%; height: auto; display: block; object-fit: cover; }
        
        .product-info { padding: 8px; display: flex; flex-direction: column; gap: 3px; }
        .product-title { font-size: 0.68rem; font-weight: 800; color: var(--text-white); text-transform: uppercase; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .product-price { font-size: 0.78rem; font-weight: 900; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* নতুন ৫টি মেনু সম্বলিত বটম ন্যাভবার */
        nav.bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(0, 0, 0, 0.98);
            display: flex; justify-content: space-around; align-items: center; padding: 8px 4px;
            z-index: 1000; border-top: 1.5px solid rgba(212, 175, 55, 0.4); backdrop-filter: blur(15px);
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; text-decoration: none;
            color: var(--text-gray); font-size: 0.5rem; font-weight: 600; cursor: pointer; text-align: center; gap: 3px; flex: 1;
            transition: 0.3s;
        }
        .nav-item i { font-size: 1.2rem; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .nav-item.active, .nav-item:hover, .nav-item:active { color: var(--gold-solid); transform: translateY(-2px); }
        .nav-item span { text-transform: uppercase; letter-spacing: 0.4px; }
    </style>
</head>
<body>

    <!-- লাক্সারি হেডার -->
    <header class="app-header">
        <div class="header-left-box" onclick="location.href='https://rorraxy.com'">
            <img src="https://lh3.googleusercontent.com/d/1s34xHuxCBJ7fyKLgb8mvUdHGp7GF_uuT" alt="Rorraxy Logo" class="logo">
            <div class="brand-text-box">
                <span class="brand-title-main">RORRAXY</span>
                <span class="brand-new-coll">NEW COLLECTION</span>
            </div>
        </div>
        <div class="header-portals-box">
            <button class="portal-btn" onclick="location.href='https://b2b.rorraxy.com'">B2B Partner</button>
            <button class="portal-btn" onclick="location.href='https://solutions.rorraxy.com'">Solution</button>
            <button class="portal-btn" onclick="location.href='https://academy.rorraxy.com'">Academy</button>
        </div>
    </header>

    <!-- Pinterest স্টাইলে নতুন কালেকশন প্রোডাক্ট ফিড (Masonry Grid) -->
    <main class="feed-container" id="productFeed">
        <div class="product-card">
            <div class="product-media-box">
                <img src="https://lh3.googleusercontent.com/d/18yy4G5Nd4OUf5a1T4mKHhvUFTq_6Eds5" alt="Product">
            </div>
            <div class="product-info">
                <span class="product-title">LUXURY GOLDEN EMBROIDERED SILK GOWN</span>
                <span class="product-price">$185.00</span>
            </div>
        </div>
        <div class="product-card">
            <div class="product-media-box">
                <img src="https://lh3.googleusercontent.com/d/1POhz8vb-MocaPNHg-i6nDSKwV4ky16Lc" alt="Product">
            </div>
            <div class="product-info">
                <span class="product-title">PREMIUM GAMAR WOOD LUXURY DECOR</span>
                <span class="product-price">$120.00</span>
            </div>
        </div>
        <div class="product-card">
            <div class="product-media-box">
                <img src="https://lh3.googleusercontent.com/d/18yy4G5Nd4OUf5a1T4mKHhvUFTq_6Eds5" alt="Product">
            </div>
            <div class="product-info">
                <span class="product-title">ROYAL DESIGNER VELVET BLAZER</span>
                <span class="product-price">$210.00</span>
            </div>
        </div>
        <div class="product-card">
            <div class="product-media-box">
                <img src="https://lh3.googleusercontent.com/d/1POhz8vb-MocaPNHg-i6nDSKwV4ky16Lc" alt="Product">
            </div>
            <div class="product-info">
                <span class="product-title">EXECUTIVE HANDCRAFTED LEATHER BAG</span>
                <span class="product-price">$95.00</span>
            </div>
        </div>
    </main>

    <!-- নতুন ৫টি মেনু সম্বলিত বটম ন্যাভবার -->
    <nav class="bottom-nav">
        <!-- ১. লাইভ চ্যাট -->
        <div class="nav-item" onclick="openLiveChat()">
            <i class="fa-solid fa-headset"></i>
            <span>Live Chat</span>
        </div>
        <!-- ২. ক্যাটাগরি -->
        <div class="nav-item" onclick="openCategories()">
            <i class="fa-solid fa-border-all"></i>
            <span>Category</span>
        </div>
        <!-- ৩. একাউন্ট -->
        <div class="nav-item" onclick="navigateToSubdomain('account')">
            <i class="fa-solid fa-user-shield"></i>
            <span>Account</span>
        </div>
        <!-- ৪. সেলার -->
        <div class="nav-item" onclick="navigateToSubdomain('seller')">
            <i class="fa-solid fa-chart-line"></i>
            <span>Seller</span>
        </div>
        <!-- ৫. এফিলিয়েট -->
        <div class="nav-item" onclick="navigateToSubdomain('affiliate')">
            <i class="fa-solid fa-handshake"></i>
            <span>Affiliate</span>
        </div>
    </nav>

    <script>
        function navigateToSubdomain(sub) {
            const domain = "rorraxy.com";
            window.location.href = `https://${sub}.${domain}`;
        }
        function openLiveChat() {
            alert("Live Chat support is connecting...");
        }
        function openCategories() {
            alert("Opening Categories modal or page...");
        }
    </script>
</body>
</html>

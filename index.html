<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MR MASUDAR ENTERPRISE | Ultimate Global Ecosystem</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #070707;
            color: #ffffff;
            padding-bottom: 90px;
            overflow-x: hidden;
        }

        /* 🌟 Futuristic Luxury Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            background: rgba(12, 12, 12, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-area img {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #d4af37;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
            animation: pulseGlow 3s infinite alternate;
        }

        .logo-title {
            font-size: 15px;
            font-weight: 700;
            background: linear-gradient(135deg, #fff 30%, #d4af37 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.8px;
        }

        .global-badge {
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid rgba(212, 175, 55, 0.3);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            color: #d4af37;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
        }

        /* 🌟 Luxury Glass Search Bar with Animation */
        .search-container {
            padding: 15px 20px;
            background: rgba(10, 10, 10, 0.7);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 71px;
            z-index: 999;
        }

        .glass-search-bar {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(212, 175, 55, 0.35);
            border-radius: 35px;
            padding: 12px 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), inset 0 0 15px rgba(255, 255, 255, 0.02);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            animation: borderGlow 4s infinite alternate;
        }

        .glass-search-bar:focus-within {
            border-color: #d4af37;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.4), inset 0 0 10px rgba(212, 175, 55, 0.1);
            transform: scale(1.01);
        }

        .glass-search-bar i.search-icon {
            color: #d4af37;
            font-size: 16px;
            margin-right: 12px;
        }

        .glass-search-bar input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 14px;
        }

        .glass-search-bar input::placeholder {
            color: #888;
        }

        .search-actions {
            display: flex;
            gap: 15px;
            color: #d4af37;
            font-size: 17px;
            cursor: pointer;
        }

        .search-actions i {
            transition: transform 0.3s, color 0.3s;
        }

        .search-actions i:hover {
            color: #ff8c00;
            transform: scale(1.2);
        }

        /* 🌟 Product Feed Grid (Floating 3D Cards) */
        .feed-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            padding: 15px;
        }

        @media (min-width: 768px) {
            .feed-container {
                grid-template-columns: repeat(4, 1fr);
                gap: 20px;
                padding: 20px;
            }
        }

        .product-card {
            background: #111111;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8), 0 0 1px rgba(212, 175, 55, 0.2);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            animation: cardAppear 0.6s ease-out backwards;
        }

        .product-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.9), 0 0 20px rgba(212, 175, 55, 0.25);
        }

        .product-img-wrapper {
            position: relative;
            width: 100%;
            height: 210px;
            background: #000;
            overflow: hidden;
        }

        .product-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .product-card:hover .product-img-wrapper img {
            transform: scale(1.08);
        }

        /* Watermark / Corner Badge */
        .corner-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(212, 175, 55, 0.4);
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: 700;
            color: #d4af37;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            z-index: 2;
        }

        .product-info {
            padding: 12px 14px;
        }

        .product-code {
            font-size: 13px;
            font-weight: 600;
            color: #d4af37;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .card-footer-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #aaa;
        }

        .action-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: transform 0.2s, color 0.3s;
        }

        .action-btn:active {
            transform: scale(0.85);
        }

        /* Like Button: Default Orange ⇄ Click Golden with Glow */
        .like-btn {
            color: #ff8c00; 
        }
        .like-btn.liked {
            color: #d4af37;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.8);
        }

        /* Share Button: Default Golden ⇄ Click Orange with Glow */
        .share-btn {
            color: #d4af37;
        }
        .share-btn.shared {
            color: #ff8c00;
            text-shadow: 0 0 10px rgba(255, 140, 0, 0.8);
        }

        .view-count {
            font-size: 11px;
            color: #888;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* 🌟 Luxury Sticky Bottom Navigation (Black & Golden with Glow) */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background: rgba(10, 10, 10, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(212, 175, 55, 0.25);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.9);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #ffffff;
            font-size: 10px;
            font-weight: 500;
            transition: all 0.3s ease;
            position: relative;
        }

        .nav-item i {
            font-size: 20px;
            color: #d4af37;
            margin-bottom: 4px;
            filter: drop-shadow(0 0 5px rgba(212, 175, 55, 0.4));
            transition: transform 0.3s;
        }

        .nav-item span {
            color: #ffffff;
            letter-spacing: 0.3px;
        }

        .nav-item:hover i, .nav-item:active i {
            transform: translateY(-3px) scale(1.15);
            color: #ff8c00;
            filter: drop-shadow(0 0 8px rgba(255, 140, 0, 0.6));
        }

        /* 🌟 Advanced Keyframe Animations */
        @keyframes pulseGlow {
            0% { box-shadow: 0 0 10px rgba(212, 175, 55, 0.3); }
            100% { box-shadow: 0 0 22px rgba(212, 175, 55, 0.7); }
        }

        @keyframes borderGlow {
            0% { border-color: rgba(212, 175, 55, 0.2); }
            100% { border-color: rgba(212, 175, 55, 0.6); }
        }

        @keyframes cardAppear {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <header class="header">
        <div class="logo-area">
            <!-- আপনার গুগল ড্রাইভ ফোল্ডারের লোগো বা ইমেজের ডিরেক্ট লিংক এখানে বসবে -->
            <img src="https://lh3.googleusercontent.com/d/1iph42wSVX9xNglnVKSKTXicbInSJ3y4j=s400" alt="Brand Logo" id="brandLogo">
            <span class="logo-title">MR MASUDAR ENTERPRISE</span>
        </div>
        <div class="global-badge">
            <i class="fa-solid fa-globe"></i> 237+
        </div>
    </header>

    <!-- Luxury Glass Search Bar -->
    <div class="search-container">
        <div class="glass-search-bar" onclick="focusSearchInput()">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input type="text" id="mainSearchInput" placeholder="Search products, digital services or items...">
            <div class="search-actions">
                <i class="fa-solid fa-camera" title="Image Search" onclick="event.stopPropagation(); triggerCameraSearch();"></i>
                <i class="fa-solid fa-microphone" title="Voice Search" onclick="event.stopPropagation(); triggerVoiceSearch();"></i>
            </div>
        </div>
    </div>

    <!-- Product Feed Grid (Dynamic & Randomized with Your Drive Images) -->
    <main class="feed-container" id="productFeed">
        <!-- JavaScript will dynamically render cards -->
    </main>

    <!-- Luxury Sticky Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <i class="fa-solid fa-house"></i>
            <span>HOME</span>
        </a>
        <a href="etech.html" class="nav-item">
            <i class="fa-solid fa-bolt"></i>
            <span>E-TECH</span>
        </a>
        <a href="seller.html" class="nav-item">
            <i class="fa-solid fa-bag-shopping"></i>
            <span>SELLER</span>
        </a>
        <a href="earn.html" class="nav-item">
            <i class="fa-solid fa-handshake"></i>
            <span>EARN</span>
        </a>
        <a href="item.html" class="nav-item">
            <i class="fa-solid fa-basket-shopping"></i>
            <span>ITEM</span>
        </a>
    </nav>

    <script>
        function focusSearchInput() {
            const input = document.getElementById('mainSearchInput');
            input.focus();
        }

        function triggerCameraSearch() {
            alert('System: Opening AI Camera Scanner & Image Search...');
        }

        function triggerVoiceSearch() {
            alert('System: Voice Recognition activated, speak now...');
        }

        // আপনার ড্রাইভ ফোল্ডারের প্রোডাক্ট ইমেজগুলোর ডিরেক্ট সোর্স লিস্ট
        const driveProductImages = [
            'https://lh3.googleusercontent.com/d/1k0XXn9tBtH42S26sC2sAEQow-jZKvFuf=s800',
            'https://lh3.googleusercontent.com/d/1A90qVOYpq8gBVcahDQlQ9-DuB_60og6C=s800',
            'https://lh3.googleusercontent.com/d/1N4lXfL2RIjolz0sVcazAc2BzMpO70M3c=s800',
            'https://lh3.googleusercontent.com/d/13UmE17PJ1F-Xl4D54Q-rKXeXg5RjwJ3A=s800'
        ];

        // র্যান্ডম ভিউ জেনারেটর (ন্যাচারাল ও নন-ইউনিফর্ম বৈচিত্র্যের জন্য)
        function generateRandomViews() {
            const viewsOptions = [850, 4500, 12500, 32000, 52000, 1150, 87500, 2400, 15000, 38000];
            return viewsOptions[Math.floor(Math.random() * viewsOptions.length)];
        }

        // ডাইনামিক প্রোডাক্ট ফিড রেন্ডারিং (প্রথম ২০টি প্রোডাক্ট)
        const feedContainer = document.getElementById('productFeed');
        
        for(let i = 1; i <= 20; i++) {
            let randomImg = driveProductImages[(i - 1) % driveProductImages.length];
            let randomViews = generateRandomViews();
            let randomLikes = Math.floor(Math.random() * 600) + 50;

            let card = document.createElement('div');
            card.className = 'product-card';
            card.style.animationDelay = `${i * 0.05}s`;
            card.innerHTML = `
                <div class="product-img-wrapper">
                    <div class="corner-badge">MR MR</div>
                    <img src="${randomImg}" alt="Luxury Product">
                </div>
                <div class="product-info">
                    <div class="product-code">VEIW ${50000 + (i * 7)}K</div>
                    <div class="card-footer-actions">
                        <button class="action-btn like-btn" onclick="toggleLike(this)">
                            <i class="fa-solid fa-heart"></i> <span class="like-count">${randomLikes}</span>
                        </button>
                        <button class="action-btn share-btn" onclick="toggleShare(this)">
                            <i class="fa-solid fa-share-nodes"></i>
                        </button>
                        <span class="view-count"><i class="fa-solid fa-eye"></i> ${randomViews}</span>
                    </div>
                </div>
            `;
            feedContainer.appendChild(card);
        }

        // লাইক টগল ফাংশন (কমলা ⇄ গোল্ডেন উইথ গ্লো অ্যানিমেশন)
        function toggleLike(btn) {
            let countSpan = btn.querySelector('.like-count');
            let currentLikes = parseInt(countSpan.innerText);

            if (!btn.classList.contains('liked')) {
                btn.classList.add('liked');
                countSpan.innerText = currentLikes + 1;
            } else {
                btn.classList.remove('liked');
                countSpan.innerText = currentLikes - 1;
            }
        }

        // শেয়ার বাটন টগল ফাংশন (গোল্ডেন ⇄ কমলা উইথ গ্লো অ্যানিমেশন)
        function toggleShare(btn) {
            if (!btn.classList.contains('shared')) {
                btn.classList.add('shared');
                alert('Short link successfully generated & Social share popup opened!');
            } else {
                btn.classList.remove('shared');
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MR MASUDAR ENTERPRISE | B2B Wholesale Marketplace</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #000000;
            --surface-card: #0a0a0a;
            --gold-primary: #D4AF37;
            --gold-light: #F3E5AB;
            --gold-gradient: linear-gradient(135deg, #BF953F, #FCF6BA, #B38728, #FBF5B7, #AA771C);
            --border-luxury: rgba(212, 175, 55, 0.4);
            --text-white: #ffffff;
            --text-gray: #aaaaaa;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-white);
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 10px;
            overflow-x: hidden;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        /* Admin Lock */
        .lock-btn-fixed { position: fixed; bottom: 3px; left: 3px; color: var(--gold-primary); font-size: 8px; cursor: pointer; z-index: 99999; opacity: 0.08; transition: 0.3s; padding: 4px; }
        .lock-btn-fixed:hover { opacity: 1; transform: scale(1.5); }

        /* Top Header & Search Bar */
        .market-header {
            text-align: center;
            padding: 15px;
            border: 1px solid var(--border-luxury);
            border-radius: 16px;
            background: var(--surface-card);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.15);
            max-width: 1200px;
            margin: 0 auto 12px auto;
        }
        .market-header h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 20px;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 4px 0;
            letter-spacing: 1px;
        }

        .search-bar-container {
            display: flex;
            align-items: center;
            background: #000;
            border: 1px solid var(--gold-primary);
            border-radius: 30px;
            max-width: 500px;
            margin: 10px auto 0 auto;
            padding: 5px 12px;
        }
        .search-bar-container input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 11px;
            outline: none;
            padding: 5px;
        }
        .search-icon-btn {
            background: transparent;
            border: none;
            color: var(--gold-primary);
            font-size: 13px;
            cursor: pointer;
            padding: 0 6px;
        }

        /* Auto-Sliding Luxury Categories Menu */
        .category-menu-wrap {
            max-width: 1200px;
            margin: 0 auto 15px auto;
            overflow: hidden;
            position: relative;
            padding: 5px 0;
        }
        .category-menu {
            display: flex;
            gap: 10px;
            width: max-content;
            animation: autoScrollCat 25s linear infinite;
        }
        .category-menu:hover { animation-play-state: paused; }
        @keyframes autoScrollCat {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        .cat-chip {
            background: var(--surface-card);
            border: 1px solid var(--border-luxury);
            color: var(--gold-light);
            padding: 7px 16px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.2s;
            flex-shrink: 0;
        }
        .cat-chip:hover, .cat-chip.active {
            background: var(--gold-gradient);
            color: #000;
            border-color: #fff;
        }

        /* Draggable & Floating Luxury Basket */
        .floating-basket {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--gold-gradient);
            color: #000;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.8);
            cursor: grab;
            z-index: 9999;
            user-select: none;
            touch-action: none;
            animation: basketFloatEffect 3s ease-in-out infinite;
            transition: transform 0.2s ease;
        }
        @keyframes basketFloatEffect {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-6px) scale(1.05); }
        }
        .floating-basket:active { cursor: grabbing; animation: none; }
        
        .basket-center-focus {
            position: fixed !important;
            top: 50% !important;
            left: 50% !important;
            transform: translate(-50%, -50%) scale(1.6) !important;
            box-shadow: 0 0 60px #fff, 0 0 40px var(--gold-primary) !important;
            z-index: 99999 !important;
            animation: none !important;
        }

        .basket-count {
            position: absolute;
            top: -3px;
            right: -3px;
            background: #fff;
            color: #000;
            font-size: 10px;
            font-weight: 800;
            padding: 2px 5px;
            border-radius: 50%;
            border: 2px solid #000;
        }

        /* Product Grid */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .product-card {
            background: var(--surface-card);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: 0.2s;
        }
        .product-card:hover { border-color: var(--gold-primary); transform: translateY(-2px); }
        .product-img-box {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .product-img-box img { width: 100%; height: 100%; object-fit: contain; }
        .product-info { padding: 8px; text-align: center; }
        .product-title { font-size: 10px; font-weight: 700; color: #fff; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
        .stars { color: var(--gold-primary); font-size: 8px; margin-bottom: 4px; }
        .card-actions { display: flex; border-top: 1px solid #222; }
        .card-btn { flex: 1; background: transparent; border: none; padding: 8px; color: var(--gold-primary); font-size: 10px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .card-btn:hover { background: rgba(212, 175, 55, 0.15); }

        /* Wholesale Tier Options inside Modal (High Contrast & Clear Visibility) */
        .wholesale-tier-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin: 10px 0;
        }
        .tier-btn {
            background: #111;
            border: 1px solid var(--border-luxury);
            color: var(--gold-light);
            padding: 8px 4px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            transition: 0.2s;
        }
        .tier-btn div { color: #fff; }
        .tier-btn span { color: var(--gold-primary); font-size: 9px; }
        .tier-btn:hover, .tier-btn.selected {
            background: var(--gold-gradient);
            color: #000;
            border-color: #fff;
        }
        .tier-btn:hover div, .tier-btn.selected div,
        .tier-btn:hover span, .tier-btn.selected span {
            color: #000 !important;
            font-weight: 900;
        }

        /* Modal Details & Checkout */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(10px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            padding: 10px;
            box-sizing: border-box;
            overflow-y: auto;
        }
        .modal-content {
            background: var(--surface-card);
            border: 2px solid var(--gold-primary);
            border-radius: 18px;
            max-width: 800px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 20px;
            position: relative;
            box-sizing: border-box;
        }
        .close-modal {
            position: absolute;
            top: 12px; right: 12px;
            background: transparent;
            border: 1px solid var(--gold-primary);
            color: var(--gold-primary);
            width: 28px; height: 28px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 11px;
            display: flex; align-items: center; justify-content: center;
        }

        .apply-btn {
            background: var(--gold-gradient);
            border: none;
            padding: 10px 20px;
            font-weight: 800;
            text-transform: uppercase;
            border-radius: 20px;
            cursor: pointer;
            color: #000;
            width: 100%;
            max-width: 280px;
            display: block;
            margin: 15px auto 0 auto;
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(212,175,55,0.3);
            font-size: 11px;
        }

        .grand-total-box {
            background: rgba(212, 175, 55, 0.12);
            border: 2px solid var(--gold-primary);
            border-radius: 14px;
            padding: 15px;
            text-align: center;
            margin: 15px 0;
            box-shadow: 0 0 20px rgba(212,175,55,0.2);
        }
        .grand-total-price {
            font-size: 24px;
            font-weight: 900;
            color: var(--gold-primary);
            margin: 4px 0;
        }

        .details-stack { display: flex; flex-direction: column; gap: 12px; }
        .large-preview-wrap { background: #000; border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; aspect-ratio: 1/1; width: 100%; max-height: 220px; display: flex; align-items: center; justify-content: center; overflow: hidden; margin: 0 auto; }
        .large-preview-wrap img { width: 100%; height: 100%; object-fit: contain; }
        .thumb-gallery { display: flex; gap: 6px; margin-top: 8px; overflow-x: auto; padding-bottom: 4px; }
        .thumb-img { width: 45px; height: 45px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.3); object-fit: cover; cursor: pointer; background: #000; flex-shrink: 0; }
        
        .qty-box { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 8px 0; }
        .qty-btn { background: #222; border: 1px solid var(--gold-primary); color: #fff; width: 26px; height: 26px; border-radius: 50%; cursor: pointer; font-weight: bold; }

        .cart-item-row { display: flex; justify-content: space-between; align-items: center; background: #000; border: 1px solid #333; padding: 8px 12px; border-radius: 8px; margin-bottom: 8px; font-size: 11px; }
        .cart-remove-btn { color: #ff4d4d; cursor: pointer; font-size: 13px; background: none; border: none; }

        /* Large Luxury Coin Animation */
        .flying-coin {
            position: fixed;
            width: 45px;
            height: 45px;
            background: var(--gold-gradient);
            border: 3px solid #fff;
            border-radius: 50%;
            z-index: 99999;
            pointer-events: none;
            box-shadow: 0 0 25px var(--gold-primary);
            transition: all 0.6s cubic-bezier(0.15, 0.85, 0.25, 1);
        }

        .form-group-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; text-align: left; }
        .form-full { grid-column: span 2; }
        .input-box { width: 100%; background: #000; border: 1px solid #333; padding: 10px; color: #fff; border-radius: 8px; margin-top: 3px; font-size: 11px; box-sizing: border-box; outline: none; }
        .input-box:focus { border-color: var(--gold-primary); }

        .admin-table { width: 100%; border-collapse: collapse; font-size: 10px; margin-top: 10px; }
        .admin-table th, .admin-table td { border: 1px solid #333; padding: 8px; text-align: left; }
        .admin-table th { background: rgba(212,175,55,0.2); color: var(--gold-primary); }

        @media(max-width: 768px) {
            .product-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .market-header h1 { font-size: 16px; }
            .form-group-grid { grid-template-columns: 1fr; }
            .form-full { grid-column: span 1; }
        }
    </style>
</head>
<body>

    <!-- Admin Lock (Password: mrbtrmlc) -->
    <div class="lock-btn-fixed" onclick="openAdminModal()"><i class="fa-solid fa-lock"></i></div>

    <!-- Floating Basket -->
    <div class="floating-basket" id="floatingBasket" title="Checkout">
        <i class="fa-solid fa-basket-shopping"></i>
        <span class="basket-count" id="cartBadge">0</span>
    </div>

    <!-- Header & Search Bar -->
    <div class="market-header">
        <h1>MR MASUDAR ENTERPRISE</h1>
        <p style="color: var(--text-gray); font-size: 7px; letter-spacing: 1px; text-transform: uppercase; margin: 0;">B2B Wholesale Global Marketplace</p>
        
        <div class="search-bar-container">
            <i class="fa-solid fa-magnifying-glass" style="color:var(--gold-primary); margin-left: 4px;"></i>
            <input type="text" id="searchInput" placeholder="Search wholesale products..." onkeyup="filterProducts()">
            <button class="search-icon-btn" onclick="startVoiceSearch()"><i class="fa-solid fa-microphone"></i></button>
            <button class="search-icon-btn" onclick="triggerImageSearch()"><i class="fa-solid fa-camera"></i></button>
            <input type="file" id="imageUploadInput" accept="image/*" style="display:none;" onchange="handleImageUpload(event)">
        </div>
    </div>

    <!-- Auto-Sliding Luxury Categories Menu -->
    <div class="category-menu-wrap">
        <div class="category-menu" id="catMenu">
            <div class="cat-chip" onclick="filterCategory('Women\'s Fashion', this)">👗 Women's Fashion</div>
            <div class="cat-chip" onclick="filterCategory('Men\'s Fashion', this)">👔 Men's Fashion</div>
            <div class="cat-chip" onclick="filterCategory('Baby', this)">🍼 Baby</div>
            <div class="cat-chip" onclick="filterCategory('Gift', this)">🎁 Gift</div>
            <div class="cat-chip" onclick="filterCategory('Decor', this)">🏺 Decor</div>
            <div class="cat-chip" onclick="filterCategory('Women\'s Fashion', this)">👗 Women's Fashion</div>
            <div class="cat-chip" onclick="filterCategory('Men\'s Fashion', this)">👔 Men's Fashion</div>
            <div class="cat-chip" onclick="filterCategory('Baby', this)">🍼 Baby</div>
            <div class="cat-chip" onclick="filterCategory('Gift', this)">🎁 Gift</div>
            <div class="cat-chip" onclick="filterCategory('Decor', this)">🏺 Decor</div>
        </div>
    </div>

    <!-- Product Grid -->
    <div class="product-grid" id="marketProductGrid"></div>

    <!-- Modal -->
    <div class="modal-overlay" id="productModal">
        <div class="modal-content" id="modalBody"></div>
    </div>

    <script>
        let detectedCountry = "United States";
        let detectedCity = "New York";
        let detectedPhoneCode = "+1";
        let autoShippingRate = 50;

        async function detectGlobalLocation() {
            try {
                let res = await fetch('https://ipapi.co/json/');
                let data = await res.json();
                if(data && data.country_name) {
                    detectedCountry = data.country_name;
                    detectedCity = data.city || "Wholesale Hub";
                    detectedPhoneCode = data.country_calling_code || "+1";
                    
                    if(data.country_name === "Bangladesh") autoShippingRate = 15;
                    else if(data.continent_code === 'AS') autoShippingRate = 35;
                    else if(data.continent_code === 'EU' || data.continent_code === 'NA') autoShippingRate = 50;
                    else autoShippingRate = 70;
                }
            } catch(e) {
                detectedCountry = "United States";
                detectedCity = "New York";
                detectedPhoneCode = "+1";
                autoShippingRate = 50;
            }
        }

        let idleTimer;
        function resetIdleTimer() {
            clearTimeout(idleTimer);
            idleTimer = setTimeout(() => {
                localStorage.removeItem('mme_b2b_cart');
                location.reload();
            }, 300000);
        }

        window.onload = async () => {
            await detectGlobalLocation();
            loadMarketProducts("Women's Fashion");
            resetIdleTimer();
            updateCartBadgeCount();
        };
        document.onmousemove = resetIdleTimer;
        document.onkeypress = resetIdleTimer;

        function updateCartBadgeCount() {
            let cart = JSON.parse(localStorage.getItem('mme_b2b_cart') || '[]');
            let totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
            document.getElementById('cartBadge').innerText = totalQty;
        }

        const basket = document.getElementById('floatingBasket');
        let isDragging = false, startX, startY, initialX, initialY;

        basket.addEventListener('mousedown', dragStart);
        basket.addEventListener('touchstart', dragStart, {passive: true});
        document.addEventListener('mousemove', drag);
        document.addEventListener('touchmove', drag, {passive: true});
        document.addEventListener('mouseup', dragEnd);
        document.addEventListener('touchend', dragEnd);

        function dragStart(e) {
            isDragging = true;
            startX = e.clientX || e.touches[0].clientX;
            startY = e.clientY || e.touches[0].clientY;
            let r = basket.getBoundingClientRect();
            initialX = r.left;
            initialY = r.top;
            basket.style.right = 'auto';
            basket.style.top = initialY + 'px';
            basket.style.left = initialX + 'px';
        }

        function drag(e) {
            if(!isDragging) return;
            let currentX = e.clientX || e.touches[0].clientX;
            let currentY = e.clientY || e.touches[0].clientY;
            basket.style.left = (initialX + (currentX - startX)) + 'px';
            basket.style.top = (initialY + (currentY - startY)) + 'px';
        }

        function dragEnd() { isDragging = false; }
        basket.onclick = function() { if(!isDragging) { openCheckoutModal(); } };

        // Wholesale B2B Products with Tiers
        function getProducts() {
            let p = JSON.parse(localStorage.getItem('mme_b2b_products') || '[]');
            if(p.length === 0) {
                p = [
                    { name: "Designer Silk Saree", title: "Royal Katan Silk Saree (Bulk)", category: "Women's Fashion", basePrice: 120, tiers: [{qty: 10, price: 120}, {qty: 50, price: 100}, {qty: 100, price: 85}], shipping: autoShippingRate, desc: "Wholesale export quality hand-woven golden zari silk sarees." },
                    { name: "Executive Silk Suit", title: "Premium Men's Formal Wear (Bulk)", category: "Men's Fashion", basePrice: 80, tiers: [{qty: 10, price: 80}, {qty: 50, price: 70}, {qty: 100, price: 60}], shipping: autoShippingRate, desc: "Bulk tailored Italian cut luxury fabric for corporate retail." },
                    { name: "Golden Baby Stroller", title: "Ultra Safe Luxury Pram (Bulk)", category: "Baby", price: 200, tiers: [{qty: 5, price: 200}, {qty: 25, price: 175}, {qty: 50, price: 150}], shipping: autoShippingRate + 30, desc: "Gold-plated alloy frame wholesale shipment." },
                    { name: "Luxury Gift Hamper", title: "Gold-Accent Gift Box (Bulk)", category: "Gift", price: 45, tiers: [{qty: 20, price: 45}, {qty: 50, price: 40}, {qty: 100, price: 35}], shipping: autoShippingRate - 15, desc: "Exotic curated wholesale luxury gift items." },
                    { name: "Royal Gamar Bed", title: "Handcrafted Luxury Teak Bed (Bulk)", category: "Decor", price: 420, tiers: [{qty: 2, price: 420}, {qty: 10, price: 380}, {qty: 25, price: 340}], shipping: autoShippingRate + 60, desc: "Solid Gamar wood furniture wholesale bulk export." }
                ];
            }
            return p;
        }

        function loadMarketProducts(filterCat = "Women's Fashion") {
            let grid = document.getElementById('marketProductGrid');
            let products = getProducts().filter(p => p.category && p.category.toLowerCase() === filterCat.toLowerCase());
            grid.innerHTML = products.map((p) => `
                <div class="product-card">
                    <div class="product-img-box" onclick="openProductDetails('${p.title}')">
                        <img src="https://cdn-icons-png.flaticon.com/512/3176/3176363.png" alt="Product">
                    </div>
                    <div class="product-info">
                        <div class="product-title" onclick="openProductDetails('${p.title}')">${p.title}</div>
                        <div class="stars"><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i></div>
                        <div style="font-size:10px; color:var(--gold-primary); font-weight:bold;">Wholesale from $ ${p.tiers[0].price}</div>
                    </div>
                    <div class="card-actions">
                        <button class="card-btn" onclick="openProductDetails('${p.title}')">Select Tiers</button>
                    </div>
                </div>
            `).join('');
        }

        function filterCategory(cat, el) {
            document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            loadMarketProducts(cat);
        }

        function filterProducts() {
            let query = document.getElementById('searchInput').value.toLowerCase();
            let products = getProducts();
            let grid = document.getElementById('marketProductGrid');
            grid.innerHTML = products.filter(p => p.title.toLowerCase().includes(query) || p.category.toLowerCase().includes(query)).map((p) => `
                <div class="product-card">
                    <div class="product-img-box" onclick="openProductDetails('${p.title}')"><img src="https://cdn-icons-png.flaticon.com/512/3176/3176363.png"></div>
                    <div class="product-info">
                        <div class="product-title">${p.title}</div>
                        <div class="stars"><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i></div>
                        <div style="font-size:10px; color:var(--gold-primary); font-weight:bold;">Wholesale from $ ${p.tiers[0].price}</div>
                    </div>
                    <div class="card-actions"><button class="card-btn" onclick="openProductDetails('${p.title}')">Select Tiers</button></div>
                </div>
            `).join('');
        }

        function startVoiceSearch() {
            try {
                let rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
                rec.lang = 'en-US';
                rec.onresult = (e) => {
                    document.getElementById('searchInput').value = e.results[0][0].transcript;
                    filterProducts();
                };
                rec.start();
            } catch(e) {
                let txt = prompt("Type product name:");
                if(txt) { document.getElementById('searchInput').value = txt; filterProducts(); }
            }
        }

        function triggerImageSearch() { document.getElementById('imageUploadInput').click(); }
        function handleImageUpload(e) { alert("AI Visual Match Found!"); document.getElementById('searchInput').value = "Royal"; filterProducts(); }

        let currentQty = 10;
        let activeUnitPrice = 0;
        let activeShipping = 0;
        let activeTitle = "";
        let activeProductObj = null;

        function openProductDetails(title) {
            let p = getProducts().find(item => item.title === title) || getProducts()[0];
            activeProductObj = p;
            activeUnitPrice = p.tiers[0].price;
            activeShipping = p.shipping;
            activeTitle = p.title;
            currentQty = p.tiers[0].qty;

            let tiersHTML = p.tiers.map((t, idx) => `
                <div class="tier-btn ${idx === 0 ? 'selected' : ''}" onclick="selectTier(${t.qty}, ${t.price}, this)">
                    <div><b>${t.qty} Units</b></div>
                    <span>$${t.price} / unit</span>
                </div>
            `).join('');

            document.getElementById('modalBody').innerHTML = `
                <button class="close-modal" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
                <div class="details-stack">
                    <div>
                        <div class="large-preview-wrap"><img id="mainPreviewImg" src="https://cdn-icons-png.flaticon.com/512/3176/3176363.png"></div>
                        <div class="thumb-gallery">
                            <img src="https://cdn-icons-png.flaticon.com/512/3176/3176363.png" class="thumb-img" onclick="document.getElementById('mainPreviewImg').src=this.src">
                            <img src="https://cdn-icons-png.flaticon.com/512/2933/2933888.png" class="thumb-img" onclick="document.getElementById('mainPreviewImg').src=this.src">
                        </div>
                    </div>
                    <div>
                        <span style="font-size:8px; color:var(--gold-primary); font-weight:bold; letter-spacing:1px;">B2B WHOLESALE (${p.category})</span>
                        <h2 style="font-family:'Cormorant Garamond', serif; color:#fff; font-size:22px; margin:2px 0;">${p.title}</h2>
                        <div class="stars"><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i></div>
                        <p style="color:#aaa; font-size:10px; line-height:1.5; margin:6px 0;">${p.desc}</p>
                        
                        <div style="font-size:10px; color:var(--gold-light); margin-bottom:4px; font-weight:bold;">Select Bulk Tier or Enter Custom Quantity:</div>
                        <div class="wholesale-tier-grid">${tiersHTML}</div>

                        <div class="qty-box" style="margin-top:10px;">
                            <span style="font-size:10px; color:var(--gold-light);">Custom Qty:</span>
                            <button class="qty-btn" onclick="updateCustomQty(-5)">-</button>
                            <input type="number" id="customQtyInput" value="${currentQty}" min="1" oninput="onCustomQtyChange(this.value)" style="width:50px; background:#000; border:1px solid var(--gold-primary); color:#fff; text-align:center; font-weight:bold; border-radius:4px; padding:3px; font-size:11px;">
                            <button class="qty-btn" onclick="updateCustomQty(5)">+</button>
                        </div>

                        <div style="font-size:14px; color:var(--gold-primary); font-weight:bold;">Unit Price: $ <span id="unitPrice">${activeUnitPrice}</span></div>
                        <div style="font-size:10px; color:#aaa;">Bulk Shipping (${detectedCountry}): $ <span id="shippingFee">${activeShipping}</span></div>
                        <div style="font-size:13px; color:#fff; font-weight:bold; text-align:center; margin:8px 0;">Subtotal: $ <span id="totalItemPrice">${(activeUnitPrice * currentQty) + activeShipping}</span></div>

                        <button class="apply-btn" id="addToCartBtn">ADD TO WHOLESALE CART</button>
                    </div>
                </div>
            `;
            document.getElementById('productModal').style.display = 'flex';

            document.getElementById('addToCartBtn').onclick = function(e) {
                addCartAndAnimate(e, activeTitle, activeUnitPrice, activeShipping);
            };
        }

        function selectTier(qty, price, el) {
            document.querySelectorAll('.tier-btn').forEach(b => b.classList.remove('selected'));
            el.classList.add('selected');
            currentQty = qty;
            activeUnitPrice = price;
            document.getElementById('customQtyInput').value = qty;
            document.getElementById('unitPrice').innerText = activeUnitPrice;
            let subtotal = (activeUnitPrice * currentQty) + activeShipping;
            document.getElementById('totalItemPrice').innerText = subtotal;
        }

        function updateCustomQty(change) {
            currentQty += change;
            if(currentQty < 1) currentQty = 1;
            document.getElementById('customQtyInput').value = currentQty;
            calculateDynamicPrice(currentQty);
        }

        function onCustomQtyChange(val) {
            let q = parseInt(val);
            if(isNaN(q) || q < 1) q = 1;
            currentQty = q;
            calculateDynamicPrice(currentQty);
        }

        function calculateDynamicPrice(qty) {
            let tiers = activeProductObj.tiers;
            if(qty >= tiers[2].qty) activeUnitPrice = tiers[2].price;
            else if(qty >= tiers[1].qty) activeUnitPrice = tiers[1].price;
            else activeUnitPrice = tiers[0].price;

            document.getElementById('unitPrice').innerText = activeUnitPrice;
            let subtotal = (activeUnitPrice * qty) + activeShipping;
            document.getElementById('totalItemPrice').innerText = subtotal;
        }

        function playLuxurySound() {
            try {
                let ctx = new (window.AudioContext || window.webkitAudioContext)();
                let osc = ctx.createOscillator();
                let gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1600, ctx.currentTime + 0.25);
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.25);
            } catch(e) {}
        }

        function addCartAndAnimate(event, name, price, shipping) {
            let cart = JSON.parse(localStorage.getItem('mme_b2b_cart') || '[]');
            cart.push({ name: name, qty: currentQty, price: price, shipping: shipping });
            localStorage.setItem('mme_b2b_cart', JSON.stringify(cart));
            updateCartBadgeCount();

            playLuxurySound();
            closeModal();

            let btnRect = event.target.getBoundingClientRect();
            let basketRect = basket.getBoundingClientRect();

            let coin = document.createElement('div');
            coin.className = 'flying-coin';
            coin.style.left = btnRect.left + 'px';
            coin.style.top = btnRect.top + 'px';
            document.body.appendChild(coin);

            setTimeout(() => {
                coin.style.left = (basketRect.left + 15) + 'px';
                coin.style.top = (basketRect.top + 15) + 'px';
                coin.style.transform = 'scale(0.2) rotate(720deg)';
                coin.style.opacity = '0';
            }, 30);

            setTimeout(() => {
                coin.remove();
                let oldLeft = basket.style.left;
                let oldTop = basket.style.top;
                basket.classList.add('basket-center-focus');
                
                setTimeout(() => {
                    basket.classList.remove('basket-center-focus');
                    basket.style.left = oldLeft;
                    basket.style.top = oldTop;
                }, 800);
            }, 600);
        }

                <div class="cart-item-row">
                    <span><b>${item.name}</b> (Qty: ${item.qty}) - $ ${(item.price * item.qty)}</span>
                    <button class="cart-remove-btn" onclick="removeCartItem(${idx})"><i class="fa-solid fa-trash"></i></button>
                </div>

                <div style="margin-bottom: 15px;">
                    <div style="font-size:9px; color:var(--gold-light); text-transform:uppercase; margin-bottom:5px; font-weight:bold;">Selected Bulk Items (Manage / Remove):</div>
                    <div style="max-height: 120px; overflow-y: auto;">${cartItemsHTML}</div>
                </div>

                <div class="grand-total-box">
                    <div style="font-size:10px; color:#aaa; text-transform:uppercase;">Grand Total (Bulk Products + Freight Shipping)</div>
                    <div class="grand-total-price">$ ${grandTotal}</div>
                    <div style="font-size:9px; color:var(--gold-light);">Items: ${cart.length} | Freight Shipping Included: $ ${shipCost}</div>
                </div>

                <div class="form-group-grid">
                    <div>

                        <input type="text" id="custName" class="input-box" placeholder="Company / Full name">
                    </div>
                    <div>
                        <label style="font-size:8px; color:var(--gold-light); text-transform:uppercase; font-weight:bold;">Business Email *</label>
                        <input type="email" id="custEmail" class="input-box" placeholder="buyer@company.com">
                    </div>
                    <div>
                        <label style="font-size:8px; color:var(--gold-light); text-transform:uppercase; font-weight:bold;">WhatsApp / Business Phone *</label>
                        <div style="display:flex; gap:4px; margin-top:3px;">
                            <select id="countryPhoneCode" style="width:105px; background:#000; border:1px solid #333; color:#fff; padding:8px; border-radius:6px; font-size:10px;">
                                <option value="${detectedPhoneCode}">${detectedPhoneCode} (Auto)</option>
                                <option value="+93">+93 (Afghanistan)</option>
                                <option value="+355">+355 (Albania)</option>
                                <option value="+213">+213 (Algeria)</option>
                                <option value="+61">+61 (Australia)</option>
                                <option value="+43">+43 (Austria)</option>
                                <option value="+973">+973 (Bahrain)</option>
                                <option value="+880">+880 (Bangladesh)</option>
                                <option value="+32">+32 (Belgium)</option>
                                <option value="+55">+55 (Brazil)</option>
                                <option value="+1">+1 (Canada)</option>
                                <option value="+86">+86 (China)</option>
                                <option value="+45">+45 (Denmark)</option>
                                <option value="+20">+20 (Egypt)</option>
                                <option value="+33">+33 (France)</option>
                                <option value="+49">+49 (Germany)</option>
                                <option value="+852">+852 (Hong Kong)</option>
                                <option value="+91">+91 (India)</option>
                                <option value="+62">+62 (Indonesia)</option>
                                <option value="+353">+353 (Ireland)</option>
                                <option value="+972">+972 (Israel)</option>
                                <option value="+39">+39 (Italy)</option>
                                <option value="+81">+81 (Japan)</option>
                                <option value="+962">+962 (Jordan)</option>
                                <option value="+7">+7 (Kazakhstan)</option>

                                <option value="+60">+60 (Malaysia)</option>
                                <option value="+52">+52 (Mexico)</option>

                                <option value="+92">+92 (Pakistan)</option>
                                <option value="+63">+63 (Philippines)</option>

                            </select>
                            <input type="text" id="custPhone" class="input-box" placeholder="17XXXXXXXX / Number" style="margin-top:0;">
                        </div>
                    </div>
                    <div>
                        <label style="font-size:8px; color:var(--gold-light); text-transform:uppercase; font-weight:bold;">Country / Region *</label>
                        <input type="text" id="custCountry" class="input-box" value="${detectedCountry}">

                    <div>
                        <label style="font-size:8px; color:var(--gold-light); text-transform:uppercase; font-weight:bold;">City *</label>

        function removeCartItem(index) {
            let cart = JSON.parse(localStorage.getItem('mme_b2b_cart') || '[]');
            cart.splice(index, 1);
            localStorage.setItem('mme_b2b_cart', JSON.stringify(cart));
            updateCartBadgeCount();
            openCheckoutModal();
        }

        function submitFinalOrder(grandTotal) {
            let name = document.getElementById('custName').value;
            let email = document.getElementById('custEmail').value;
            let phoneCode = document.getElementById('countryPhoneCode').value;
            let phone = document.getElementById('custPhone').value;
            let country = document.getElementById('custCountry').value;
            let city = document.getElementById('custCity').value;
            let addr = document.getElementById('custAddr').value;
            let payment = document.getElementById('paymentMethod').value;
            let cart = JSON.parse(localStorage.getItem('mme_b2b_cart') || '[]');

            if(!name || !email || !phone || !country || !city || !addr) {
                alert("Please fill in all required wholesale shipping and contact fields.");
                return;
            }

            let orderData = {
                id: 'B2B-' + Math.floor(100000 + Math.random() * 900000),
                name: name, email: email, phone: phoneCode + ' ' + phone, country: country, city: city, addr: addr,
                payment: payment,
                total: '$ ' + grandTotal,
                status: 'Wholesale Processing / Bulk Dispatch',
                items: cart.map(i => `${i.name} (Qty: ${i.qty})`).join(', '),
                date: new Date().toLocaleString()
            };

            let orders = JSON.parse(localStorage.getItem('mme_b2b_orders') || '[]');
            orders.push(orderData);
            localStorage.setItem('mme_b2b_orders', JSON.stringify(orders));

            localStorage.removeItem('mme_b2b_cart');
            updateCartBadgeCount();
            alert("B2B Wholesale Order Placed Successfully!");
            closeModal();
        }

        function openAdminModal() {
            let p = prompt("Enter B2B Admin Password:");
            if(p === 'mrbtrmlc') {
                let orders = JSON.parse(localStorage.getItem('mme_b2b_orders') || '[]');
                let rows = orders.length > 0 ? orders.map(o => `<tr><td><b>${o.id}</b></td><td>${o.name}<br>${o.email} (${o.phone})</td><td>${o.status}<br>${o.payment}</td><td><b>${o.items}</b><br><span style="color:var(--gold-primary);">${o.total}</span></td></tr>`).join('') : '<tr><td colspan="4" style="text-align:center;">No wholesale orders yet.</td></tr>';
                document.getElementById('modalBody').innerHTML = `
                    <button class="close-modal" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
                    <h3 style="color:var(--gold-primary); text-align:center;">B2B Master Admin Panel</h3>
                    <p style="font-size:10px; color:#2ecc71;">Total Wholesale Orders: ${orders.length}</p>
                    <div style="max-height:300px; overflow-y:auto;"><table class="admin-table"><thead><tr><th>ID</th><th>Buyer</th><th>Status/Gateway</th><th>Total/Items</th></tr></thead><tbody>${rows}</tbody></table></div>
                `;
                document.getElementById('productModal').style.display = 'flex';
            } else if(p) {
                alert("Incorrect Password!");
            }
        }

        function closeModal() { document.getElementById('productModal').style.display = 'none'; }
    </script>
</body>
</html>

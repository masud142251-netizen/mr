<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr. Masudar - Royal Luxury Edition</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for Royal Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Cormorant+Garamond:wght@500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .font-cinzel { font-family: 'Cinzel', serif; }
        .font-playfair { font-family: 'Playfair Display', serif; }
        .font-cormorant { font-family: 'Cormorant Garamond', serif; }

        .golden-gradient-text {
            background: linear-gradient(135deg, #BF953F, #FCF6BA, #B38728, #FBF5B7, #AA771C);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .luxury-gold-btn {
            background: linear-gradient(135deg, #BF953F, #FCF6BA, #B38728, #FBF5B7, #AA771C);
            color: #000000;
            box-shadow: 0 0 15px rgba(191, 149, 63, 0.4);
            transition: all 0.3s ease;
        }
        .luxury-gold-btn:active { transform: scale(0.95); }

        /* Larger Golden Circular Border for Navigation Items */
        .golden-circle-icon {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #000000;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .golden-circle-icon::before {
            content: '';
            position: absolute;
            inset: -1.5px;
            border-radius: 50%;
            background: linear-gradient(135deg, #BF953F, #FCF6BA, #B38728, #FBF5B7, #AA771C);
            z-index: -1;
            pointer-events: none;
        }

        .golden-gradient-border {
            position: relative;
            border-radius: 0.85rem;
            background: #000000;
        }
        .golden-gradient-border::before {
            content: '';
            position: absolute;
            inset: -1.5px;
            border-radius: 0.95rem;
            background: linear-gradient(135deg, #BF953F, #FCF6BA, #B38728, #FBF5B7, #AA771C);
            z-index: -1;
            pointer-events: none;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .animate-slide-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>
<body class="bg-[#000000] text-[#FFFFFF] antialiased selection:bg-[#BF953F] selection:text-black pb-24">

    <!-- MOBILE-FIRST ROYAL LUXURY WRAPPER -->
    <div class="max-w-md mx-auto min-h-screen bg-[#000000] shadow-2xl relative flex flex-col border-x border-[#1a1a1a]">

        <!-- 1. TOP FLOATING CRYSTAL GLASS SEARCH BAR -->
        <div class="sticky top-0 z-40 bg-black/40 backdrop-blur-md px-3 py-2.5 border-b border-white/5 shadow-lg">
            <div class="relative flex items-center">
                <span class="absolute left-3 text-[#BF953F]">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </span>
                <input type="text" id="searchInput" placeholder="Search Mr. Masudar Collection..." class="w-full pl-9 pr-16 py-2 bg-black/50 border border-[#BF953F]/30 rounded-full text-xs font-cormorant text-white placeholder-gray-400 focus:ring-1 focus:ring-[#BF953F] outline-none shadow-inner">
                <div class="absolute right-3 flex items-center space-x-2 text-[#BF953F]">
                    <button onclick="triggerCameraSearch()" class="hover:text-white transition"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path></svg></button>
                    <button onclick="triggerVoiceSearch()" class="hover:text-white transition"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg></button>
                </div>
            </div>
        </div>

        <!-- 2. CATEGORY WHEEL DRAWER -->
        <div id="itemWheelContainer" class="hidden fixed inset-x-0 bottom-20 max-w-md mx-auto z-50 p-4 bg-black/95 backdrop-blur-2xl border-t border-[#BF953F]/30 rounded-t-3xl shadow-2xl animate-slide-up">
            <div class="flex items-center justify-between mb-3">
                <h3 class="font-cinzel text-xs font-bold golden-gradient-text tracking-wider">Select Category</h3>
                <button onclick="toggleItemWheel()" class="text-gray-400 hover:text-white text-sm font-bold px-2">✕</button>
            </div>
            <div class="grid grid-cols-2 gap-2 text-center">
                <button onclick="selectCategory('All')" class="p-2.5 bg-black/60 border border-[#BF953F]/40 rounded-xl font-cinzel text-xs text-white hover:border-[#BF953F] transition shadow-md">All</button>
                <button onclick="selectCategory('Furniture')" class="p-2.5 bg-black/60 border border-[#BF953F]/40 rounded-xl font-cinzel text-xs text-white hover:border-[#BF953F] transition shadow-md">Furniture</button>
                <button onclick="selectCategory('Baby')" class="p-2.5 bg-black/60 border border-[#BF953F]/40 rounded-xl font-cinzel text-xs text-white hover:border-[#BF953F] transition shadow-md">Baby</button>
                <button onclick="selectCategory('Gadget')" class="p-2.5 bg-black/60 border border-[#BF953F]/40 rounded-xl font-cinzel text-xs text-white hover:border-[#BF953F] transition shadow-md">Gadget</button>
                <button onclick="selectCategory('Digital')" class="p-2.5 bg-black/60 border border-[#BF953F]/40 rounded-xl font-cinzel text-xs text-white hover:border-[#BF953F] transition shadow-md">Digital</button>
                <button onclick="selectCategory('Agency')" class="p-2.5 bg-black/60 border border-[#BF953F]/40 rounded-xl font-cinzel text-xs text-white hover:border-[#BF953F] transition shadow-md">Agency</button>
            </div>
        </div>

        <!-- 3. TIGHT PINTEREST 9:16 MASONRY FEED (No Prices, Single Line Titles) -->
        <main class="flex-1 p-2 pt-2.5">
            <div class="grid grid-cols-2 gap-2 items-start">
                
                <!-- Column 1 -->
                <div class="space-y-2">
                    <div onclick="openProductDetail('Royal Gamar Wood Chair', '#101')" class="golden-gradient-border p-2 flex flex-col justify-between cursor-pointer group active:scale-95 transition shadow-lg">
                        <div>
                            <div class="bg-[#111] w-full aspect-[9/16] rounded-lg mb-1.5 flex items-center justify-center text-gray-400 text-xs overflow-hidden border border-[#222]">
                                <span class="font-cormorant tracking-widest text-xs">9:16 Visual</span>
                            </div>
                            <h3 class="font-playfair font-bold text-[11px] text-white truncate">Royal Gamar Wood Chair</h3>
                        </div>
                    </div>

                    <div onclick="openProductDetail('Smart Luxury Watch', '#103')" class="golden-gradient-border p-2 flex flex-col justify-between cursor-pointer group active:scale-95 transition shadow-lg">
                        <div>
                            <div class="bg-[#111] w-full aspect-[9/16] rounded-lg mb-1.5 flex items-center justify-center text-gray-400 text-xs overflow-hidden border border-[#222]">
                                <span class="font-cormorant tracking-widest text-xs">9:16 Visual</span>
                            </div>
                            <h3 class="font-playfair font-bold text-[11px] text-white truncate">Smart Luxury Watch</h3>
                        </div>
                    </div>
                </div>

                <!-- Column 2 (Offset Masonry) -->
                <div class="space-y-2 pt-4">
                    <div onclick="openProductDetail('Luxury Baby Combo Set', '#102')" class="golden-gradient-border p-2 flex flex-col justify-between cursor-pointer group active:scale-95 transition shadow-lg">
                        <div>
                            <div class="bg-[#111] w-full aspect-[9/16] rounded-lg mb-1.5 flex items-center justify-center text-gray-400 text-xs overflow-hidden border border-[#222]">
                                <span class="font-cormorant tracking-widest text-xs">9:16 Visual</span>
                            </div>
                            <h3 class="font-playfair font-bold text-[11px] text-white truncate">Luxury Baby Combo Set</h3>
                        </div>
                    </div>

                    <div onclick="openProductDetail('Professional Video Editing', '#104')" class="golden-gradient-border p-2 flex flex-col justify-between cursor-pointer group active:scale-95 transition shadow-lg">
                        <div>
                            <div class="bg-[#111] w-full aspect-[9/16] rounded-lg mb-1.5 flex items-center justify-center text-gray-400 text-xs overflow-hidden border border-[#222]">
                                <span class="font-cormorant tracking-widest text-xs">9:16 Visual</span>
                            </div>
                            <h3 class="font-playfair font-bold text-[11px] text-white truncate">Professional Video Editing</h3>
                        </div>
                    </div>
                </div>

            </div>
        </main>

        <!-- 4. BOTTOM NAVIGATION BAR (Equal Golden Circle Icons & Single-Line Text) -->
        <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto z-50 bg-[#000000] border-t border-[#BF953F]/30 px-2 py-1.5 flex items-center justify-between text-center shadow-2xl">
            
            <!-- 1. Digital Svc -->
            <button onclick="alert('Digital Studio & Svc Opening...')" class="flex-1 flex flex-col items-center text-gray-300 hover:text-[#BF953F] transition">
                <div class="golden-circle-icon mb-0.5">
                    <svg class="w-4 h-4 text-[#BF953F]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                </div>
                <span class="text-[9px] font-cinzel tracking-tight font-semibold whitespace-nowrap">Digital Svc</span>
            </button>

            <!-- 2. Seller -->
            <button onclick="openModal('sellerModal')" class="flex-1 flex flex-col items-center text-gray-300 hover:text-[#BF953F] transition">
                <div class="golden-circle-icon mb-0.5">
                    <svg class="w-4 h-4 text-[#BF953F]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                </div>
                <span class="text-[9px] font-cinzel tracking-tight font-semibold whitespace-nowrap">Seller</span>
            </button>

            <!-- 3. Center Mr. Masudar Branding & Logo with Golden Circle -->
            <button onclick="window.scrollTo({top: 0, behavior: 'smooth'})" id="stealthTrigger" class="flex-1 flex flex-col items-center transition group">
                <div class="golden-circle-icon mb-0.5 overflow-hidden">
                    <img src="https://lh3.googleusercontent.com/d/1iph42wSVX9xNglnVKSKTXicbInSJ3y4j=s220" alt="Mr. Masudar" class="w-full h-full object-cover rounded-full">
                </div>
                <span class="text-[9px] font-cinzel golden-gradient-text tracking-tight font-extrabold whitespace-nowrap">Mr. Masudar</span>
            </button>

            <!-- 4. Earn -->
            <button onclick="openModal('earnModal')" class="flex-1 flex flex-col items-center text-gray-300 hover:text-[#BF953F] transition">
                <div class="golden-circle-icon mb-0.5">
                    <svg class="w-4 h-4 text-[#BF953F]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                </div>
                <span class="text-[9px] font-cinzel tracking-tight font-semibold whitespace-nowrap">Earn</span>
            </button>

            <!-- 5. Items -->
            <button onclick="toggleItemWheel()" class="flex-1 flex flex-col items-center text-gray-300 hover:text-[#BF953F] transition">
                <div class="golden-circle-icon mb-0.5">
                    <svg class="w-4 h-4 text-[#BF953F]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>
                </div>
                <span class="text-[9px] font-cinzel tracking-tight font-semibold whitespace-nowrap">Items</span>
            </button>

        </nav>

        <!-- 5. PRODUCT DETAIL POPUP -->
        <div id="productDetailModal" class="fixed inset-0 z-50 bg-black/90 backdrop-blur-md hidden items-end sm:items-center justify-center p-0 sm:p-4">
            <div class="bg-[#0a0a0a] border border-[#BF953F]/40 w-full max-w-sm rounded-t-3xl sm:rounded-3xl p-5 relative max-h-[90vh] overflow-y-auto no-scrollbar animate-slide-up text-white shadow-2xl">
                <button onclick="closeModal('productDetailModal')" class="absolute top-4 right-4 bg-[#222] w-8 h-8 rounded-full flex items-center justify-center text-gray-300 hover:text-white text-xs">✕</button>
                <div class="w-full aspect-[9/16] bg-black rounded-2xl mb-3 flex items-center justify-center text-gray-500 text-xs border border-[#333]">
                    <span class="font-cormorant tracking-widest">9:16 Video Player</span>
                </div>
                <h2 id="modalTitle" class="font-playfair text-base font-bold text-white mb-3">Product Title</h2>
                <div class="space-y-2.5">
                    <button onclick="alert('Order Placed Successfully!')" class="w-full py-3 luxury-gold-btn rounded-2xl text-xs font-cinzel font-bold tracking-wider">BUY NOW</button>
                    <button onclick="shareProduct()" class="w-full py-2.5 bg-[#1a1a1a] text-gray-300 rounded-2xl text-xs font-cormorant hover:bg-[#262626]">↗ Share & Copy Link</button>
                </div>
            </div>
        </div>

        <!-- 6. STEALTH ADMIN PANEL -->
        <div id="adminModal" class="fixed inset-0 z-50 bg-black/95 backdrop-blur-md hidden items-center justify-center p-4">
            <div class="bg-gray-900 border border-[#BF953F]/50 w-full max-w-md rounded-3xl p-5 relative text-white">
                <button onclick="closeModal('adminModal')" class="absolute top-4 right-4 text-gray-400 font-bold text-xs">✕</button>
                <h2 class="font-cinzel text-sm font-bold golden-gradient-text mb-1">🔒 Master Admin Control</h2>
                <p class="font-cormorant text-xs text-gray-400">Mr. Masudar Core Cloud Engine Active.</p>
            </div>
        </div>

    </div>

    <!-- SCRIPT -->
    <script>
        function openModal(id) { document.getElementById(id).classList.add('flex'); document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.remove('flex'); document.getElementById(id).classList.add('hidden'); }

        function toggleItemWheel() {
            let wheel = document.getElementById('itemWheelContainer');
            wheel.classList.toggle('hidden');
        }

        function selectCategory(cat) {
            alert(cat + " category selected!");
            toggleItemWheel();
        }

        function openProductDetail(title, seller) {
            document.getElementById('modalTitle').innerText = title;
            openModal('productDetailModal');
        }

        let clickCount = 0;
        document.getElementById('stealthTrigger').addEventListener('click', () => {
            clickCount++;
            if (clickCount >= 5) {
                clickCount = 0;
                openModal('adminModal');
            }
        });

        function triggerCameraSearch() {
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ video: true }).then(stream => {
                    alert("Camera active for visual search!");
                    stream.getTracks().forEach(track => track.stop());
                }).catch(err => alert("Camera access denied or unavailable."));
            } else {
                alert("Camera not supported on this browser.");
            }
        }

        function triggerVoiceSearch() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (SpeechRecognition) {
                const recognition = new SpeechRecognition();
                recognition.lang = 'bn-BD';
                recognition.start();
                recognition.onresult = function(event) {
                    const speechResult = event.results[0][0].transcript;
                    document.getElementById('searchInput').value = speechResult;
                    alert("Voice search: " + speechResult);
                };
                recognition.onerror = function() { alert("Voice recognition error."); };
            } else {
                alert("Voice search is not supported in this browser.");
            }
        }

        function shareProduct() { navigator.clipboard.writeText(window.location.href); alert("Royal Link Copied!"); }
    </script>
</body>
</html>
